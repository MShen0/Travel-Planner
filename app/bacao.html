<title>拔草计划</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column of platform-tile panels; a trip is drawn as a metro line (day = line, stop = station). */
:root {
  --bg: #EEF1EF;
  --surface: #FFFFFF;
  --surface-2: #E4E9E6;
  --ink: #17201C;
  --muted: #56645E;
  --hair: #D3DBD7;
  --accent: #0C7556;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9EEE6;
  --exit: #FFC629;
  --exit-ink: #1A1A1A;
  --warn: #A9521D;
  --danger: #C02A25;
  --ok: #1E8449;
  --scrim: rgb(14 20 17 / .45);
  --d1: #E08600; --d2: #D7151F; --d3: #0090B8; --d4: #0D9467; --d5: #7D60CC;
  --d6: #9C5E31; --d7: #A07F45; --d8: #00897D; --d9: #66808C;
  --font-sans: "Overpass", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "Overpass Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
  --shadow: 0 1px 2px rgb(16 24 20 / .06), 0 6px 20px rgb(16 24 20 / .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --surface: #18201D; --surface-2: #222C28; --ink: #E6ECE9; --muted: #9AAAA3; --hair: #2D3934;
    --accent: #3CC08F; --accent-ink: #062117; --accent-soft: #163A2D; --exit: #FFC629; --exit-ink: #1A1A1A;
    --warn: #E28A52; --danger: #F0645E; --ok: #4CC07D; --scrim: rgb(0 0 0 / .6);
    --d1: #F39A1F; --d2: #F0474F; --d3: #2EB5DC; --d4: #2DBE8C; --d5: #A28AF0;
    --d6: #C98A5A; --d7: #CCAA6E; --d8: #2BC2B3; --d9: #93A9B4;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #18201D; --surface-2: #222C28; --ink: #E6ECE9; --muted: #9AAAA3; --hair: #2D3934;
  --accent: #3CC08F; --accent-ink: #062117; --accent-soft: #163A2D; --exit: #FFC629; --exit-ink: #1A1A1A;
  --warn: #E28A52; --danger: #F0645E; --ok: #4CC07D; --scrim: rgb(0 0 0 / .6);
  --d1: #F39A1F; --d2: #F0474F; --d3: #2EB5DC; --d4: #2DBE8C; --d5: #A28AF0;
  --d6: #C98A5A; --d7: #CCAA6E; --d8: #2BC2B3; --d9: #93A9B4;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; display: block; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* shell */
.shell { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--hair); margin-inline: -16px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 15px; background: var(--surface); flex: none; }
.brand strong { display: block; font-size: 17px; letter-spacing: .02em; }
.brand small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .spacer { flex: 1; }
.tabs-top { display: none; gap: 4px; }
.tab { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 8px 12px; border-radius: var(--radius); cursor: pointer; color: var(--muted); font-weight: 600; }
.tab[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 -3px 0 var(--accent); }
.tab .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--hair); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .tab { flex-direction: column; gap: 2px; padding: 8px 4px 10px; font-size: 12px; border-radius: 0; justify-content: center; }
.tabbar .tab[aria-current="page"] { background: none; box-shadow: inset 0 3px 0 var(--accent); color: var(--accent); }
@media (min-width: 860px) {
  .tabbar { display: none; }
  .tabs-top { display: flex; }
  .shell { padding-block-end: 48px; }
}

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--hair); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: var(--radius); border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.stack { display: grid; gap: 12px; }
.fab { position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 25; box-shadow: var(--shadow); min-height: 48px; padding-inline: 18px; border-radius: 24px; }
@media (min-width: 860px) { .fab { bottom: 28px; right: max(16px, calc(50vw - 524px)); } }

/* chips */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--hair); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .n { font-family: var(--font-mono); font-size: 12px; opacity: .7; }
a.chip { text-decoration: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.example { background: var(--exit); color: var(--exit-ink); }
.tag.ai { background: var(--accent-soft); color: var(--accent); }
.tag.agent { border: 1px solid var(--hair); background: none; }
.status { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--hair); background: none; cursor: pointer; color: var(--muted); white-space: nowrap; }
.status.want { color: var(--accent); border-color: var(--accent); }
.status.visited { background: var(--ok); border-color: var(--ok); color: #fff; }
.exit { display: inline-flex; align-items: center; gap: 4px; background: var(--exit); color: var(--exit-ink); font-weight: 800; font-size: 12px; padding: 1px 7px; border-radius: 3px; letter-spacing: .02em; }

/* sections */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-block: 22px 10px; }
.section-head h2 { font-size: 20px; }
.section-head h3 { font-size: 16px; }
.filters { display: grid; gap: 8px; margin-block: 14px 4px; }
.search { width: 100%; min-height: 42px; padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--hair); background: var(--surface); font-size: 16px; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--hair); font-size: 14px; }
.notice.warn { border-color: var(--warn); }
.notice .ic { margin-top: 2px; color: var(--accent); }
.notice.warn .ic { color: var(--warn); }

/* places */
.city-head { display: flex; align-items: center; gap: 10px; margin-block: 22px 8px; }
.city-head h3 { font-size: 17px; }
.city-head .line { flex: 1; height: 1px; background: var(--hair); }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
.place { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius); }
.place.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.thumb { width: 64px; height: 64px; border-radius: 4px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.place h4 { margin: 0; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.place .local { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.place .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.place .tips { font-size: 13px; color: var(--muted); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.place .must { font-size: 13px; margin-top: 6px; }
.place .must b { font-weight: 600; color: var(--accent); }
.place .actions { display: flex; gap: 4px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.place .pick { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; accent-color: var(--accent); }
.src { font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; max-width: 100%; overflow: hidden; }
.src a { color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.selectbar { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 26; display: flex; justify-content: center; padding-inline: 16px; pointer-events: none; }
.selectbar > div { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 16px; box-shadow: var(--shadow); max-width: 100%; }
.selectbar .btn.ghost { color: var(--bg); }
@media (min-width: 860px) { .selectbar { bottom: 24px; } }

/* empty state */
.empty { margin-block: 28px; padding: 24px; background: var(--surface); border: 1px dashed var(--hair); border-radius: var(--radius); display: grid; gap: 14px; justify-items: start; }
.empty h2 { font-size: 20px; }
.steps-intro { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
.steps-intro li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; counter-increment: s; }
.steps-intro li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--accent); display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; font-weight: 600; }

/* sheets */
.backdrop { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); background: var(--bg); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); outline: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px; border-bottom: 1px solid var(--hair); }
.sheet-head h2 { font-size: 18px; flex: 1; }
.sheet-body { overflow-y: auto; padding: 16px; display: grid; gap: 14px; overscroll-behavior: contain; }
.sheet-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--hair); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; background: var(--bg); border-radius: 0 0 14px 14px; }
@media (min-width: 720px) {
  .backdrop { align-items: center; padding: 24px; }
  .sheet { max-width: 640px; border-radius: 12px; max-height: 88vh; }
  .sheet.wide { max-width: 860px; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .22s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}

/* forms */
.field { display: grid; gap: 6px; }
.field > label, .label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input, textarea.input, select.input { width: 100%; min-height: 42px; padding: 9px 12px; border-radius: var(--radius); border: 1px solid var(--hair); background: var(--surface); font-size: 16px; }
textarea.input { resize: vertical; min-height: 120px; line-height: 1.5; }
.two { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.three { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 520px) { .two, .three { grid-template-columns: 1fr; } }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.hint { font-size: 13px; color: var(--muted); }
.detected { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.media { display: flex; gap: 8px; flex-wrap: wrap; }
.media figure { position: relative; margin: 0; width: 76px; height: 96px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.media img { width: 100%; height: 100%; object-fit: cover; }
.media figure button { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgb(0 0 0 / .6); color: #fff; display: grid; place-items: center; cursor: pointer; }
.media figure figcaption { position: absolute; left: 3px; bottom: 3px; font-size: 10px; background: rgb(0 0 0 / .6); color: #fff; padding: 0 4px; border-radius: 3px; font-family: var(--font-mono); }
.dropzone { border: 1px dashed var(--hair); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; background: var(--surface); }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.checklist { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; padding: 4px; border: 1px solid var(--hair); border-radius: var(--radius); background: var(--surface); }
.check-row { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.check-row:hover { background: var(--surface-2); }
.check-row input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.check-row .grow { flex: 1; min-width: 0; }

/* review of AI results */
.review { display: grid; gap: 8px; }
.review-item { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 10px; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius); }
.review-item.off { opacity: .55; }
.review-item input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.review-item .edit-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.review-item .edit-row input, .review-item .edit-row select { min-height: 34px; padding: 4px 8px; font-size: 14px; }
.evidence { font-size: 12px; color: var(--muted); border-left: 3px solid var(--hair); padding-left: 8px; margin-top: 6px; }

/* AI progress */
.progress { display: grid; gap: 10px; padding: 16px; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius); }
.progress .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; position: relative; }
.progress .bar::after { content: ""; position: absolute; inset: 0; width: 35%; background: var(--accent); border-radius: 3px; }
@media (prefers-reduced-motion: no-preference) { .progress .bar::after { animation: slide 1.3s ease-in-out infinite; } @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } } }
.progress .peek { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: pre-wrap; max-height: 5.6em; overflow: hidden; overflow-wrap: anywhere; }

/* trips */
.trip-card { display: grid; gap: 8px; padding: 14px; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius); cursor: pointer; text-align: left; width: 100%; }
.trip-card:hover { border-color: var(--muted); }
.trip-card h3 { font-size: 17px; }
.strip { display: flex; gap: 3px; height: 8px; }
.strip span { border-radius: 4px; min-width: 8px; }
.trip-head { display: grid; gap: 8px; margin-block: 16px 8px; }
.trip-head h1 { font-size: 24px; }
.trip-layout { display: grid; gap: 16px; }
@media (min-width: 900px) { .trip-layout { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; } .trip-layout .map-col { position: sticky; top: 74px; } }
.daychips { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px 6px; scrollbar-width: thin; }
.daychip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--hair); background: var(--surface); padding: 5px 12px 5px 6px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink); }
.daychip .code { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; font-weight: 600; background: var(--surface); }
.daychip[aria-pressed="true"] { border-color: var(--line); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.map-box { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius); overflow: hidden; }
.map-box svg { display: block; width: 100%; height: auto; }
.map-box .cap { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.map-grid { stroke: var(--hair); stroke-width: 1; }
.map-label { font-size: 12px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; font-family: var(--font-sans); }
.map-num { font-family: var(--font-mono); font-size: 10px; font-weight: 600; fill: var(--ink); }
.map-scale { stroke: var(--ink); stroke-width: 2; }
.map-scale-text { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }
.day-head { display: grid; gap: 4px; padding: 12px 0 6px; }
.day-head .title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.day-head .badge { width: 30px; height: 30px; border-radius: 50%; border: 4px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 12px; background: var(--surface); flex: none; }
.day-head h3 { font-size: 18px; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 50px 36px minmax(0, 1fr); column-gap: 10px; }
.timeline .time { font-family: var(--font-mono); font-size: 14px; font-weight: 600; text-align: right; padding-top: 7px; font-variant-numeric: tabular-nums; }
.timeline .rail { position: relative; display: flex; justify-content: center; }
.timeline .rail::before { content: ""; position: absolute; left: 50%; width: 6px; margin-left: -3px; top: 0; bottom: 0; background: var(--line); }
.timeline li.first .rail::before { top: 18px; }
.timeline li.last .rail::before { bottom: auto; height: 18px; }
.timeline li.only .rail::before { display: none; }
.station { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 4px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
.station.suggested { border-style: dashed; }
.station.done { background: var(--line); color: var(--surface); }
.stop-body { padding: 6px 0 16px; min-width: 0; }
.stop-body h4 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; overflow-wrap: anywhere; }
.stop-body .local { font-size: 13px; color: var(--muted); }
.stop-body .what { margin-top: 4px; font-size: 14px; }
.stop-body .tip { margin-top: 4px; font-size: 13px; color: var(--muted); }
.stop-body .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.leg .rail::before { opacity: .55; }
.leg-body { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0 12px; font-size: 13px; color: var(--muted); min-width: 0; }

    </div>

      : html`<p class="hint">小红书攻略的店名常写在图里：截几张图加进来，识别会准很多。也可以直接把截图粘贴到上面的输入框。</p>`}

/* --- add (collect) sheet --- */
function AddSheet({ ctx, onClose }) {
  const [text, setText] = useState('');
  const [cityHint, setCityHint] = useState('');
  const m = useMedia(ctx.ai.images ? ctx.ai.images.maxCount : 0, ctx.toast);
  const media = m.media;
  const [phase, setPhase] = useState('input');
  const [result, setResult] = useState(null);
  const [stream, setStream] = useState('');
  const [started, setStarted] = useState(0);
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);
  const ctl = useRef(null);
  useEffect(() => () => ctl.current && ctl.current.abort(), []);
  const url = pickUrl(text);
  const platform = detectPlatform(url || text);
  const title = shareTitle(text);
  const words = contentText(text);
  const thin = !!url && words.length < 40 && !media.length;

  async function identify() {
    setError(''); setStream(''); setStarted(Date.now()); setPhase('working');
    ctl.current = new AbortController();
    try {
      const prompt = buildExtractPrompt({ text, url, platform, cityHint: cityHint.trim(), imageCount: media.length, lang: ctx.prefs.aiLang, knownCities: ctx.cities });
      const raw = await ctx.ai.json(prompt, { images: media.map(x => x.blob), onText: setStream, signal: ctl.current.signal });
      const norm = normalizeExtraction(raw, { cityHint: cityHint.trim(), title });
      norm.places = norm.places.map(p => { const dup = findDuplicate(p, ctx.places); return { ...p, _dup: dup, _keep: !dup }; });
      setResult(norm); setPhase('review');
    } catch (e) {
      setPhase('input');
      if (e && e.code === 'cancelled') return;
      setError(aiErrorText(e));
      if (PERMANENT_AI_ERRORS.has(e && e.code)) ctx.onAiBlocked(e.code);
    }
  }
  async function save() {
    const keep = result.places.filter(p => p._keep);
    if (!keep.length) return onClose();
    setSaving(true);
    let coverAssetId = null;
    if (media.length && ctx.assets) {
      try { coverAssetId = (await ctx.assets.upload(await shrinkImage(media[0].blob, 640, 0.8))).id; } catch { /* the place saves without a picture */ }
    }
    const source = { platform: url ? platform : 'manual', url: url || '', title: result.post.title || title || '' };
    let n = 0;
    for (const p of keep) {
      const { _dup, _keep, evidence, ...clean } = p;
      const doc = makePlaceDoc(clean, { source: { ...source, evidence }, coverAssetId, savedVia: 'app' });
      if (await ctx.write('set', 'places', doc.id, doc)) n++;
    }
    setSaving(false);
    if (n) { ctx.toast(`已种草 ${n} 个地点`); onClose(); }
  }
  async function toAgent() {
    const doc = { id: uid('i'), text: text.slice(0, 4000), url: url || '', platform, cityHint: cityHint.trim(), mode: 'collect', status: 'pending', message: '', createdAt: Date.now() };
    if (await ctx.write('set', 'inbox', doc.id, doc)) { ctx.toast('已放进「待处理」，Agent 下次运行时会读取这条链接'); onClose(); }
  }
  const setPlace = (i, patch) => setResult(r => ({ ...r, places: r.places.map((p, j) => (j === i ? { ...p, ...patch } : p)) }));
  const keepCount = result ? result.places.filter(p => p._keep).length : 0;

  let footer;
  if (phase === 'input') {
    footer = html`
      <button class="btn" disabled=${!url} onClick=${toAgent} title="把链接交给 Claude Code Agent 读取全文和图片"><${Icon} name="bot" size=${16} />交给 Agent</button>
      <button class="btn primary" disabled=${!ctx.ai.ok || (!words && !media.length)} onClick=${identify}><${Icon} name="spark" size=${16} />AI 识别地点</button>`;
  } else if (phase === 'review') {
    footer = html`
      <button class="btn ghost" onClick=${() => setPhase('input')}>返回修改</button>
      <button class="btn primary" disabled=${saving || !keepCount} onClick=${save}><${Icon} name="bookmark" size=${16} />${saving ? '保存中…' : `种草 ${keepCount} 个地点`}</button>`;
  }
  return html`<${Sheet} title="添加种草" onClose=${onClose} footer=${footer}>
    ${phase === 'input' && html`
      <div class="field">
        <label for="add-text">分享文字、链接或笔记正文</label>
        <textarea id="add-text" class="input" rows="5" value=${text} onInput=${e => setText(e.target.value)} onPaste=${m.onPaste}
          placeholder="在小红书 / IG / 抖音点「分享 → 复制链接」，粘贴到这里。正文能复制的话一起粘贴。"></textarea>
        ${(url || title) && html`<div class="detected">
          ${url && html`<span class="tag">${PLATFORMS[platform] || '网页'}</span>`}
          ${title && html`<span class="muted">${title}</span>`}
        </div>`}
      </div>
      ${thin && html`<div class="notice warn"><${Icon} name="info" />
        <div>这里只有链接${title ? '和标题' : ''}，Claude 在这个页面里打不开链接。请再<b>加几张笔记截图</b>或粘贴正文；或者点「交给 Agent」，让 Claude Code 自动读取原帖的全文和图片。</div></div>`}
      <${MediaPicker} m=${m} aiOk=${ctx.ai.ok} />
      <div class="field">
        <label for="add-city">城市（可选，帮 AI 判断）</label>
        <input id="add-city" class="input" list="known-cities" value=${cityHint} onInput=${e => setCityHint(e.target.value)} placeholder="例如：东京、首尔、成都" />
      </div>
      ${!ctx.ai.ok && html`<div class="notice warn"><${Icon} name="info" /><div>${ctx.ai.reason}</div></div>`}
      ${error && html`<div class="notice warn" role="alert"><${Icon} name="info" /><div>${error}</div></div>`}`}
    ${phase === 'working' && html`<${AiProgress} label="正在识别地点" text=${stream} started=${started} onStop=${() => ctl.current && ctl.current.abort()}
        counter=${t => `已找到 ${(t.match(/"name"\s*:/g) || []).length} 个`} />`}
    ${phase === 'review' && result && html`
      <div class="stack">
        <div>
          <strong>${result.post.title || title || '识别结果'}</strong>
          ${result.post.summary && html`<p class="hint">${result.post.summary}</p>`}
        </div>
        ${!result.places.length && html`<div class="notice warn"><${Icon} name="info" /><div>没找到具体地点。加几张截图（店名常在图里），或者交给 Agent 读取原帖。</div></div>`}
        <div class="review">
          ${result.places.map((p, i) => html`<div key=${i} class=${'review-item' + (p._keep ? '' : ' off')}>
            <input type="checkbox" id=${'keep-' + i} checked=${p._keep} onChange=${e => setPlace(i, { _keep: e.target.checked })} aria-label=${'保留 ' + p.name} />
            <div style=${{ minWidth: 0 }}>
              <div class="row"><strong>${p.name}</strong>${p.nameLocal && p.nameLocal !== p.name ? html`<span class="muted small">${p.nameLocal}</span>` : null}
                ${p._dup ? html`<span class="tag">已收藏过</span>` : null}</div>
              <div class="hint">${[p.city, p.area, CAT_LABEL[p.category]].filter(Boolean).join(' · ')}${p.coordConfidence ? '' : ' · 位置未知'}</div>
              ${p.mustTry.length ? html`<div class="small">必试：${p.mustTry.join('、')}</div>` : null}
              ${p.tips ? html`<div class="small muted">${p.tips}</div>` : null}
              ${p.evidence ? html`<div class="evidence">“${p.evidence}”</div>` : null}
              <div class="edit-row">
                <input class="input" id=${'city-' + i} aria-label="城市" value=${p.city} onInput=${e => setPlace(i, { city: e.target.value })} />
                <select class="input" id=${'cat-' + i} aria-label="类别" value=${p.category} onChange=${e => setPlace(i, { category: e.target.value })}>
                  ${CATEGORIES.map(([k, v]) => html`<option value=${k}>${v}</option>`)}
                </select>
              </div>
            </div>
          </div>`)}
        </div>
      </div>`}
  <//>`;
}

/* --- trip planning --- */
function TripSheet({ ctx, onClose, initial }) {
  const { places } = ctx;
  const initialIds = initial.placeIds || [];
  const firstCity = initial.city || (initialIds.length ? (places.find(p => p.id === initialIds[0]) || {}).city : '') || (ctx.cities[0] || '');
  const [city, setCity] = useState(firstCity);
  const [days, setDays] = useState(3);
  const [startDate, setStartDate] = useState('');
  const [base, setBase] = useState('');
  const [pace, setPace] = useState('normal');
  const [transport, setTransport] = useState('transit');
  const [notes, setNotes] = useState('');
  const [suggest, setSuggest] = useState(true);
  const cityPlaces = places.filter(p => sameCity(p.city, city) && normKey(city));
  const [picked, setPicked] = useState(() => new Set(initialIds.length ? initialIds : cityPlaces.filter(p => p.status !== 'visited').map(p => p.id)));
  const [phase, setPhase] = useState('form');
  const [stream, setStream] = useState('');
  const [started, setStarted] = useState(0);
  const [error, setError] = useState('');
  const ctl = useRef(null);
  useEffect(() => () => ctl.current && ctl.current.abort(), []);
  useEffect(() => { if (!initialIds.length) setPicked(new Set(cityPlaces.filter(p => p.status !== 'visited').map(p => p.id))); }, [city]);
  const chosen = places.filter(p => picked.has(p.id));
  const toggle = id => setPicked(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const listed = initialIds.length ? places.filter(p => initialIds.includes(p.id) || sameCity(p.city, city)) : cityPlaces;

  async function generate() {
    setError(''); setStream(''); setStarted(Date.now()); setPhase('working');
    ctl.current = new AbortController();
    const trip = { city: city.trim(), days, startDate, base: base.trim() ? { name: base.trim() } : null, prefs: { pace, transport, notes: notes.trim() } };
    try {
      const { groups, noCoord } = clusterIntoDays(chosen, days, null);
      const prompt = buildPlanPrompt({ trip, places: chosen, groups, noCoord, lang: ctx.prefs.aiLang, allowSuggest: suggest });
      const raw = await ctx.ai.json(prompt, { tier: ctx.prefs.deepPlan ? 'complex' : 'default', onText: setStream, signal: ctl.current.signal, cache: false });
      const byId = Object.fromEntries(chosen.map(p => [p.id, p]));
      const country = (chosen.find(p => p.country) || {}).country || '';
      const plan = normalizePlan(raw, byId, { startDate, baseName: base.trim(), placeIds: chosen.map(p => p.id), city: trip.city, country });
      if (!plan.days.length) throw { code: 'invalid_json' };
      const now = Date.now();
      const doc = { id: uid('t'), title: plan.title || `${trip.city} ${days} 日`, city: trip.city, country, days, startDate, base: plan.base, prefs: { ...trip.prefs, suggest }, placeIds: chosen.map(p => p.id), plan, example: false, createdAt: now, updatedAt: now };
      if (await ctx.write('set', 'trips', doc.id, doc)) { ctx.toast('行程排好了'); ctx.openView({ type: 'trip', id: doc.id }); onClose(); }
      else setPhase('form');
    } catch (e) {
      setPhase('form');
      if (e && e.code === 'cancelled') return;
      setError(aiErrorText(e));
      if (PERMANENT_AI_ERRORS.has(e && e.code)) ctx.onAiBlocked(e.code);
    }
  }
  const footer = phase === 'form' ? html`
    <span class="hint" style=${{ marginRight: 'auto' }}>${chosen.length} 个地点 · ${days} 天</span>
    <button class="btn" onClick=${onClose}>取消</button>
    <button class="btn primary" disabled=${!ctx.ai.ok || !chosen.length || !city.trim()} onClick=${generate}><${Icon} name="spark" size=${16} />生成行程</button>` : null;
  return html`<${Sheet} title="排行程" onClose=${onClose} footer=${footer} wide>
    ${phase === 'working' ? html`<${AiProgress} label="正在排路线" text=${stream} started=${started} onStop=${() => ctl.current && ctl.current.abort()}
        counter=${t => `已排 ${(t.match(/"time"\s*:/g) || []).length} 站`} />` : html`
      <div class="three">
        <div class="field"><label for="tp-city">城市</label><input id="tp-city" class="input" list="known-cities" value=${city} onInput=${e => setCity(e.target.value)} /></div>
        <div class="field"><label for="tp-days">天数</label>
          <select id="tp-days" class="input" value=${days} onChange=${e => setDays(+e.target.value)}>${Array.from({ length: 14 }, (_, i) => html`<option value=${i + 1}>${i + 1} 天</option>`)}</select></div>
        <div class="field"><label for="tp-date">出发日期（可选）</label><input id="tp-date" class="input" type="date" value=${startDate} onInput=${e => setStartDate(e.target.value)} /></div>
      </div>
      <div class="field"><label for="tp-base">住哪里（酒店名或区域，可选）</label><input id="tp-base" class="input" value=${base} onInput=${e => setBase(e.target.value)} placeholder="例如：新宿站附近 / 明洞 / 春熙路" /></div>
      <div class="two">
        <div class="field"><span class="label">节奏</span><div class="seg">${Object.entries(PACES).map(([k, v]) => html`<button class="chip" aria-pressed=${pace === k} onClick=${() => setPace(k)}>${v}</button>`)}</div></div>
        <div class="field"><span class="label">交通</span><div class="seg">${Object.entries(TRANSPORTS).map(([k, v]) => html`<button class="chip" aria-pressed=${transport === k} onClick=${() => setTransport(k)}>${v}</button>`)}</div></div>
      </div>
      <div class="field"><label for="tp-notes">其他要求（可选）</label><input id="tp-notes" class="input" value=${notes} onInput=${e => setNotes(e.target.value)} placeholder="例如：第二天要去迪士尼、带老人少走路、想看日落" /></div>
      <label class="check-row" style=${{ padding: 0 }}><input type="checkbox" checked=${suggest} onChange=${e => setSuggest(e.target.checked)} /><span>允许 AI 补充顺路的吃饭推荐（会标「AI 推荐」）</span></label>
      <div class="field">
        <div class="row" style=${{ justifyContent: 'space-between' }}><span class="label">要去的地点（${chosen.length}/${listed.length}）</span>
          <span class="row"><button class="btn ghost sm" onClick=${() => setPicked(new Set(listed.map(p => p.id)))}>全选</button><button class="btn ghost sm" onClick=${() => setPicked(new Set())}>全不选</button></span></div>
        ${listed.length ? html`<div class="checklist">${listed.map(p => html`<label key=${p.id} class="check-row"><input type="checkbox" checked=${picked.has(p.id)} onChange=${() => toggle(p.id)} />
            <${Icon} name=${p.category} size=${16} /><span class="grow">${p.name} <span class="muted small">${p.area || ''}</span></span>
            ${p.status === 'want' ? html`<span class="tag ai">想去</span>` : p.status === 'visited' ? html`<span class="tag">去过</span>` : null}</label>`)}</div>`
          : html`<p class="hint">这个城市还没有种草。先去「种草」添加几个地点。</p>`}
      </div>
      ${!ctx.ai.ok && html`<div class="notice warn"><${Icon} name="info" /><div>${ctx.ai.reason}</div></div>`}
      ${error && html`<div class="notice warn" role="alert"><${Icon} name="info" /><div>${error}</div></div>`}`}
  <//>`;
}

function useNarrow(breakpoint) {
  const [narrow, setNarrow] = useState(() => window.innerWidth < breakpoint);
  useEffect(() => {
    const on = () => setNarrow(window.innerWidth < breakpoint);
    window.addEventListener('resize', on);
    return () => window.removeEventListener('resize', on);
  }, [breakpoint]);
  return narrow;
}
function RouteMap({ days, active, base }) {
  // A smaller drawing on phones keeps the 12px labels readable once the SVG is scaled to the screen.
  const narrow = useNarrow(560);
  const W = narrow ? 400 : 600, H = narrow ? 320 : 380, PAD = 34;
  const shownDays = active == null ? days.map((d, i) => ({ d, i })) : [{ d: days[active], i: active }].filter(x => x.d);
  const pts = shownDays.flatMap(({ d }) => d.stops.filter(hasCoord));
  const all = hasCoord(base) ? pts.concat([base]) : pts;
  const proj = makeProjection(all, W, H, PAD);
  if (!proj) return html`<div class="map-box"><p class="hint" style=${{ padding: '16px' }}>这天的地点还没有坐标，暂时画不出示意图。</p></div>`;
  const scale = niceScale(proj.kmPerPx, narrow ? 70 : 90);
  const markers = [];
  shownDays.forEach(({ d, i }) => d.stops.forEach((s, k) => { if (hasCoord(s)) { const [x, y] = proj.project(s); markers.push({ x, y, i, k, text: str(s.name, 14), s }); } }));
  const labels = active == null ? [] : placeLabels(markers, W, H);
  const grid = [];
  for (let x = 50; x < W; x += 50) grid.push(html`<line class="map-grid" x1=${x} y1="0" x2=${x} y2=${H} />`);
  for (let y = 50; y < H; y += 50) grid.push(html`<line class="map-grid" x1="0" y1=${y} x2=${W} y2=${y} />`);
  const bxy = hasCoord(base) ? proj.project(base) : null;
  return html`<div class="map-box">
    <svg viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="路线示意图">
      <rect x="0" y="0" width=${W} height=${H} style=${{ fill: 'var(--surface)' }} />
      <g opacity=".7">${grid}</g>
      ${shownDays.map(({ d, i }) => {
        const line = d.stops.filter(hasCoord).map(s => proj.project(s));
        if (bxy && line.length) line.unshift(bxy);
        return line.length > 1 ? html`<polyline points=${line.map(p => p.join(',')).join(' ')} style=${{ fill: 'none', stroke: dayColor(i), strokeWidth: 5, strokeLinecap: 'round', strokeLinejoin: 'round' }} />` : null;
      })}
      ${bxy ? html`<g><rect x=${bxy[0] - 11} y=${bxy[1] - 11} width="22" height="22" rx="4" style=${{ fill: 'var(--ink)' }} /><text x=${bxy[0]} y=${bxy[1] + 4.5} text-anchor="middle" style=${{ fill: 'var(--surface)', fontSize: '12px', fontWeight: 700 }}>住</text></g>` : null}
      ${markers.map(m => html`<g>
        <circle cx=${m.x} cy=${m.y} r="10" style=${{ fill: 'var(--surface)', stroke: dayColor(m.i), strokeWidth: 3.5, strokeDasharray: m.s.suggested ? '3 2' : null }} />
        <text class="map-num" x=${m.x} y=${m.y + 3.5} text-anchor="middle">${m.k + 1}</text></g>`)}
      ${labels.filter(l => l.show).map(l => html`<text class="map-label" x=${l.tx} y=${l.ty} text-anchor=${l.anchor}>${l.text}</text>`)}
      <g transform=${`translate(16 ${H - 18})`}>
        <line class="map-scale" x1="0" y1="0" x2=${scale.px} y2="0" /><line class="map-scale" x1="0" y1="-5" x2="0" y2="5" /><line class="map-scale" x1=${scale.px} y1="-5" x2=${scale.px} y2="5" />
        <text class="map-scale-text" x=${scale.px + 8} y="4">${scale.label}</text>
      </g>
      <g transform=${`translate(${W - 24} 26)`}><path d="M0 -12 L6 6 L0 2 L-6 6 Z" style=${{ fill: 'var(--ink)' }} /><text class="map-scale-text" x="0" y="20" text-anchor="middle">N</text></g>
    </svg>
    <div class="cap"><span>示意图，按大致坐标绘制，不是实际地图</span><span class="mono">${active == null ? `${days.length} 天` : `Day ${active + 1}`}</span></div>
  </div>`;
}

function Timeline({ day, index, ctx, trip, base }) {
  const color = dayColor(index);
  const items = [];
  let prev = hasCoord(base) || (base && base.name) ? { ...base, city: trip.city, country: trip.country } : null;
  day.stops.forEach((s, k) => {
    const place = s.placeId ? ctx.placesById[s.placeId] : null;
    const target = { ...s, city: s.city || trip.city, country: s.country || trip.country };
    const pos = day.stops.length === 1 ? 'only' : k === 0 ? 'first' : k === day.stops.length - 1 ? 'last' : '';
    if (s.travel && (k > 0 || prev)) {
      const from = k > 0 ? { ...day.stops[k - 1], city: trip.city, country: trip.country } : prev;
      items.push(html`<li class="leg" key=${'l' + k}>
        <span></span><span class="rail"></span>
        <div class="leg-body"><span class="mode" title=${MODES[s.travel.mode] || ''}><${Icon} name=${MODE_ICON[s.travel.mode] || 'walk'} size=${16} /></span>
          <div class="txt"><b>${MODES[s.travel.mode] || '步行'}${s.travel.minutes ? ' ' + fmtMin(s.travel.minutes) : ''}</b>${s.travel.detail ? ' · ' + s.travel.detail : ''}${s.travel.cost ? ' · ' + s.travel.cost : ''}
            ${from ? html` <${ExtLink} href=${legLink(from, target, s.travel.mode, ctx.prefs.mapPref)}>路线<//>` : null}</div></div>
      </li>`);
    }
    const visited = place && place.status === 'visited';
    items.push(html`<li class=${pos} key=${'s' + k}>
      <span class="time">${s.time}</span>
      <span class="rail"><span class=${'station' + (s.suggested ? ' suggested' : '') + (visited ? ' done' : '')}>${visited ? '✓' : String(k + 1).padStart(2, '0')}</span></span>
      <div class="stop-body">
        <h4><${Icon} name=${s.category} size=${16} />${s.name}${s.suggested ? html`<span class="tag ai">AI 推荐</span>` : null}</h4>
        ${s.nameLocal && s.nameLocal !== s.name ? html`<div class="local">${s.nameLocal}</div>` : null}
        ${s.what ? html`<p class="what">${s.what}</p>` : null}
        ${s.tip ? html`<p class="tip">${s.tip}</p>` : null}
        <div class="actions">
          ${s.stayMin ? html`<span class="tag"><${Icon} name="clock" size=${12} />${fmtMin(s.stayMin)}</span>` : null}
          <${ExtLink} href=${placeLink(target, ctx.prefs.mapPref)}>地图<//>
          ${place ? html`<button class=${'status ' + (place.status || 'saved')} onClick=${() => ctx.write('update', 'places', place.id, { status: visited ? 'want' : 'visited', updatedAt: Date.now() })}>${visited ? '✓ 已拔草' : '标记拔草'}</button>` : null}
        </div>
      </div>
    </li>`);
  });
  return html`<ol class="timeline" style=${{ '--line': color }}>${items}</ol>`;
}

function TripView({ ctx, trip, onBack }) {
  const [active, setActive] = useState(0);
  const [feedback, setFeedback] = useState('');
  const [phase, setPhase] = useState('idle');
  const [stream, setStream] = useState('');
  const [started, setStarted] = useState(0);
  const [error, setError] = useState('');
  const [shareText, setShareText] = useState('');
  const ctl = useRef(null);
  useEffect(() => () => ctl.current && ctl.current.abort(), []);
  const plan = { days: [], tips: [], unplaced: [], ...(trip.plan || {}) };
  const base = plan.base || trip.base || null;
  const dayIdx = active == null ? null : Math.min(active, Math.max(0, plan.days.length - 1));
  const day = dayIdx == null ? null : plan.days[dayIdx];
  const endDate = trip.startDate ? addDays(trip.startDate, trip.days - 1) : '';
  const dayRoute = day ? dayRouteLink([...(base && base.name ? [{ ...base, city: trip.city, country: trip.country }] : []), ...day.stops.map(s => ({ ...s, city: s.city || trip.city, country: s.country || trip.country }))]) : null;

  async function revise() {
    const fb = feedback.trim();
    if (!fb) return;
    setError(''); setStream(''); setStarted(Date.now()); setPhase('working');
    ctl.current = new AbortController();
    try {
      const tripIds = trip.placeIds || [];
      const pool = ctx.places.filter(p => tripIds.includes(p.id) || sameCity(p.city, trip.city));
      const prompt = buildRevisePrompt({ trip, places: pool, feedback: fb, lang: ctx.prefs.aiLang, allowSuggest: trip.prefs && trip.prefs.suggest !== false });
      const raw = await ctx.ai.json(prompt, { tier: ctx.prefs.deepPlan ? 'complex' : 'default', onText: setStream, signal: ctl.current.signal, cache: false });
      const byId = Object.fromEntries(pool.map(p => [p.id, p]));
      const next = normalizePlan(raw, byId, { startDate: trip.startDate, baseName: base && base.name, placeIds: tripIds, city: trip.city, country: trip.country });
      if (!next.days.length) throw { code: 'invalid_json' };
      const placeIds = [...new Set([...tripIds, ...next.days.flatMap(d => d.stops.map(s => s.placeId).filter(Boolean))])];
      if (await ctx.write('update', 'trips', trip.id, { plan: next, placeIds, updatedAt: Date.now(), revisions: (trip.revisions || 0) + 1 })) { ctx.toast('行程已调整'); setFeedback(''); }
      setPhase('idle');
    } catch (e) {
      setPhase('idle');
      if (e && e.code === 'cancelled') return;
      setError(aiErrorText(e));
      if (PERMANENT_AI_ERRORS.has(e && e.code)) ctx.onAiBlocked(e.code);
    }
  }
  async function shareCopy() {
    const text = tripToText(trip);
    if (await copyText(text)) ctx.toast('已复制，可以直接发给旅伴'); else setShareText(text);
  }
  async function exportMd() {
    const md = tripToMarkdown(trip, ctx.placesById);
    if (!ctx.downloads) return setShareText(md);
    try { await ctx.downloads.save({ filename: `${trip.title || trip.city}.md`, data: md }); ctx.toast('已导出'); }
    catch (e) { if (!e || e.code !== 'declined') setShareText(md); }
  }
  async function remove() { if (await ctx.write('remove', 'trips', trip.id)) { ctx.toast('行程已删除'); onBack(); } }
  const quick = ['第一天轻松一点', '每天加一个午餐推荐', '改成打车为主', '把购物放到最后一天', '早上晚点出发'];

  return html`<div>
    <div class="trip-head">
      <div class="row"><button class="btn ghost sm" onClick=${onBack}><${Icon} name="back" size=${16} />全部行程</button>${trip.example ? html`<span class="tag example">示例</span>` : null}</div>
      <h1>${trip.title}</h1>
      <p class="muted">${[trip.city, `${trip.days} 天`, trip.startDate ? `${trip.startDate} → ${endDate}` : '', base && base.name ? `住 ${base.name}` : ''].filter(Boolean).join(' · ')}</p>
      ${plan.summary ? html`<p>${plan.summary}</p>` : null}
      <div class="row">
        <button class="btn sm" onClick=${shareCopy}><${Icon} name="copy" size=${14} />复制文字（发给旅伴）</button>
        <button class="btn sm" onClick=${exportMd}><${Icon} name="download" size=${14} />导出 Markdown</button>
        <${ConfirmButton} className="sm" label="删除行程" armedLabel="确认删除" icon="trash" onConfirm=${remove} />
      </div>
      <${ManualCopy} text=${shareText} onClose=${() => setShareText('')} />
    </div>
    ${plan.tips && plan.tips.length ? html`<details class="panel" open><summary>实用提示（${plan.tips.length}）</summary><ul class="tips-list">${plan.tips.map(t => html`<li>${t}</li>`)}</ul></details>` : null}
    <div class="daychips" role="group" aria-label="选择哪一天" style=${{ marginTop: '14px' }}>
      <button class="daychip" style=${{ '--line': 'var(--ink)' }} aria-pressed=${active == null} onClick=${() => setActive(null)}><span class="code">全</span>总览</button>
      ${plan.days.map((d, i) => html`<button class="daychip" style=${{ '--line': dayColor(i) }} aria-pressed=${dayIdx === i} onClick=${() => setActive(i)}>
        <span class="code">${i + 1}</span>${d.date ? `${d.date.slice(5)} ${weekday(d.date)}` : `Day ${i + 1}`}${d.area ? ' · ' + d.area : ''}</button>`)}
    </div>
    <div class="trip-layout" style=${{ marginTop: '8px' }}>
      <div class="map-col"><${RouteMap} days=${plan.days} active=${dayIdx} base=${base} /></div>
      <div>
        ${day ? html`<div>
          <div class="day-head" style=${{ '--line': dayColor(dayIdx) }}>
            <div class="title"><span class="badge">D${dayIdx + 1}</span><h3>${day.theme || `第 ${dayIdx + 1} 天`}</h3></div>
            <p class="muted small">${[day.date ? `${day.date} ${weekday(day.date)}` : '', day.area, `${day.stops.length} 站`, `步行/车程约 ${fmtMin(day.stops.reduce((s, x) => s + ((x.travel && x.travel.minutes) || 0), 0)) || '—'}`].filter(Boolean).join(' · ')}</p>
            ${day.note ? html`<p class="small">${day.note}</p>` : null}
            ${dayRoute ? html`<div><${ExtLink} href=${dayRoute}>在 Google 地图打开当天全程<//></div>` : null}
          </div>
          <${Timeline} day=${day} index=${dayIdx} ctx=${ctx} trip=${trip} base=${base} />
        </div>` : html`<div class="stack" style=${{ marginTop: '8px' }}>
          ${plan.days.map((d, i) => html`<button class="trip-card" style=${{ '--line': dayColor(i) }} onClick=${() => setActive(i)}>
            <div class="title row"><span class="daychip" style=${{ '--line': dayColor(i), padding: 0, border: 0, background: 'none' }}><span class="code">${i + 1}</span></span><strong>${d.theme || `第 ${i + 1} 天`}</strong><span class="muted small">${d.area}</span></div>
            <span class="small muted">${d.stops.map(s => s.name).join(' → ')}</span></button>`)}
        </div>`}
        ${plan.unplaced && plan.unplaced.length ? html`<div class="panel" style=${{ marginTop: '16px' }}><h3>没排进去的地点</h3>
          <ul class="tips-list">${plan.unplaced.map(u => html`<li>${(ctx.placesById[u.placeId] || {}).name || '已删除的地点'}：<span class="muted">${u.reason}</span></li>`)}</ul></div>` : null}
        <div class="panel" style=${{ marginTop: '16px' }}>
          <h3>想调整？</h3>
          ${phase === 'working' ? html`<${AiProgress} label="正在调整" text=${stream} started=${started} onStop=${() => ctl.current && ctl.current.abort()} counter=${t => `已排 ${(t.match(/"time"\s*:/g) || []).length} 站`} />` : html`
            <div class="chips">${quick.map(qk => html`<button class="chip" onClick=${() => setFeedback(f => (f ? f + '；' : '') + qk)}>${qk}</button>`)}</div>
            <textarea id="trip-feedback" class="input" rows="2" style=${{ minHeight: '64px' }} value=${feedback} onInput=${e => setFeedback(e.target.value)} placeholder="例如：Day 2 太赶了，把浅草寺挪到 Day 3"></textarea>
            ${error ? html`<div class="notice warn" role="alert"><${Icon} name="info" /><div>${error}</div></div>` : null}
            <div class="row end"><button class="btn primary" disabled=${!ctx.ai.ok || !feedback.trim()} onClick=${revise}><${Icon} name="refresh" size=${16} />按要求重新排</button></div>`}
          <p class="hint">交通时间和线路是 Claude 估计的，出发前点每段的「路线」用地图 App 看实时班次。</p>
        </div>
      </div>
    </div>
  </div>`;
}
function TripsView({ ctx }) {

  const list = ctx.trips.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  return html`<div>
    <div class="section-head"><h2>行程</h2><button class="btn primary" onClick=${() => ctx.openSheet({ type: 'trip' })}><${Icon} name="plus" size=${16} />新行程</button></div>

      <button class="btn primary" onClick=${() => ctx.openSheet({ type: 'trip' })}><${Icon} name="route" size=${16} />排第一个行程</button></div>` : null}

        <span class="muted small">${[t.city, `${t.days} 天`, `${total} 站`, t.startDate ? `${t.startDate} 出发` : ''].filter(Boolean).join(' · ')}</span>
        <div class="strip" aria-hidden="true">${stops.map((d, i) => html`<span style=${{ background: dayColor(i), flex: Math.max(1, d.stops.length) }}></span>`)}</div>
      </button>`;
    })}</div>
  </div>`;
}

/* --- guides --- */
function GuideSheet({ ctx, onClose }) {
  const [text, setText] = useState('');
  const [cityHint, setCityHint] = useState('');
  const m = useMedia(ctx.ai.images ? ctx.ai.images.maxCount : 0, ctx.toast);
  const media = m.media;
  const [phase, setPhase] = useState('input');

/* --- app shell --- */
function App() {
  const [rt, setRt] = useState(null);
  const storeRef = useRef(null);
  const [data, setData] = useState({ places: null, trips: null, guides: null, inbox: null });
  const [prefs, setPrefs] = useState(loadPrefs);
  const [sheet, setSheet] = useState(null);
  const [view, setView] = useState(null);
  const [toast, setToastState] = useState(null);
  const [ai, setAi] = useState({ ok: false, images: null, reason: '正在连接 Claude…' });
  const [canWrite, setCanWrite] = useState(true);
  const toastTimer = useRef(null);

  const showToast = useCallback((msg, extra) => {
    setToastState(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastState(null), extra ? 6000 : 3200);
  }, []);
  const setPref = useCallback(patch => setPrefs(p => { const n = { ...p, ...patch }; savePrefs(n); return n; }), []);

  useEffect(() => {
    let unsubs = [], alive = true;
    connectRuntime().then(r => {
      if (!alive) return;
      const store = createStore(r.db);
      storeRef.current = store;
      setRt(r);
      for (const col of COLLECTIONS) {
        unsubs.push(store.subscribe(col, list => setData(d => ({ ...d, [col]: list })), err => {
          setData(d => ({ ...d, [col]: d[col] || [] }));
          if (err && err.code !== 'revoked') showToast('数据连接中断了，刷新页面试试');
        }));
      }
      if (r.sample) {
        r.sample.limits().then(l => alive && setAi({ ok: true, images: l && l.images ? l.images : null, reason: '' }))
          .catch(() => alive && setAi({ ok: true, images: null, reason: '' }));
      } else {
        setAi({ ok: false, images: null, reason: AI_ERRORS.not_available });
      }
      if (r.user) r.user.can('data.write').then(v => alive && setCanWrite(v !== false)).catch(() => {});
    });
    return () => { alive = false; unsubs.forEach(u => u && u()); };
  }, []);

  const write = useCallback(async (op, col, id, payload) => {
    const store = storeRef.current;
    if (!store) { showToast('还没连上数据库，稍等再试'); return false; }
    try {
      if (op === 'set') await store.set(col, id, payload);
      else if (op === 'update') await store.update(col, id, payload);
      else await store.remove(col, id);
      return true;
    } catch (e) {
      const code = e && e.code;
      showToast(code === 'quota_exceeded' ? '存储空间满了，删掉一些旧数据再试' : code === 'invalid_argument' && !canWrite ? '你只有查看权限，不能修改' : '保存失败了，再试一次');
      return false;
    }
  }, [canWrite]);

  const places = data.places || [];
  const placesById = useMemo(() => Object.fromEntries(places.map(p => [p.id, p])), [data.places]);
  const cities = useMemo(() => {
    const c = {};
    for (const p of places) if (p.city) c[p.city] = (c[p.city] || 0) + 1;
    return Object.keys(c).sort((a, b) => c[b] - c[a]);
  }, [data.places]);
  const pending = (data.inbox || []).filter(i => i.status === 'pending').length;
  const tab = ['library', 'trips', 'guides', 'inbox'].includes(prefs.tab) ? prefs.tab : 'library';

  const ctx = {
    places, trips: data.trips || [], guides: data.guides || [], inbox: data.inbox || [], placesById,
    loading: { places: data.places == null, trips: data.trips == null, guides: data.guides == null, inbox: data.inbox == null }, cities, prefs, setPref, write,
    toast: showToast, ai: { ...ai, json: (prompt, o) => rt && rt.sample ? (() => {
      const opts = { modelTier: o.tier || 'default' };
      if (o.onText) opts.onText = ({ text }) => o.onText(text);
      if (o.signal) opts.signal = o.signal;
      if (o.images && o.images.length) opts.images = o.images;
      if (o.cache === false) opts.cache = false;
      return rt.sample.json(prompt, opts);
    })() : Promise.reject({ code: 'not_available' }) },
    assets: rt && rt.assets, downloads: rt && rt.downloads, permissions: rt && rt.permissions,
    openSheet: s => setSheet(s), openView: v => { setView(v); if (v) setPref({ tab: v.type === 'trip' ? 'trips' : 'guides' }); window.scrollTo({ top: 0 }); },
    onAiBlocked: code => setAi(a => ({ ...a, ok: false, reason: AI_ERRORS[code] || AI_ERRORS.not_available })),
  };
  // Pre-fill the city list for every city input.
  const datalist = html`<datalist id="known-cities">${cities.map(c => html`<option value=${c}></option>`)}</datalist>`;

  const go = t => { setView(null); setPref({ tab: t }); window.scrollTo({ top: 0 }); };
  const tabs = [['library', '种草', 'bookmark', places.length], ['trips', '行程', 'route', (data.trips || []).length], ['guides', '攻略', 'book', (data.guides || []).length], ['inbox', '待处理', 'inbox', pending]];
  const visited = places.filter(p => p.status === 'visited').length;
  const subtitle = !rt ? '正在连接…' : !storeRef.current || !storeRef.current.live ? '离线预览：在 claude.ai 打开才会保存' : `${places.length} 个种草 · ${visited} 个已拔草 · ${cities.length} 座城市`;

  let main;
  const trip = view && view.type === 'trip' ? (data.trips || []).find(t => t.id === view.id) : null;
  const guide = view && view.type === 'guide' ? (data.guides || []).find(g => g.id === view.id) : null;
  if (trip) main = html`<${TripView} key=${trip.id} ctx=${ctx} trip=${trip} onBack=${() => setView(null)} />`;
  else if (guide) main = html`<${GuideView} key=${guide.id} ctx=${ctx} guide=${guide} onBack=${() => setView(null)} />`;
  else if (tab === 'trips') main = html`<${TripsView} ctx=${ctx} />`;
  else if (tab === 'guides') main = html`<${GuidesView} ctx=${ctx} />`;
  else if (tab === 'inbox') main = html`<${InboxView} ctx=${ctx} />`;
  else main = html`<${LibraryView} ctx=${ctx} />`;

  let sheetEl = null;
  const close = () => setSheet(null);
  if (sheet && sheet.type === 'add') sheetEl = html`<${AddSheet} ctx=${ctx} onClose=${close} />`;
  if (sheet && sheet.type === 'place') { const p = placesById[sheet.id]; if (p) sheetEl = html`<${PlaceSheet} ctx=${ctx} place=${p} onClose=${close} />`; }
  if (sheet && sheet.type === 'trip') sheetEl = html`<${TripSheet} ctx=${ctx} initial=${sheet} onClose=${close} />`;
  if (sheet && sheet.type === 'guide') sheetEl = html`<${GuideSheet} ctx=${ctx} onClose=${close} />`;
  if (sheet && sheet.type === 'settings') sheetEl = html`<${SettingsSheet} ctx=${ctx} onClose=${close} />`;

  return html`<div class="shell">
    <header class="top">
      <div class="brand"><span class="mark" aria-hidden="true">拔</span><div><strong>拔草计划</strong><small>${subtitle}</small></div></div>
      <span class="spacer"></span>
      <nav class="tabs-top" aria-label="主菜单">${tabs.map(([k, label, icon, n]) => html`<button class="tab" aria-current=${!view && tab === k ? 'page' : null} onClick=${() => go(k)}><${Icon} name=${icon} size=${16} />${label}${n ? html`<span class="count">${n}</span>` : null}</button>`)}</nav>
      <button class="icon-btn" aria-label="设置" onClick=${() => setSheet({ type: 'settings' })}><${Icon} name="sliders" /></button>
    </header>
    ${!canWrite ? html`<div class="notice warn" style=${{ marginTop: '12px' }}><${Icon} name="info" /><div>你只有查看权限：可以浏览，不能添加或修改。</div></div>` : null}
    <main>${main}</main>
    ${!view && tab === 'library' && places.length ? html`<button class="btn primary fab" onClick=${() => setSheet({ type: 'add' })}><${Icon} name="plus" />添加</button>` : null}
    <nav class="tabbar" aria-label="主菜单">${tabs.map(([k, label, icon, n]) => html`<button class="tab" aria-current=${!view && tab === k ? 'page' : null} onClick=${() => go(k)}><${Icon} name=${icon} size=${20} /><span>${label}${k === 'inbox' && n ? ` ${n}` : ''}</span></button>`)}</nav>
    ${datalist}
    ${sheetEl}
    ${toast ? html`<div class="toast" role="status">${toast}</div>` : null}
  </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
