        const live = fx && fx.rates && num(fx.rates[c]);
        return html`<div class="row" key=${c}><span class="grow">1 ${base} = </span>
          <input class="input" style=${{ maxWidth: '130px' }} inputmode="decimal" aria-label=${`1 ${base} 换多少 ${c}`} value=${rates[c] || ''} placeholder=${live ? String(+live.toFixed(4)) : '手动填'} onInput=${e => setRates(r => ({ ...r, [c]: e.target.value }))} /><b style=${{ minWidth: '40px' }}>${c}</b></div>`;
      })}
        <div><button class="btn sm" onClick=${saveRates}>保存手动汇率</button></div>
        <p class="hint">留空就用自动汇率。手动汇率对所有旅伴生效。</p></div>` : null}
    </section>
    <section class="card pad stack">
      <h3 class="card-title">和旅伴一起用</h3>
      <p class="hint">在 claude.ai 打开这个页面，点右上角「分享」邀请旅伴，并给「可以编辑」权限。大家看到同一份收藏、行程和花费，谁加的地点和花费都会显示头像；和 AI 的聊天只留在各自的设备上。</p>
      ${ctx.permissions ? html`<div><button class="btn sm" onClick=${() => ctx.permissions.manage().catch(() => ctx.toast('请从页面右上角的菜单打开权限设置'))}><${Icon} name="sliders" size=${15} />权限（Claude、存储、文件）</button></div>` : null}
    </section>
    <section class="card pad stack">
      <h3 class="card-title">备份和导出</h3>
      <div class="row wrap">
        <button class="btn sm" onClick=${() => save('旅用-备份.json', JSON.stringify({ app: 'bacao', version: 2, exportedAt: new Date().toISOString(), places: ctx.places, trips: ctx.trips, guides: ctx.guides, expenses: ctx.expenses }, null, 1))}><${Icon} name="download" size=${15} />备份全部（JSON）</button>
        <button class="btn sm" onClick=${() => save('旅用-地点.csv', placesToCSV(ctx.places))}><${Icon} name="map" size=${15} />地点 CSV</button>
      </div>
      <${ManualCopy} text=${manual} onClose=${() => setManual('')} />
      <p class="hint">CSV 可以导入 Google My Maps（mymaps.google.com → 新地图 → 导入，位置列选「Location」），手机上就能看所有收藏的地点。</p>
      <textarea id="import-text" class="input" rows="3" style=${{ minHeight: '72px' }} value=${importText} onInput=${e => setImportText(e.target.value)} placeholder="导入：粘贴备份 JSON，或选择文件"></textarea>
      <div class="row wrap"><button class="btn sm" onClick=${() => fileRef.current.click()}>选择文件</button><button class="btn sm green" disabled=${!importText.trim()} onClick=${() => doImport(importText)}>导入</button><span class="hint">${importMsg}</span></div>
      <input ref=${fileRef} id="import-file" class="sr" type="file" accept=".json,application/json" onChange=${async e => { const f = e.target.files[0]; e.target.value = ''; if (f) doImport(await f.text()); }} />
    </section>
    ${examples.length ? html`<section class="card pad stack"><h3 class="card-title">示例数据</h3><p class="hint">现在有 ${examples.length} 条示例（地点、行程、攻略、花费）。</p>
      <div><${ConfirmButton} className="sm" label="清除示例" armedLabel="确认清除全部示例" icon="trash" onConfirm=${clearExamples} /></div></section>` : null}
    <p class="hint">数据保存在这个 claude.ai 页面里，只有你和你分享的人能看到。AI 识别和规划用的是看页面那个人自己的 Claude 额度，不另外收费。地图底图 © OpenStreetMap 贡献者，照片来自原帖或 Wikimedia Commons（署名见每张图）。</p>
  <//>`;
}

/* ---------- app shell ---------- */
const TABS = [['home', '首页', 'home'], ['library', '收藏', 'heart'], ['trips', '行程', 'trips'], ['assistant', 'AI', 'sparkle']];
function App() {
  const [rt, setRt] = useState(null);
  const storeRef = useRef(null);
  const [data, setData] = useState(() => Object.fromEntries(COLLECTIONS.map(c => [c, null])));
  const [prefs, setPrefs] = useState(loadPrefs);
  const [sheet, setSheet] = useState(null);
  const [nav, setNav] = useState(() => ({ tab: TABS.some(t => t[0] === loadPrefs().tab) ? loadPrefs().tab : 'home', stack: [] }));
  const [toast, setToastState] = useState(null);
  const [ai, setAi] = useState({ ok: false, images: null, reason: '正在连接 Claude…' });
  const [canWrite, setCanWrite] = useState(true);
  const [me, setMe] = useState(null);
  const [ask, setAsk] = useState(null);
  const toastTimer = useRef(null);
  const scrolls = useRef([]);

  const showToast = useCallback(msg => {
    setToastState(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastState(null), 3400);
  }, []);
  const setPref = useCallback(patch => setPrefs(p => { const n = { ...p, ...patch }; savePrefs(n); return n; }), []);
  const navApi = useMemo(() => ({
    go: tab => { scrolls.current = []; setNav({ tab, stack: [] }); setPref({ tab }); window.scrollTo(0, 0); },
    push: route => { scrolls.current.push(window.scrollY); setNav(n => ({ ...n, stack: [...n.stack, route] })); window.scrollTo(0, 0); },
    back: () => { const y = scrolls.current.pop() || 0; setNav(n => ({ ...n, stack: n.stack.slice(0, -1) })); requestAnimationFrame(() => window.scrollTo(0, y)); },
    patch: p => setNav(n => (n.stack.length ? { ...n, stack: [...n.stack.slice(0, -1), { ...n.stack[n.stack.length - 1], ...p }] } : n)),
  }), []);

  useEffect(() => {
    let unsubs = [], alive = true;
    connectRuntime().then(r => {
      if (!alive) return;
      const store = createStore(r.db);
      storeRef.current = store;
      setRt(r);
      for (const col of COLLECTIONS) {
        unsubs.push(store.subscribe(col, list => setData(d => ({ ...d, [col]: list })), err => {
          setData(d => ({ ...d, [col]: d[col] || [] }));
          if (err && err.code !== 'revoked') showToast('数据连接中断了，刷新页面试试');
        }));
      }
      if (r.sample) {
        r.sample.limits().then(l => alive && setAi({ ok: true, images: l && l.images ? l.images : null, reason: '' }))
          .catch(() => alive && setAi({ ok: true, images: null, reason: '' }));
      } else {
        setAi({ ok: false, images: null, reason: AI_ERRORS.not_available });
      }
      if (r.user) {
        r.user.can('data.write').then(v => alive && setCanWrite(v !== false)).catch(() => {});
        r.user.id().then(id => alive && setMe(id || null)).catch(() => {});
      }
    });
    return () => { alive = false; unsubs.forEach(u => u && u()); };
  }, []);

  const write = useCallback(async (op, col, id, payload) => {
    const store = storeRef.current;
    if (!store) { showToast('还没连上数据库，稍等再试'); return false; }
    try {
      if (op === 'set') await store.set(col, id, payload && payload.createdBy === undefined && col !== 'meta' && col !== 'maps' ? { ...payload, createdBy: me } : payload);
      else if (op === 'update') await store.update(col, id, payload);
      else await store.remove(col, id);
      return true;
    } catch (e) {
      const code = e && e.code;
      showToast(code === 'quota_exceeded' ? '存储空间满了，删掉一些旧数据再试' : !canWrite ? '你只有查看权限，不能修改' : '保存失败了，再试一次');
      return false;
    }
  }, [canWrite, me]);

  const places = data.places || [];
  const placesById = useMemo(() => Object.fromEntries(places.map(p => [p.id, p])), [data.places]);
  const cities = useMemo(() => {
    const c = {};
    for (const p of places) if (p.city) c[p.city] = (c[p.city] || 0) + 1;
    return Object.keys(c).sort((a, b) => c[b] - c[a]);
  }, [data.places]);
  const meta = data.meta || [];
  const ctx = {
    places, placesById, cities, trips: data.trips || [], guides: data.guides || [], inbox: data.inbox || [], expenses: data.expenses || [],
    maps: data.maps || [], fx: meta.find(d => d.id === 'fx') || null, appMeta: meta.find(d => d.id === 'app') || null,
    loading: Object.fromEntries(COLLECTIONS.map(c => [c, data[c] == null])),
    prefs, setPref, home: CURRENCIES[prefs.home] ? prefs.home : 'MYR', write, toast: showToast, me, canWrite,
    user: rt && rt.user, assets: rt && rt.assets, downloads: rt && rt.downloads, permissions: rt && rt.permissions,
    ai: {
      ...ai,
      json: (prompt, o) => (rt && rt.sample ? rt.sample.json(prompt, sampleOpts(o)) : Promise.reject({ code: 'not_available' })),
      chat: (turns, o) => (rt && rt.sample ? rt.sample(turns, { ...sampleOpts(o), cache: false }) : Promise.reject({ code: 'not_available' })),
    },
    nav: navApi, openSheet: s => setSheet(s),
    askAssistant: (prompt, focus) => { setAsk({ prompt, focus, n: Date.now() }); navApi.go('assistant'); },
    ask, clearAsk: () => setAsk(null),
    onAiBlocked: code => setAi(a => ({ ...a, ok: false, reason: AI_ERRORS[code] || AI_ERRORS.not_available })),
  };

  const top = nav.stack[nav.stack.length - 1];
  const depth = nav.stack.length;
  let main;
  if (top && top.name === 'trip') main = html`<${TripView} key=${'t' + depth + top.id} ctx=${ctx} id=${top.id} tab=${top.tab} day=${top.day} />`;
  else if (top && top.name === 'place') main = html`<${PlaceView} key=${'p' + depth + top.id} ctx=${ctx} id=${top.id} />`;
  else if (top && top.name === 'map') main = html`<${MapModeView} key=${'m' + depth} ctx=${ctx} country=${top.country} city=${top.city} />`;
  else if (top && top.name === 'country') main = html`<${CountryView} key=${'c' + depth + top.country} ctx=${ctx} country=${top.country} />`;
  else if (top && top.name === 'city') main = html`<${CityView} key=${'y' + depth + top.city} ctx=${ctx} country=${top.country} city=${top.city} />`;
  else if (top && top.name === 'guides') main = html`<${GuidesView} ctx=${ctx} />`;
  else if (top && top.name === 'guide') main = html`<${GuideView} key=${'g' + depth + top.id} ctx=${ctx} id=${top.id} />`;
  else if (top && top.name === 'inbox') main = html`<${InboxView} ctx=${ctx} />`;
  else if (nav.tab === 'library') main = html`<${LibraryView} ctx=${ctx} />`;
  else if (nav.tab === 'trips') main = html`<${TripsView} ctx=${ctx} />`;
  else if (nav.tab === 'assistant') main = html`<${AssistantView} ctx=${ctx} />`;
  else main = html`<${HomeView} ctx=${ctx} />`;
  const activeTab = top ? top.tabGroup || nav.tab : nav.tab;

  let sheetEl = null;
  const close = () => setSheet(null);
  const sTrip = sheet && sheet.tripId ? ctx.trips.find(t => t.id === sheet.tripId) : null;
  if (sheet) {
    const k = sheet.type;
    if (k === 'add') sheetEl = html`<${AddSheet} ctx=${ctx} initial=${sheet} onClose=${close} />`;
    else if (k === 'guide') sheetEl = html`<${GuideSheet} ctx=${ctx} initial=${sheet} onClose=${close} />`;
    else if (k === 'place' && placesById[sheet.id]) sheetEl = html`<${PlaceEditSheet} ctx=${ctx} place=${placesById[sheet.id]} onClose=${close} />`;
    else if (k === 'trip') sheetEl = html`<${TripFormSheet} ctx=${ctx} initial=${sheet} onClose=${close} />`;
    else if (k === 'addToTrip') sheetEl = html`<${AddToTripSheet} ctx=${ctx} placeIds=${sheet.placeIds} sameDay=${sheet.sameDay} onClose=${close} />`;
    else if (k === 'organize') sheetEl = html`<${OrganizeSheet} ctx=${ctx} initial=${sheet} onClose=${close} />`;
    else if (k === 'filter') sheetEl = html`<${FilterSheet} ctx=${ctx} onClose=${close} />`;
    else if (k === 'settings') sheetEl = html`<${SettingsSheet} ctx=${ctx} onClose=${close} />`;
    else if (k === 'chatMore') sheetEl = html`<${ChatMoreSheet} ctx=${ctx} clear=${sheet.clear} onClose=${close} />`;
    else if (sTrip && k === 'tripMenu') sheetEl = html`<${TripMenuSheet} ctx=${ctx} trip=${sTrip} onClose=${close} />`;
    else if (sTrip && k === 'tripEdit') sheetEl = html`<${TripEditSheet} ctx=${ctx} trip=${sTrip} onClose=${close} />`;
    else if (sTrip && k === 'revise') sheetEl = html`<${ReviseSheet} ctx=${ctx} trip=${sTrip} dayIndex=${sheet.dayIndex} preset=${sheet.preset} accept=${sheet.accept} onClose=${close} />`;
    else if (sTrip && k === 'stop') sheetEl = html`<${StopSheet} ctx=${ctx} trip=${sTrip} dayIndex=${sheet.dayIndex} stopIndex=${sheet.stopIndex} onClose=${close} />`;
    else if (sTrip && k === 'expense') sheetEl = html`<${ExpenseSheet} ctx=${ctx} trip=${sTrip} expense=${sheet.expenseId ? ctx.expenses.find(e => e.id === sheet.expenseId) : null} onClose=${close} />`;
  }
  const pendingInbox = ctx.inbox.filter(i => i.status === 'pending').length;
  const offline = rt && storeRef.current && !storeRef.current.live;

  const tabIndex = TABS.findIndex(([k]) => k === activeTab);
  return html`<div class="shell">
    <nav class="nav" aria-label="主菜单" data-lens=${tabIndex >= 0 ? '' : null} style=${{ '--tab': Math.max(0, tabIndex) }}>
      <div class="rail-brand"><${BrandMark} size=${44} /><b>旅用</b></div>
      ${TABS.map(([k, label, icon]) => html`<button key=${k} aria-current=${activeTab === k ? 'page' : null} onClick=${() => navApi.go(k)}
          aria-label=${k === 'home' && pendingInbox ? `${label}（${pendingInbox} 条链接待处理）` : null}>
        <span class="ic-wrap"><${Icon} name=${activeTab === k && k === 'library' ? 'heartFill' : icon} size=${24} stroke=${activeTab === k ? 2.1 : 1.8} />${k === 'home' && pendingInbox ? html`<span class="badge num" aria-hidden="true">${pendingInbox}</span>` : null}</span>${label}</button>`)}
    </nav>
    ${offline ? html`<div class="banner">离线预览：在 claude.ai 打开这个页面才会保存数据。</div>` : null}
    ${!canWrite ? html`<div class="banner">你只有查看权限：可以浏览，不能添加或修改。</div>` : null}
    <main>${main}</main>
    <datalist id="known-cities">${cities.map(c => html`<option value=${c}></option>`)}</datalist>
    ${sheetEl}
    ${toast ? html`<div class="toast" role="status">${toast}</div>` : null}
  </div>`;
}
function sampleOpts(o = {}) {
  const opts = { modelTier: o.tier || 'default' };
  if (o.onText) opts.onText = ({ text }) => o.onText(text);
  if (o.signal) opts.signal = o.signal;
  if (o.images && o.images.length) opts.images = o.images;
  if (o.cache === false) opts.cache = false;
  return opts;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
