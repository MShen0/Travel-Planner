<!--
THESIS: A trip planner that feels like the feed it came from: saved posts become photo cards, cards become a day you can walk. Refuses the empty-form dashboard.
OWN-WORLD: warm paper #F6F5F1, white rounded cards, forest green #1F5C45 for travel actions, purple #6D5CE7 only for AI, solid controls with glass only where they float (tab bar, map, photos), pastel category pills, photo-led cards and pins, one recoloured city basemap.
STORY: paste a post, AI files it under country, region and city, AI tidies the library on request, pick cities and days, follow a photo timeline with a transit line and map handoff per leg, settle costs in RM with companions.
FIRST VIEWPORT: full-bleed trip photo with 下一站去哪儿？ in white; paste card overlapping its foot; trip card with four stats; green AI action at thumb height; tab bar.
FORM: user-pinned reference mockup (canon), seed 149fd3fa. Raises: country → region → city drill-down (atlas index), pin size by priority (star atlas), AI-changed rows stay lit (gate board), AI proposals shown before/after (ledger), dense day rows (JP high-density), numbered station order (transit diagram).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

/* ---------- map ---------- */

  -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent), linear-gradient(180deg, transparent, #000 5%, #000 95%, transparent); -webkit-mask-composite: source-in;
  mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent), linear-gradient(180deg, transparent, #000 5%, #000 95%, transparent); mask-composite: intersect; }

.map-top { position: absolute; z-index: 6; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 8px; display: grid; gap: 10px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 96%, transparent) 55%, transparent); }

  .mapmode { inset: 0 0 0 108px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
  .map-area { position: relative; inset: auto; }

}

/* ---------- trips ---------- */

.day-title { display: flex; align-items: flex-start; gap: 10px; padding-block: 14px 6px; }

.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl-row { display: grid; grid-template-columns: 44px 18px 58px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding-block: 6px; position: relative; }

.photo-count { position: absolute; right: 6px; bottom: 6px; display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; line-height: 1; color: #fff; background: rgb(12 16 14 / .55); padding: 4px 7px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.ov-photos { display: grid; grid-auto-flow: column; grid-auto-columns: 96px; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.ov-photos::-webkit-scrollbar { display: none; }
.ov-photos .photo { aspect-ratio: 1; border-radius: var(--r-md); }
/* costs */
.costs-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 16px; align-items: start; }
@media (min-width: 1024px) { .costs-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } }
.settle-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.settle .card-title + .settle-row { border-top: 0; }
.settle-row b { display: block; font-size: 14.5px; }
.settle-row small { font-size: 12.5px; color: var(--muted); }
.net { font-weight: 800; font-size: 14px; }
.net.pos { color: var(--green-text); } .net.neg { color: var(--danger); }
.transfer-line { display: flex; align-items: center; gap: 8px; font-size: 14px; background: var(--fill); border-radius: var(--r-sm); padding: 9px 12px; }
.chip.person { padding-left: 6px; }
.chip.person .avatar { width: 22px; height: 22px; border: 0; }
/* assistant */
.ai-col { display: grid; gap: 8px; min-width: 0; max-width: min(86%, 560px); }
.msg.ai .bubble { max-width: 100%; justify-self: start; }
.mentions-wrap { display: grid; gap: 8px; }
.ai-photo { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; padding: 0; border-radius: var(--r-lg); overflow: hidden; background: var(--fill); box-shadow: var(--shadow-card); text-align: left; color: #fff; }
.ai-photo .photo { position: absolute; inset: 0; }
.ai-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgb(10 16 14 / .7)); }
.ai-photo span { position: absolute; z-index: 1; left: 14px; right: 14px; bottom: 12px; }
.ai-photo b { display: block; font-size: 17px; font-weight: 800; }
.ai-photo small { font-size: 12.5px; opacity: .92; }
.mentions { margin-top: 0; }
/* collect review */
.rv-photo { position: relative; width: 72px; height: 90px; border-radius: var(--r-sm); overflow: hidden; border: 0; padding: 0; background: var(--fill); }
.rv-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rv-photo .art { width: 100%; height: 100%; }
.rv-photo .cycle { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 700; color: #fff; background: rgb(0 0 0 / .55); padding: 1px 6px; border-radius: 6px; }
.rv-photo[disabled] { cursor: default; opacity: 1; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-2); }
.pill .ic:last-child { color: var(--muted); }
.pill-input { width: 140px; min-height: 30px; padding: 3px 12px; border-radius: 999px; font-size: 14px; }
.pill-select { position: relative; padding: 0; height: 28px; border-radius: 999px; }
.pill-select select { appearance: none; -webkit-appearance: none; height: 28px; border: 0; padding: 0 24px 0 11px; border-radius: 999px; background: transparent; color: inherit; font-size: 13px; font-weight: 700; }
.pill-select .ic { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
/* ---------- floating glass ----------
   Glass only where a control floats over photos, maps or scrolling content: the tab bar, map controls, the discs on
   photos, the composer's + button. Everything in the page flow is solid: white with a hairline for secondary actions,
   forest green for travel actions, purple for anything AI. */
.icon-btn.on-photo, .map-ctrl .icon-btn, .map-top .chip, .list-pill .btn, .composer .icon-btn.bordered, .nav {
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
.map-ctrl .icon-btn, .map-top .chip:not([aria-pressed="true"]), .list-pill .btn:not(.green), .composer .icon-btn.bordered {
  border: 0; color: var(--ink); background: linear-gradient(180deg, var(--glass-sheen), transparent 56%), var(--glass);
  box-shadow: inset 0 1px 1px var(--glass-inner-hi), inset 0 -3px 8px -4px var(--glass-shade), 0 0 0 .5px var(--glass-line), var(--glass-shadow); }
/* over photos the glass is the same in both themes: milky, with a dark glyph that holds on any image */
.icon-btn.on-photo {
  --glass-blur: blur(14px) saturate(180%) brightness(1.08); color: #1C1F1D;
  background: linear-gradient(180deg, rgb(255 255 255 / .7), transparent 56%), rgb(255 255 255 / .52);
  box-shadow: inset 0 1px 1px rgb(255 255 255 / .85), inset 0 -3px 8px -4px rgb(0 0 0 / .14), 0 0 0 .5px rgb(0 0 0 / .12), 0 2px 10px rgb(0 0 0 / .22); }
@media (hover: hover) { .icon-btn.on-photo:hover { background: rgb(255 255 255 / .78); } .map-ctrl .icon-btn:hover { --glass: var(--glass-hover); } }
.btn, .chip, .cta, .go, .icon-btn, .quick button, .daychip, .pa, .ai-action { transition: background-color .15s, border-color .15s, box-shadow .15s, transform .1s; }
:is(.btn, .chip, .cta, .go, .icon-btn, .quick button, .daychip, .pa, .ai-action, .country-card, .city-card):not([disabled]):active { transform: scale(.97); }
.btn.fab { box-shadow: 0 2px 4px rgb(20 50 36 / .16), 0 14px 30px -10px color-mix(in srgb, var(--green) 70%, transparent); }
.chip[disabled] { opacity: .4; }
.chip[aria-selected="true"] { background: var(--green); color: var(--green-ink); }

/* tab bar: a floating glass capsule; a lens slides to the current tab */
.nav { --glass-blur: blur(28px) saturate(190%); left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); height: 64px; padding: 5px; border: 0; border-radius: 32px;
  background: linear-gradient(180deg, var(--glass-sheen), transparent 62%), var(--glass-bar);
  box-shadow: inset 0 1px 1px var(--glass-inner-hi), inset 0 -3px 8px -4px var(--glass-shade), 0 0 0 .5px var(--glass-line), 0 2px 6px rgb(28 31 29 / .08), 0 12px 32px -8px rgb(28 31 29 / .28); }
.nav::before { content: ""; position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 4); border-radius: 27px; pointer-events: none;
  transform: translateX(calc(var(--tab, 0) * 100%)); transition: transform .55s cubic-bezier(.16, 1, .3, 1), opacity .2s;
  background: color-mix(in srgb, var(--green-tint) 88%, transparent);
  box-shadow: inset 0 1px 1px var(--glass-inner-hi), inset 0 0 0 .5px color-mix(in srgb, var(--green) 30%, transparent); }
.nav:not([data-lens])::before { opacity: 0; }
.nav button { position: relative; z-index: 1; padding: 4px; border-radius: 27px; align-content: center; }
@media (min-width: 1024px) {
  .nav { top: 12px; bottom: 12px; left: 12px; right: auto; width: 84px; height: auto; padding: 16px 8px; border-radius: 28px; }
  .nav::before { display: none; }
  .nav button { padding: 10px 4px; border-radius: 18px; }
  .nav button[aria-current="page"] { background: color-mix(in srgb, var(--green-tint) 88%, transparent); box-shadow: inset 0 0 0 .5px color-mix(in srgb, var(--green) 30%, transparent); }
}
@media (prefers-reduced-transparency: reduce) {
  :root { --glass: var(--surface); --glass-hover: var(--fill); --glass-bar: var(--surface); }
  .icon-btn.on-photo { background: #fff; }
  .icon-btn.on-photo, .map-ctrl .icon-btn, .map-top .chip, .list-pill .btn, .composer .icon-btn.bordered, .nav { -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  :root { --glass-bar: var(--surface); }
  .icon-btn.on-photo { background: rgb(255 255 255 / .92); }
}
@media (prefers-reduced-motion: reduce) { .nav::before { transition: none; } }

/* ---------- AI: purple marks anything Claude suggests; green stays the colour of going somewhere ---------- */
.btn.ai, .cta.ai, .go.ai { background: var(--ai); border-color: var(--ai); color: var(--ai-ink); }
@media (hover: hover) { .btn.ai:hover, .cta.ai:hover, .go.ai:hover { background: var(--ai-hover); border-color: var(--ai-hover); } }
.cta.ai { box-shadow: 0 6px 18px color-mix(in srgb, var(--ai) 28%, transparent); }
.btn.soft-ai { background: var(--ai-tint); border-color: transparent; color: var(--ai-text); }
.tag.ai { background: var(--ai-tint); color: var(--ai-text); }
.tag.add { background: var(--green-tint); color: var(--green-text); }
.ai-box { background: var(--ai-tint); }
.ai-box h3 { color: var(--ai-text); }
.bot { background: var(--ai); color: var(--ai-ink); }
.action-card .ai-ic { background: var(--ai-tint); color: var(--ai-text); }
.focus-chip { background: var(--ai-tint); color: var(--ai-text); }
.quick button.wide { grid-column: 1 / -1; background: var(--ai-tint); border-color: transparent; color: var(--ai-text); }
@media (prefers-reduced-motion: no-preference) {
  .fade-up { animation: fadeUp .38s cubic-bezier(.16, 1, .3, 1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}

/* ---------- home ---------- */
.overline { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
.trip-card .head { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 0; text-align: left; color: inherit; }
.trip-card .stats { grid-template-columns: repeat(3, 1fr); }
.trip-card-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.trip-card-actions .btn { min-height: 46px; }
.ai-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 560px) and (max-width: 1023px) { .ai-actions { grid-template-columns: repeat(3, 1fr); } }
.ai-action { display: flex; align-items: flex-start; gap: 10px; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-align: left; color: inherit; }
@media (hover: hover) { .ai-action:hover { border-color: color-mix(in srgb, var(--ai) 40%, var(--line)); } }
.ai-action .ai-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--ai-tint); color: var(--ai-text); display: grid; place-items: center; flex: none; }
.ai-action b { display: block; font-size: 14.5px; }
.ai-action small { display: block; font-size: 12px; line-height: 1.4; color: var(--muted); margin-top: 1px; }

/* ---------- library: country → region → city → place ---------- */
.page.wide { max-width: 1240px; }
.flag.sm { width: 20px; height: 20px; }
.flag.lg { width: 52px; height: 52px; }
.flag-none { display: grid; place-items: center; color: var(--green-text); }
.chip .flag.sm { margin-left: -6px; }
.country-chips { margin-top: 14px; }
.active-filters { margin-top: 12px; }
.active-filters .chip { gap: 6px; }
.result-count { margin-top: 12px; }
.lib-layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 24px; align-items: start; margin-top: 16px; }
.lib-layout .lib-main > :first-child { margin-top: 0; }
.lib-nav { position: sticky; top: 16px; display: grid; gap: 2px; padding: 8px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-card); max-height: calc(100vh - 32px); overflow-y: auto; }
.ln-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 8px 10px; border: 0; border-radius: var(--r-sm); background: none; font-size: 14.5px; font-weight: 600; color: var(--ink); text-align: left; }
.ln-item:hover, .ln-sub-item:hover { background: var(--fill); }
.ln-item.on { background: var(--green-tint); color: var(--green-text); }
.ln-item b, .ln-sub-item b { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.ln-globe { display: grid; place-items: center; color: var(--green-text); }
.ln-sub { display: grid; gap: 1px; margin: 2px 0 6px 20px; padding-left: 8px; border-left: 2px solid var(--line); }
.ln-sub-item { display: flex; justify-content: space-between; gap: 8px; min-height: 36px; align-items: center; padding: 6px 10px; border: 0; border-radius: var(--r-sm); background: none; font-size: 13.5px; color: var(--ink-2); text-align: left; }
.ln-sub-item.on { color: var(--green-text); font-weight: 700; background: var(--green-tint); }
.country-grid { display: grid; gap: 12px; margin-top: 14px; }
@media (min-width: 760px) { .country-grid { grid-template-columns: 1fr 1fr; } }
.country-card { display: grid; gap: 12px; width: 100%; padding: 16px; border: 0; text-align: left; color: inherit; }
.cc-head { display: flex; align-items: center; gap: 12px; }
.cc-head > .ic, .city-card > .ic { color: var(--muted); }
.cc-head h3, .city-card h3, .geo-head h1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cc-head h3 { font-size: 19px; font-weight: 800; }
.cc-head h3 small, .city-card h3 small, .geo-head h1 small { font-family: var(--font); font-size: 12.5px; font-weight: 600; letter-spacing: .02em; color: var(--muted); }
.cc-head .meta { font-size: 13.5px; color: var(--muted); }
.cc-cities { display: flex; flex-wrap: wrap; gap: 6px; }
.cc-cities span { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--fill); font-size: 13px; font-weight: 600; color: var(--ink-2); }
.cc-cities b { font-size: 12px; color: var(--muted); }
.cc-cities .more-n { color: var(--muted); }
.cc-photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.cc-photos .photo { height: 48px; border-radius: var(--r-sm); }
.lib-page { padding-bottom: 96px; }
@media (min-width: 1024px) { .home-side .hscroll > :nth-child(n+7) { display: none; } }
.region-tabs { margin-top: 14px; }
.region-sec { margin-top: 18px; }
.region-sec .section-head { margin-bottom: 10px; }
.region-sec .section-head h2 { font-size: 17px; }
.city-grid { display: grid; gap: 10px; }
@media (min-width: 760px) { .city-grid { grid-template-columns: 1fr 1fr; } }
.city-card { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 10px 12px 10px 10px; border: 0; text-align: left; color: inherit; }
.city-card .photo { width: 64px; height: 64px; border-radius: var(--r-sm); }
.city-card h3 { font-size: 16.5px; font-weight: 800; gap: 4px; align-items: center; }
.city-card h3 .ic { color: var(--green-text); }
.city-card .meta { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.city-card .names { font-size: 12.5px; color: var(--muted); }
.geo-head { display: grid; gap: 6px; padding-block: 10px 14px; }
.back-link { justify-self: start; margin-left: -12px; color: var(--ink-2); }
.geo-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.geo-head .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
.done-corner { position: absolute; top: -2px; right: -6px; display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--green-tint); color: var(--green-text); font-size: 12px; font-weight: 700; white-space: nowrap; }
.pcard-body:has(.done-corner) { padding-right: 70px; }
.insight-card, .nearby-card { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--r-lg); background: var(--ai-tint); }
.insight-card { margin-top: 14px; }
.insight-card h3, .nearby-card h3 { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; color: var(--ai-text); }
.insight-card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
.nearby-row { display: grid; gap: 12px; margin-top: 14px; }
@media (min-width: 760px) { .nearby-row { grid-template-columns: 1fr 1fr; } }
.nb-title { font-size: 15px; }
.nb-list { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; counter-reset: nb; }
.nb-list::-webkit-scrollbar { display: none; }
.nb-list li { flex: none; counter-increment: nb; }
.nb-list button { position: relative; display: grid; gap: 4px; width: 80px; padding: 0; border: 0; background: none; text-align: left; color: inherit; }
.nb-list button::before { content: counter(nb); position: absolute; z-index: 1; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); color: var(--ai-text); font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.nb-list .photo { width: 80px; height: 64px; border-radius: var(--r-sm); }
.nb-list span { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nb-inline { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
.lib-empty { justify-items: start; }
.lib-empty .lead { font-size: 15.5px; color: var(--ink-2); }
.ai-will { display: grid; gap: 6px; font-size: 14px; }
.ai-will ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ai-will li { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.ai-will .ic { color: var(--ai-text); }

/* ---------- place page ---------- */
.geo-block { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-card); }
.geo-block b { display: block; font-size: 15px; }
.geo-block span { font-size: 13.5px; color: var(--muted); }
.link { padding: 0; border: 0; background: none; font: inherit; font-weight: 700; color: var(--green-text); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; }
.place-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pa { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.pa .ic { color: var(--muted); }
.pa.on { border-color: color-mix(in srgb, var(--heart) 45%, var(--line)); background: color-mix(in srgb, var(--heart) 8%, var(--surface)); color: var(--heart); }
.pa.on .ic { color: var(--heart); }
.pa.on.done { border-color: var(--green); background: var(--green-tint); color: var(--green-text); }
.pa.on.done .ic { color: var(--green-text); }
.pa.go-trip { border-color: var(--green); background: var(--green); color: var(--green-ink); }
.pa.go-trip .ic { color: var(--green-ink); }
.trip-box { display: grid; gap: 8px; }
.trip-box h3 { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; }
.trip-box p { font-size: 14px; color: var(--ink-2); }

/* ---------- AI 整理, proposals, pickers ---------- */
.org-h { font-size: 15px; font-weight: 800; }
.org-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border-radius: var(--r-md); overflow: hidden; }
@media (min-width: 560px) { .org-stats { grid-template-columns: repeat(4, 1fr); } }
.org-stats > div { display: grid; gap: 2px; padding: 12px; background: var(--surface); }
.org-stats b { font-family: var(--font-display); font-size: 24px; font-weight: 800; }
.org-stats span { font-size: 12.5px; color: var(--muted); }
.org-working { display: grid; gap: 10px; }
.org-working h3 { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; color: var(--ai-text); }
.org-working .meter i { background: var(--ai); transition: width .4s; }
.org-summary { display: flex; align-items: flex-start; gap: 10px; padding: 14px; border-radius: var(--r-md); background: var(--ai-tint); color: var(--ai-text); }
.org-summary b { display: block; font-size: 15px; color: var(--ink); }
.org-summary small { display: block; margin-top: 2px; font-size: 13px; color: var(--ink-2); }
.org-tree { display: grid; gap: 10px; }
.org-branch { padding: 4px 6px 6px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-card); }
.org-path { padding: 6px 8px 2px; font-size: 12.5px; font-weight: 800; color: var(--green-text); }
.org-row { align-items: flex-start; }
.org-row b, .nc-row b { display: block; font-size: 14.5px; }
.org-row small, .nc-row small { display: block; font-size: 12.5px; color: var(--muted); }
.conf { padding: 2px 8px; border-radius: 999px; background: var(--ai-tint); color: var(--ai-text); font-size: 12px; font-weight: 700; white-space: nowrap; }
.needs-confirm { display: grid; gap: 10px; padding: 14px; border-radius: var(--r-md); background: var(--amber-tint); }
.needs-confirm h3 { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; color: var(--amber); }
.nc-row { display: grid; gap: 8px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface); }
.dup-card { display: grid; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-card); border-left: 4px solid var(--amber); }
.dup-head { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--amber); }
.dup-head b { color: var(--ink); }
.sim { padding: 2px 8px; border-radius: 999px; background: var(--amber-tint); color: var(--amber); font-size: 12.5px; font-weight: 700; }

const URL_RE = /https?:\/\/[^\s<>"'，。！？、；：（）【】《》「」]+/gi;

}

function fmtMoney(amount, cur, approx = false) {

function Avatars({ ids, ctx, max = 4, small }) {

/** Resolve people ids to names/avatars through the user capability (batched and cached by the platform). */
function useProfiles(ids, ctx) {
  const key = [...new Set((ids || []).filter(Boolean))].sort().join(',');
  const [people, setPeople] = useState({});
  useEffect(() => {
    let alive = true;
    if (!key || !ctx.user || !ctx.user.profiles) return;
    ctx.user.profiles(key.split(',')).then(p => alive && setPeople(p || {})).catch(() => {});
    return () => { alive = false; };
  }, [key, ctx.user]);
  return people;
}

  if (trip) {
    if (trip.coverAssetId) return { id: trip.coverAssetId, credit: trip.coverCredit };
    for (const d of (trip.plan && trip.plan.days) || []) for (const s of d.stops) { const p = pick(byId[s.placeId]); if (p) return { id: p.coverAssetId, credit: p.coverCredit, name: p.name }; }

    if (inCity) return { id: inCity.coverAssetId, credit: inCity.coverCredit, name: inCity.name };
  }
  const any = places.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).find(p => p.coverAssetId);

/* Library actions the user confirms on a card: merge two places, keep one, keep both apart. */
async function retirePlace(ctx, keep, drop) {
  const now = Date.now();
  for (const t of ctx.trips) {
    const patch = remapTripPlace(t, drop.id, keep.id);
    if (patch && !(await ctx.write('update', 'trips', t.id, { ...patch, updatedAt: now }))) return false;
  }
  for (const g of ctx.guides) {
    if ((g.savedPlaceIds || []).includes(drop.id)) await ctx.write('update', 'guides', g.id, { savedPlaceIds: [...new Set(g.savedPlaceIds.map(id => (id === drop.id ? keep.id : id)))] });
  }
  return ctx.write('remove', 'places', drop.id);
}
/** 合并: `keep` takes in what `drop` knows, trips point at `keep`, then `drop` is deleted. */
async function mergePlaces(ctx, keep, drop) {
  const patch = mergePlaceProposal(keep, drop);
  if (Object.keys(patch).length && !(await ctx.write('update', 'places', keep.id, { ...patch, updatedAt: Date.now() }))) return false;
  const ok = await retirePlace(ctx, keep, drop);
  if (ok) ctx.toast(`已合并成「${keep.name}」`);
  return ok;
}
/** 保留第一个: trips point at `keep`, `drop` is deleted without merging anything. */
async function keepFirstPlace(ctx, keep, drop) {
  const ok = await retirePlace(ctx, keep, drop);
  if (ok) ctx.toast(`保留了「${keep.name}」`);
  return ok;
}
/** 都保留: remember they are different places so the check never pairs them again. */
async function keepBothPlaces(ctx, a, b) {
  const ok = await ctx.write('update', 'places', a.id, { distinctFrom: [...new Set([...(a.distinctFrom || []), b.id])], updatedAt: Date.now() });

}

/**
 * Pan/zoom map: a rendered basemap image (or a plain paper field when the city has none yet) with photo pins,
 * neighbourhood labels and an optional numbered route. Pins keep their size while the map scales.

function MapCanvas({ points, fit, basemap, labels = [], route, base, selected, onSelect, full, height = 360, padTop = 20, padBottom = 20, padLeft = 16, padRight = 64, numbered }) {
  const wrap = useRef(null);
  const [vp, setVp] = useState({ w: 0, h: 0 });
  const [t, setT] = useState(null);
  const [anim, setAnim] = useState(false);
  const world = useMemo(() => {
    if (basemap) return { w: basemap.width / 2, h: basemap.height / 2, project: p => mapProject(basemap, p) };
    const pts = points.concat(base && hasCoord(base) ? [base] : []);
    const proj = makeProjection(pts.length ? pts : [{ lat: 0, lng: 0 }], 1600, 1100, 160);
    return { w: 1600, h: 1100, project: p => (proj ? proj.project(p) : [800, 550]) };
  }, [basemap, points.map(p => p.id + p.lat + p.lng).join('|')]);
  useEffect(() => {
    const el = wrap.current;
    if (!el) return;
    const ro = new ResizeObserver(() => setVp({ w: el.clientWidth, h: el.clientHeight }));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  /** Full-screen maps open with the basemap covering the whole view (no paper around it); 显示全部地点 may zoom out past that. */
  const cover = full && basemap ? Math.max(vp.w / world.w, vp.h / world.h) : 0;
  /** Keep the image over the whole view when it is big enough; otherwise centre it. Overlays may cover up to padTop/padBottom. */

    const W = world.w * n.s, H = world.h * n.s, room = vp.h - padTop - padBottom;
    if (cover && n.s >= cover - 1e-6) return { ...n, tx: Math.min(0, Math.max(vp.w - W, n.tx)), ty: Math.min(0, Math.max(vp.h - H, n.ty)) };
    const tx = W >= vp.w ? Math.min(0, Math.max(vp.w - W, n.tx)) : (vp.w - W) / 2;
    const ty = H >= room ? Math.min(padTop, Math.max(vp.h - padBottom - H, n.ty)) : padTop + (room - H) / 2;
    return { ...n, tx, ty };
  };
  const fitTo = useCallback((pts, animate, all) => {
    if (!vp.w || !vp.h) return;
    const xy = pts.filter(hasCoord).map(p => world.project(p));
    const usableH = Math.max(80, vp.h - padTop - padBottom), usableW = Math.max(80, vp.w - padLeft - padRight);
    let s, cx, cy;
    if (xy.length) {
      const xs = xy.map(p => p[0]), ys = xy.map(p => p[1]);
      const bw = Math.max(60, Math.max(...xs) - Math.min(...xs)), bh = Math.max(60, Math.max(...ys) - Math.min(...ys));
      s = Math.min((usableW - 40) / bw, (usableH - 70) / bh);
      cx = (Math.max(...xs) + Math.min(...xs)) / 2; cy = (Math.max(...ys) + Math.min(...ys)) / 2;
    } else {
      s = Math.min(vp.w / world.w, vp.h / world.h); cx = world.w / 2; cy = world.h / 2;
    }
    const min = Math.min(vp.w / world.w, vp.h / world.h) * 0.9;
    s = Math.max(min, Math.min(s, 4));
    if (cover && !all) s = Math.max(s, cover);
    setAnim(!!animate);
    setT(clampPan({ s, tx: padLeft + usableW / 2 - cx * s, ty: padTop + usableH / 2 - cy * s }));
  }, [vp.w, vp.h, world, cover, padTop, padBottom, padLeft, padRight]);
  const fitPoints = () => fit || points.concat(base && hasCoord(base) ? [base] : []);
  const fitKey = points.map(p => p.id).join(',') + '|' + (fit ? fit.length : '') + (basemap ? basemap.id : '') + vp.w + 'x' + vp.h;

    ${ready ? html`<div class=${'map-world' + (basemap ? '' : ' synthetic') + (anim ? ' animate' : '')}

/** Run one Claude call with progress, stop and a readable error; resolves undefined when it fails. */
function useAiJob(ctx) {
  const [st, setSt] = useState({ phase: 'idle', stream: '', started: 0, error: '' });
  const ctl = useRef(null);
  useEffect(() => () => ctl.current && ctl.current.abort(), []);
  async function run(fn) {
    ctl.current = new AbortController();
    setSt({ phase: 'working', stream: '', started: Date.now(), error: '' });
    try {
      const out = await fn(text => setSt(s => ({ ...s, stream: text })), ctl.current.signal);
      setSt(s => ({ ...s, phase: 'idle' }));
      return out;
    } catch (e) {
      const code = e && e.code;
      setSt({ phase: 'idle', stream: '', started: 0, error: code === 'cancelled' ? '' : aiErrorText(e) });
      if (PERMANENT_AI_ERRORS.has(code)) ctx.onAiBlocked(code);
      return undefined;
    }
  }
  return { ...st, run, stop: () => ctl.current && ctl.current.abort() };
}

function Timeline({ ctx, trip, day, dayIndex, base, cur, changed }) {
  const stops = day.stops || [];
  const rows = [];
  const hasBase = !!(base && base.name);
  const total = stops.length + (hasBase ? 1 : 0);
  const pos = k => (total === 1 ? ' only' : k === 0 ? ' first' : k === total - 1 ? ' last' : '');
  const where = s => ({ ...s, city: s.city || day.city, country: s.country || trip.country });
  // A transfer's journey ends at its arrival station when the plan gives one, else at the next stop.
  const arrival = j => {
    const t = stops[j];
    if (hasCoord(t)) return { name: t.nameLocal || String(t.name).split('→').pop().trim(), lat: t.lat, lng: t.lng, city: t.city || day.city, country: t.country || trip.country };
    const next = stops.slice(j + 1).find(x => x.kind !== 'transfer');
    return next ? where(next) : null;
  };
  const startPt = hasBase ? { ...base, city: base.city || day.city, country: trip.country } : null;
  if (hasBase) {
    const t0 = stops[0] && stops[0].travel;
    rows.push(html`<li key="base" class=${'tl-row' + pos(0)}>
      <time></time><span class="rail"><span class="dot base"></span></span>
      <div class="photo stay-ph"><${Icon} name="stay" size=${24} /></div>
      <div class="info"><b>酒店出发</b><small>从${spaced(base.name)}出发${t0 && t0.minutes ? ` · 约 ${fmtMin(t0.minutes)}` : ''}</small></div><span></span>
    </li>`);
  }
  stops.forEach((s, j) => {
    const before = stops[j - 1];
    const prev = j === 0 ? startPt : before.kind === 'transfer' ? arrival(j - 1) : where(before);
    const row = html`<${StopRow} key=${'s' + j} ctx=${ctx} trip=${trip} s=${s} j=${j} dayIndex=${dayIndex} cls=${pos(j + (hasBase ? 1 : 0))} lit=${changed.has(j)} cur=${cur} />`;
    if (s.kind === 'transfer') {
      rows.push(row);
      if (s.travel) rows.push(html`<${Leg} key=${'l' + j} ctx=${ctx} from=${prev} to=${arrival(j)} travel=${s.travel} cur=${cur} />`);
    } else {
      if (s.travel) rows.push(html`<${Leg} key=${'l' + j} ctx=${ctx} from=${prev} to=${where(s)} travel=${s.travel} cur=${cur} />`);
      rows.push(row);
    }
  });
  if (!stops.length) return html`<p class="hint" style=${{ padding: '12px 0' }}>这一天还没有安排。可以点「AI 优化这一天」，或者从「待安排」里加地点。</p>`;
  return html`<ol class="tl">${rows}</ol>`;
}

function stopPins(trip, dayIdx, ctx, all) {
  const plan = planOf(trip);
  const days = all ? plan.days.map((d, i) => [d, i]) : plan.days[dayIdx] ? [[plan.days[dayIdx], dayIdx]] : [];
  const out = [];
  for (const [d, i] of days) {
    (d.stops || []).forEach((s, j) => {
      if (!hasCoord(s) || s.kind === 'transfer') return;
      const p = s.placeId && ctx.placesById[s.placeId];
      out.push({ id: `${i}_${j}`, name: s.name, lat: s.lat, lng: s.lng, category: s.category, photo: p && p.coverAssetId, status: p ? p.status : 'saved', num: all ? null : j + 1, place: p || null });
    });
  }
  return out;
}
function DayMap({ ctx, trip, dayIdx, all, height = 380, selected, onSelect }) {
  const plan = planOf(trip);
  const day = plan.days[dayIdx];
  const pins = stopPins(trip, dayIdx, ctx, all);
  let base = !all && day ? baseForDay(trip, dayIdx) : null;
  // The hotel shows only on its own city's map (a travel day starts in the previous city).
  if (base && (!hasCoord(base) || (base.city && day.city && !sameCity(base.city, day.city)))) base = null;
  const basemap = pickBasemap(ctx.maps, pins, day ? day.city : tripCities(trip)[0]);
  const labels = areaLabels(pins.map(x => x.place).filter(Boolean));
  // Fit the day's stops; a hotel far from them would shrink the day into a corner, so it joins the fit only when close.
  let fit = pins.concat(base ? [base] : []);
  if (base && pins.length >= 2) {
    const c = centroid(pins), spread = Math.max(...pins.map(x => haversineKm(x, c)));
    if (haversineKm(base, c) > Math.max(2.5, spread * 2)) fit = pins;
  }
  return html`<${MapCanvas} points=${pins} fit=${fit.length ? fit : null} basemap=${basemap} labels=${labels} route=${all ? null : pins} base=${base}
    numbered=${!all} height=${height} selected=${selected} onSelect=${onSelect || (() => {})} />`;
}

function fxLine(ctx, cur) {
  const fx = ctx.fx;
  if (!cur || cur === ctx.home) return '';
  const per = toHome(1, ctx.home, fx, cur);
  if (per == null) return '';
  const manual = fx && fx.manual && num(fx.manual[cur]);
  const digits = per >= 100 ? 1 : per >= 1 ? 2 : 4;
  return `汇率 ${fmtMoney(1, ctx.home)} = ${per.toFixed(digits)} ${cur}${manual ? '（手动设置）' : fx.date ? `（${fx.date} · ${fx.source || '公开汇率'}）` : ''}`;
}

/* ---------- trip sheets ---------- */
function ReviseSheet({ ctx, trip, dayIndex, preset, accept: acceptLabel, onClose }) {
  const plan = planOf(trip);
  const day = dayIndex != null ? plan.days[dayIndex] : null;
  const [feedback, setFeedback] = useState(preset || '');
  const [proposal, setProposal] = useState(null);
  const [saving, setSaving] = useState(false);
  const job = useAiJob(ctx);
  const quick = day ? ['这天轻松一点', '少走回头路', '加一个顺路的午餐', '改成打车为主', '早上晚点出发', '下雨的话怎么改']
    : ['第一天轻松一点', '每天加一个午餐推荐', '改成打车为主', '把购物放到最后一天', '早上晚点出发'];
  async function run() {
    const fb = feedback.trim();
    if (!fb) return;
    const scoped = day ? `只调整 Day ${dayIndex + 1}（${[day.city, day.area, day.theme].filter(Boolean).join(' · ')}），其他天保持不变。${fb}` : fb;
    await job.run(async (onText, signal) => {
      const ids = new Set([...(trip.placeIds || []), ...tripPlaces(trip, ctx.places).map(p => p.id)]);
      const pool = ctx.places.filter(p => ids.has(p.id));
      const prompt = buildRevisePrompt({ trip, places: pool, feedback: scoped, lang: ctx.prefs.aiLang, allowSuggest: !trip.prefs || trip.prefs.suggest !== false });
      const raw = await ctx.ai.json(prompt, { tier: ctx.prefs.deepPlan ? 'complex' : 'default', onText, signal, cache: false });
      const byId = Object.fromEntries(pool.map(p => [p.id, p]));
      const next = normalizePlan(raw, byId, { startDate: trip.startDate, stays: tripStays(trip), placeIds: trip.placeIds || [], city: tripCities(trip)[0], country: trip.country, currency: plan.currency || tripCurrency(trip, ctx.places) });
      if (!next.days.length) throw { code: 'invalid_json' };
      if (!next.title) next.title = plan.title;
      setProposal({ next, changed: changedKeys(diffPlan(plan, next)), stats: planProposalStats(plan, next, dayIndex) });
    });
  }
  async function adopt() {
    const { next, changed } = proposal;
    setSaving(true);
    const placeIds = [...new Set([...(trip.placeIds || []), ...next.days.flatMap(d => d.stops.map(s => s.placeId).filter(Boolean))])];
    const ok = await ctx.write('update', 'trips', trip.id, { plan: next, placeIds, changed, updatedAt: Date.now(), revisions: (trip.revisions || 0) + 1 });
    setSaving(false);
    if (ok) { ctx.toast(changed.length ? `已采用，改动的 ${changed.length} 处用黄色标出` : '已采用'); onClose(); }
  }
  let footer = null;
  if (proposal && job.phase !== 'working') {
    footer = html`<button class="btn" onClick=${onClose}>保持原行程</button>
      <button class="btn green" disabled=${saving} onClick=${adopt}><${Icon} name=${acceptLabel ? 'sparkle' : 'check'} size=${16} />${acceptLabel || '采用这个方案'}</button>`;
  } else if (job.phase !== 'working') {
    footer = html`<button class="btn" onClick=${onClose}>取消</button>
      <button class="btn ai" disabled=${!ctx.ai.ok || !feedback.trim()} onClick=${run}><${Icon} name="sparkle" size=${16} />开始调整</button>`;
  }
  const title = day ? `AI 优化 Day ${dayIndex + 1}` : acceptLabel ? 'AI 帮我安排' : '调整整个行程';
  return html`<${Sheet} title=${title} onClose=${onClose} footer=${footer}>
    ${job.phase === 'working' ? html`<${AiProgress} label="正在调整" text=${job.stream} started=${job.started} onStop=${job.stop} counter=${t => `已排 ${(t.match(/"time"\s*:/g) || []).length} 站`} />`
    : proposal ? html`<${PlanProposal} ctx=${ctx} trip=${trip} plan=${plan} proposal=${proposal} dayIndex=${dayIndex} />`
    : html`
      ${day ? html`<p class="hint">${[day.city, day.area, day.theme].filter(Boolean).join(' · ')}：${(day.stops || []).map(s => s.name).join(' → ')}</p>` : null}
      <div class="chips wrap">${quick.map(q => html`<button class="chip" onClick=${() => setFeedback(f => (f ? f + '；' : '') + q)}>${q}</button>`)}</div>
      <div class="field"><label for="rv-text">想怎么改？</label>
        <textarea id="rv-text" class="input" rows="3" value=${feedback} onInput=${e => setFeedback(e.target.value)} placeholder="例如：太赶了，把博物馆挪到 Day 3；中午想吃当地小吃"></textarea></div>
      <p class="hint">AI 会考虑距离、营业时间、饭点、停留时间、你标的想去、住哪里和交通方式。先给你看调整方案，你点「采用」之后才会修改行程。</p>
      ${!ctx.ai.ok ? html`<${Notice} warn>${ctx.ai.reason}<//>` : null}
      ${job.error ? html`<${Notice} warn role="alert">${job.error}<//>` : null}`}
  <//>`;
}
/** Before / after of an AI revision: travel minutes, places newly placed or dropped, the new order of the day. Nothing is saved here. */
function PlanProposal({ ctx, plan, proposal, dayIndex }) {
  const { next, stats, changed } = proposal;

  const days = dayIndex != null ? [[next.days[dayIndex], dayIndex]] : next.days.map((d, i) => [d, i]);

  return html`<div class="proposal fade-up">
    <div class="cmp" aria-label="移动时间对比">

      <div class="after"><small>${dayIndex != null ? '优化后' : '调整后'}</small><b class="num">${fmtMin(stats.after) || '—'}</b><span>移动</span></div>
    </div>
    <p class=${'saved' + (delta > 0 ? ' good' : '')}>${delta > 0 ? `节省 ${fmtMin(delta)}` : delta < 0 ? `多 ${fmtMin(-delta)}，换来更多安排` : '移动时间差不多'}${stats.placed.length ? ` · 新排进 ${stats.placed.length} 个地点` : ''}</p>
    ${stats.placed.length ? html`<p class="hint">新排进：${stats.placed.map(name).filter(Boolean).join('、')}</p>` : null}
    ${stats.dropped.length ? html`<${Notice} warn>不再安排：${stats.dropped.map(name).filter(Boolean).join('、')}（会回到「待安排」）<//>` : null}
    ${days.map(([d, i]) => html`<section class="pp-day" key=${i}>
      <h4>Day ${i + 1}${d.city ? ' · ' + d.city : ''}${d.theme ? ' · ' + d.theme : ''}<span class="hint">${fmtMin(dayMoveMin(d)) ? ` 移动 ${fmtMin(dayMoveMin(d))}` : ''}</span></h4>
      <ol class="proposal-stops">${(d.stops || []).map((s, j) => html`<li key=${j} class=${lit.has(`${i}:${j}`) ? 'lit' : ''}>
        <time class="num">${s.time}</time><span class="grow">${s.name}${s.suggested ? html`<span class="tag ai">AI 推荐</span>` : null}</span>
        ${s.travel && s.travel.minutes ? html`<small>${MODES[s.travel.mode] || ''} ${fmtMin(s.travel.minutes)}</small>` : null}</li>`)}</ol>
    </section>`)}
    ${next.unplaced.length ? html`<p class="hint">还没排进去 ${next.unplaced.length} 个：${next.unplaced.slice(0, 6).map(u => `${name(u.placeId)}${u.reason ? `（${u.reason}）` : ''}`).join('、')}</p>` : null}
    <p class="hint">黄色是改动的地方。交通时间是 AI 估计的，出发前用地图确认。</p>
  </div>`;
}

function TripFormSheet({ ctx, initial, onClose }) {
  const { places } = ctx;
  const replacing = initial.replaceId ? ctx.trips.find(t => t.id === initial.replaceId) : null;
  const initIds = initial.placeIds || (replacing && replacing.placeIds) || [];
  const known = c => ctx.cities.find(k => sameCity(k, c)) || str(c, 30);
  const firstCities = () => {
    if (initial.cities && initial.cities.length) return [...new Set(initial.cities.map(known).filter(Boolean))];
    if (replacing) return tripCities(replacing);
    if (initIds.length) return [...new Set(initIds.map(id => (ctx.placesById[id] || {}).city).filter(Boolean))];
    return ctx.cities.slice(0, 1);
  };
  const countIn = c => places.filter(p => sameCity(p.city, c) && p.status !== 'visited').length;
  const allocate = (cs, total) => allocateDays(cs.map(c => ({ city: c, n: countIn(c) })), Math.max(total, cs.length));
  const [stays, setStays] = useState(() => {
    const cs = firstCities();
    if (replacing && !initial.cities) return tripStays(replacing).map(s => ({ city: s.city, days: s.days }));
    return allocate(cs, clampNum(initial.days, 1, 30) || Math.max(cs.length, 3));
  });
  const [hotels, setHotels] = useState(() => {
    const o = {};
    if (replacing) for (const s of tripStays(replacing)) if (s.base && s.base.name) o[s.city] = s.base.name;
    if (initial.bases && typeof initial.bases === 'object') for (const [c, v] of Object.entries(initial.bases)) if (v) o[known(c)] = str(v, 60);
    return o;
  });
  const [startDate, setStartDate] = useState(/^\d{4}-\d{2}-\d{2}$/.test(initial.startDate || '') ? initial.startDate : (replacing && replacing.startDate) || '');
  const [pace, setPace] = useState(PACES[initial.pace] ? initial.pace : (replacing && replacing.prefs && replacing.prefs.pace) || 'normal');
  const [transport, setTransport] = useState(TRANSPORTS[initial.transport] ? initial.transport : (replacing && replacing.prefs && replacing.prefs.transport) || 'transit');
  const [notes, setNotes] = useState(str(initial.notes, 300) || (replacing && replacing.prefs && replacing.prefs.notes) || '');
  const [budget, setBudget] = useState(replacing && replacing.budget ? String(replacing.budget) : '');
  const [suggest, setSuggest] = useState(!replacing || !replacing.prefs || replacing.prefs.suggest !== false);
  const [picked, setPicked] = useState(() => {
    if (replacing) return new Set(initIds.filter(id => !(replacing.skipped || []).includes(id)));
    return new Set([...initIds, ...places.filter(p => p.status !== 'visited' && stays.some(s => sameCity(s.city, p.city))).map(p => p.id)]);
  });
  const [newCity, setNewCity] = useState('');
  const job = useAiJob(ctx);
  const cities = stays.map(s => s.city);
  const total = stays.reduce((n, s) => n + s.days, 0);

  const setCities = cs => {
    setStays(allocate(cs, Math.max(total, cs.length)));
    setPicked(set => {
      const n = new Set([...set].filter(id => { const p = ctx.placesById[id]; return p && (initIds.includes(id) || cs.some(c => sameCity(c, p.city))); }));
      for (const p of places) if (p.status !== 'visited' && cs.some(c => sameCity(c, p.city)) && !cities.some(c => sameCity(c, p.city))) n.add(p.id);
      return n;
    });
  };
  const addCity = c => { c = known(c.trim()); if (c && !cities.some(x => sameCity(x, c))) setCities([...cities, c]); setNewCity(''); };
  const removeCity = c => setCities(cities.filter(x => x !== c));
  const moveCity = (i, d) => { const cs = cities.slice(); [cs[i], cs[i + d]] = [cs[i + d], cs[i]]; setStays(cs.map(c => stays.find(s => s.city === c))); };
  const setTotal = n => setStays(allocate(cities, Math.min(30, Math.max(cities.length || 1, n))));
  const setCityDays = (i, n) => setStays(stays.map((s, j) => (j === i ? { ...s, days: Math.min(20, Math.max(1, n)) } : s)));
  const toggle = id => setPicked(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const chosen = places.filter(p => picked.has(p.id));
  const others = ctx.cities.filter(c => !cities.some(x => sameCity(x, c)));
  const groups = cities.map(c => [c, places.filter(p => sameCity(p.city, c))]);
  const strays = chosen.filter(p => !cities.some(c => sameCity(c, p.city)));

  async function generate() {
    const st = stays.map(s => ({ city: s.city, days: s.days, base: hotels[s.city] && hotels[s.city].trim() ? { name: hotels[s.city].trim() } : null }));
    const trip = { days: total, startDate, stays: st, prefs: { pace, transport, notes: notes.trim() } };
    const country = (chosen.find(p => p.country && cities.some(c => sameCity(c, p.city))) || chosen.find(p => p.country) || {}).country || '';
    await job.run(async (onText, signal) => {
      const groupsByCity = {};
      for (const s of st) groupsByCity[s.city] = clusterIntoDays(chosen.filter(p => sameCity(p.city, s.city)), s.days, null);
      const prompt = buildPlanPrompt({ trip, stays: st, places: chosen, groupsByCity, lang: ctx.prefs.aiLang, allowSuggest: suggest });
      const raw = await ctx.ai.json(prompt, { tier: ctx.prefs.deepPlan ? 'complex' : 'default', onText, signal, cache: false });
      const byId = Object.fromEntries(chosen.map(p => [p.id, p]));
      const plan = normalizePlan(raw, byId, { startDate, stays: st, placeIds: chosen.map(p => p.id), city: st[0].city, country, currency: currencyOf(country) });
      if (!plan.days.length) throw { code: 'invalid_json' };
      const now = Date.now();
      const id = replacing ? replacing.id : uid('t');
      const doc = {
        id, title: plan.title || `${cities.join(' · ')} ${total} 日`, city: st[0].city, cities, country, days: total, startDate, stays: st, base: plan.base,
        prefs: { ...trip.prefs, suggest }, budget: num(budget) > 0 ? num(budget) : null, placeIds: chosen.map(p => p.id), plan, changed: [], skipped: [],
        createdBy: replacing ? replacing.createdBy || null : ctx.me, example: false, createdAt: replacing ? replacing.createdAt || now : now, updatedAt: now,
      };
      if (await ctx.write('set', 'trips', id, doc)) {
        ctx.toast('行程排好了');
        onClose();
        if (!replacing) ctx.nav.push({ name: 'trip', id, tabGroup: 'trips' });
      }
    });
  }
  const footer = job.phase === 'working' ? null : html`
    <span class="hint num" style=${{ marginRight: 'auto' }}>${chosen.length} 个地点 · ${total} 天</span>
    <button class="btn" onClick=${onClose}>取消</button>
    <button class="btn green" disabled=${!ctx.ai.ok || !chosen.length || !cities.length} onClick=${generate}><${Icon} name="sparkle" size=${16} />${replacing ? '重新排' : '生成行程'}</button>`;
  return html`<${Sheet} title=${replacing ? '改城市或天数，重新排' : '排行程'} onClose=${onClose} footer=${footer} wide>
    ${job.phase === 'working' ? html`<${AiProgress} label="正在排路线" text=${job.stream} started=${job.started} onStop=${job.stop} counter=${t => `已排 ${(t.match(/"time"\s*:/g) || []).length} 站`} />` : html`
      <div class="field"><span class="label">去哪些城市（按顺序）</span>
        ${cities.length ? html`<div class="stack" style=${{ gap: '8px' }}>${stays.map((s, i) => html`<div class="stay-row" key=${s.city}>
          <div class="row"><span class="order num">${i + 1}</span><b class="grow">${s.city}</b>
            ${cities.length > 1 ? html`<div class="stepper" aria-label=${s.city + ' 天数'}><button aria-label="少一天" onClick=${() => setCityDays(i, s.days - 1)}><${Icon} name="minus" size=${16} /></button><b>${s.days} 天</b><button aria-label="多一天" onClick=${() => setCityDays(i, s.days + 1)}><${Icon} name="plus" size=${16} /></button></div>` : null}
            ${cities.length > 1 && i > 0 ? html`<button class="icon-btn" aria-label=${'把 ' + s.city + ' 往前挪'} onClick=${() => moveCity(i, -1)}><${Icon} name="back" size=${18} /></button>` : null}
            <button class="icon-btn" aria-label=${'去掉 ' + s.city} onClick=${() => removeCity(s.city)}><${Icon} name="x" size=${18} /></button></div>
          <input class="input" aria-label=${s.city + ' 住哪里'} value=${hotels[s.city] || ''} onInput=${e => setHotels(h => ({ ...h, [s.city]: e.target.value }))}
            placeholder=${i > 0 ? '住哪里（不填 = 当天往返，从上一个城市出发）' : '住哪里（酒店名或区域，可选）'} />
        </div>`)}</div>` : html`<p class="hint">先选一个城市。</p>`}
        ${others.length ? html`<div class="chips wrap" style=${{ marginTop: '4px' }}>${others.map(c => html`<button class="chip outline" onClick=${() => addCity(c)}><${Icon} name="plus" size=${14} />${c} <span class="n">${countIn(c)}</span></button>`)}</div>` : null}
        <form class="row" onSubmit=${e => { e.preventDefault(); addCity(newCity); }}>
          <input class="input" list="known-cities" value=${newCity} onInput=${e => setNewCity(e.target.value)} placeholder="输入其他城市，例如 釜山、清迈、巴黎" aria-label="添加城市" />
          <button class="btn" disabled=${!newCity.trim()}>添加</button></form>
      </div>
      <div class="grid2">
        <div class="field"><span class="label">一共几天</span>
          <div class="stepper"><button aria-label="少一天" onClick=${() => setTotal(total - 1)}><${Icon} name="minus" size=${16} /></button><b class="num">${total} 天</b><button aria-label="多一天" onClick=${() => setTotal(total + 1)}><${Icon} name="plus" size=${16} /></button></div></div>
        <div class="field"><label for="tp-date">出发日期（可选）</label><input id="tp-date" class="input" type="date" value=${startDate} onInput=${e => setStartDate(e.target.value)} /></div>
      </div>
      <div class="grid2">
        <div class="field"><span class="label">节奏</span><div class="chips wrap">${Object.entries(PACES).map(([k, v]) => html`<button class="chip" aria-pressed=${pace === k} onClick=${() => setPace(k)}>${v}</button>`)}</div></div>
        <div class="field"><span class="label">交通</span><div class="chips wrap">${Object.entries(TRANSPORTS).map(([k, v]) => html`<button class="chip" aria-pressed=${transport === k} onClick=${() => setTransport(k)}>${v}</button>`)}</div></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="tp-budget">预算（${ctx.home}，可选）</label><input id="tp-budget" class="input" inputmode="decimal" value=${budget} onInput=${e => setBudget(e.target.value)} placeholder="例如 5000" /></div>
        <div class="field"><label for="tp-notes">其他要求（可选）</label><input id="tp-notes" class="input" value=${notes} onInput=${e => setNotes(e.target.value)} placeholder="例如：带老人少走路、想看日落" /></div>
      </div>
      <label class="check-row" style=${{ padding: 0 }}><input type="checkbox" checked=${suggest} onChange=${e => setSuggest(e.target.checked)} /><span>允许 AI 补充顺路的吃饭推荐（会标「AI 推荐」）</span></label>
      <div class="field">
        <div class="row" style=${{ justifyContent: 'space-between' }}><span class="label">要去的地点（${chosen.length}）</span>
          <span class="row"><button class="btn ghost sm" onClick=${() => setPicked(new Set([...picked, ...groups.flatMap(([, l]) => l.map(p => p.id))]))}>全选</button><button class="btn ghost sm" onClick=${() => setPicked(new Set())}>全不选</button></span></div>
        <div class="checklist">
          ${groups.map(([c, list]) => html`<div key=${c}><p class="group-label">${c}</p>
            ${list.length ? list.map(p => html`<label key=${p.id} class="check-row"><input type="checkbox" checked=${picked.has(p.id)} onChange=${() => toggle(p.id)} />
              <span class="grow">${p.name} <span class="hint">${p.area || ''}</span></span>
              ${p.status === 'want' ? html`<span class="tag shopping">想去</span>` : p.status === 'visited' ? html`<span class="tag plain">去过</span>` : html`<${CatTag} cat=${p.category} />`}</label>`)
              : html`<p class="hint" style=${{ padding: '4px 8px 8px' }}>还没有收藏，AI 会按${c}的热门地点推荐。</p>`}</div>`)}
          ${strays.length ? html`<div><p class="group-label">其他城市</p>${strays.map(p => html`<label key=${p.id} class="check-row"><input type="checkbox" checked=${true} onChange=${() => toggle(p.id)} /><span class="grow">${p.name} <span class="hint">${p.city}</span></span></label>`)}</div>` : null}
        </div>
      </div>
      ${!ctx.ai.ok ? html`<${Notice} warn>${ctx.ai.reason}<//>` : null}
      ${job.error ? html`<${Notice} warn role="alert">${job.error}<//>` : null}`}
  <//>`;
}

function AddToTripSheet({ ctx, placeIds, sameDay, onClose }) {
  const ids = (placeIds || []).filter(id => ctx.placesById[id]);
  const list = ctx.trips.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const one = ids.length === 1 ? ctx.placesById[ids[0]] : null;
  async function add(t) {
    const r = await addPlacesToTrip(ctx, t, ids);
    if (!r) return;
    ctx.toast(r.added ? `已加入「${tripTitle(t)}」的待安排` : '已经在这趟行程里了');
    onClose();
  }
  async function toDay(t, j) { if (await addToDay(ctx, t, j, ids)) onClose(); }
  return html`<${Sheet} title=${sameDay ? `${ids.length} 个地点排在同一天` : '加入行程'} onClose=${onClose} footer=${html`<button class="btn green block" onClick=${() => ctx.openSheet({ type: 'trip', placeIds: ids })}><${Icon} name="plus" size=${18} />新建一趟行程</button>`}>
    ${one ? html`<div class="row" style=${{ gap: '12px' }}><${Photo} id=${one.coverAssetId} cat=${one.category} className="thumb" /><div class="grow"><b>${one.name}</b><p class="hint">${[one.area, one.city].filter(Boolean).join(' · ')}</p></div></div>`
      : html`<p class="hint">${ids.map(id => ctx.placesById[id].name).join('、')}</p>`}
    ${list.length ? html`<div class="stack" style=${{ gap: '8px' }}>${list.map(t => {
      const sched = scheduledIds(t);
      const inside = ids.every(id => sched.has(id) || (t.placeIds || []).includes(id));
      const fits = ids.some(id => tripCities(t).some(c => sameCity(c, ctx.placesById[id].city)));
      const days = planOf(t).days;
      const multi = tripCities(t).length > 1;
      return html`<div class="pick-trip-wrap" key=${t.id}><button class="pick-trip" onClick=${() => add(t)}>
        <${Flag} country=${t.country} />
        <span class="grow"><b>${tripTitle(t)}</b><small>${[tripCities(t).join(' → '), tripDates(t)].join(' · ')}${!fits ? ' · 不在这趟的城市里' : ''}</small></span>
        <span class=${'tag ' + (inside ? 'plain' : 'add')}>${inside ? '已在行程里' : sameDay && days.length ? '待安排' : '加入'}</span></button>
        ${sameDay && days.length && fits ? html`<div class="chips wrap day-pick" role="group" aria-label=${`排进「${tripTitle(t)}」的哪一天`}>${days.map((d, j) => html`<button key=${j} class="chip" onClick=${() => toDay(t, j)}>加入 Day ${j + 1}${multi && d.city ? ' · ' + d.city : d.area ? ' · ' + d.area : ''}</button>`)}</div>` : null}
      </div>`;
    })}</div>` : html`<p class="hint">还没有行程。新建一趟，把这些地点排进去。</p>`}
    <p class="hint">${sameDay ? '选一天，这些地点会排在那天的最后，时间和交通可以再让 AI 重新排；点行程本身则先放进「待安排」。' : '加入后会先放在行程的「待安排」，再让 AI 排进合适的那一天。'}</p>
  <//>`;
}

function StopSheet({ ctx, trip, dayIndex, stopIndex, onClose }) {
  const plan = planOf(trip);
  const day = plan.days[dayIndex];
  const s = day && (day.stops || [])[stopIndex];
  if (!s) return html`<${Sheet} title="这一站" onClose=${onClose}><p class="hint">这一站已经不在行程里了。</p><//>`;
  const p = s.placeId ? ctx.placesById[s.placeId] : null;
  const cur = plan.currency || tripCurrency(trip, ctx.places);
  const base = baseForDay(trip, dayIndex);
  const prevRaw = stopIndex > 0 ? day.stops[stopIndex - 1] : base && base.name ? base : null;
  const prev = prevRaw ? { ...prevRaw, city: prevRaw.city || day.city, country: prevRaw.country || trip.country } : null;
  const here = { ...s, city: s.city || day.city, country: s.country || trip.country };
  const spendHome = s.spend ? toHome(s.spend, cur, ctx.fx, ctx.home) : null;
  const clone = () => plan.days.map(d => ({ ...d, stops: (d.stops || []).slice() }));
  const keepChanged = days => (trip.changed || []).filter(k => !days.some(d => k.startsWith(d + ':')));
  const save = (days, touched, extra = {}) => ctx.write('update', 'trips', trip.id, { plan: { days, ...extra }, changed: keepChanged(touched), updatedAt: Date.now() });
  async function swap(dir) {
    const days = clone(), list = days[dayIndex].stops, k = stopIndex + dir;
    const a = list[stopIndex], b = list[k];
    list[stopIndex] = { ...b, time: a.time };
    list[k] = { ...a, time: b.time };
    if (await save(days, [dayIndex])) onClose();
  }
  async function toDay(j) {
    const days = clone();
    const [x] = days[dayIndex].stops.splice(stopIndex, 1);
    days[j].stops.push({ ...x, travel: null });
    if (await save(days, [dayIndex, j])) { ctx.toast(`已移到 Day ${j + 1} 的最后，交通可以让 AI 重新算`); onClose(); }
  }
  async function remove() {
    const days = clone();
    days[dayIndex].stops.splice(stopIndex, 1);
    const unplaced = plan.unplaced.slice();
    if (s.placeId && !unplaced.some(u => u.placeId === s.placeId)) unplaced.push({ placeId: s.placeId, reason: '从行程里移出' });
    if (await save(days, [dayIndex], { unplaced })) { ctx.toast(s.placeId ? '已移到「待安排」' : '已删除这一站'); onClose(); }
  }
  const facts = [
    ['时间', [s.time, stayHint(s.stayMin)].filter(Boolean).join(' · ')],
    ['花费', s.spend ? `约 ${fmtMoney(s.spend, cur)}${spendHome != null && cur !== ctx.home ? ` · ≈ ${fmtMoney(spendHome, ctx.home, true)}` : ''}` : s.spend === 0 ? '免费' : ''],
    ['怎么过来', travelLine(s.travel, cur)],
  ].filter(f => f[1]);
  return html`<${Sheet} title=${`Day ${dayIndex + 1} · 第 ${stopIndex + 1} 站`} onClose=${onClose}>
    <div class="row" style=${{ gap: '12px', alignItems: 'flex-start' }}>
      <${Photo} id=${p && p.coverAssetId} cat=${s.category} className="thumb" />
      <div class="grow"><h3 style=${{ fontSize: '18px', fontWeight: 800 }}>${s.name}</h3>
        ${s.nameLocal && s.nameLocal !== s.name ? html`<p class="hint">${s.nameLocal}</p>` : null}
        <div class="row wrap" style=${{ marginTop: '6px', gap: '6px' }}>${s.kind === 'transfer' ? html`<span class="tag transport">换城市</span>` : html`<${CatTag} cat=${s.category} />`}${s.suggested ? html`<span class="tag ai">AI 推荐</span>` : null}</div></div>
    </div>
    ${s.what ? html`<p>${s.what}</p>` : null}
    ${s.tip ? html`<div class="ai-box"><h3><${Icon} name="bot" size=${17} />小贴士</h3><p>${s.tip}</p></div>` : null}
    ${facts.length ? html`<dl class="facts">${facts.map(([k, v]) => html`<div><dt>${k}</dt><dd>${v}</dd></div>`)}${facts.length % 2 ? html`<div></div>` : null}</dl>` : null}
    <div class="row wrap">
      ${s.kind !== 'transfer' ? html`<${ExtLink} href=${placeLink(here, ctx.prefs.mapPref)}><${Icon} name="map" size=${15} />地图<//>` : null}
      ${prev ? html`<${ExtLink} href=${legLink(prev, here, (s.travel && s.travel.mode) || 'walk', ctx.prefs.mapPref)}><${Icon} name="compass" size=${15} />路线<//>` : null}
      ${p ? html`<button class="btn sm" onClick=${() => { onClose(); ctx.nav.push({ name: 'place', id: p.id }); }}><${Icon} name="info" size=${15} />地点详情</button>` : null}
      ${p ? html`<button class="btn sm" onClick=${() => ctx.write('update', 'places', p.id, { status: p.status === 'visited' ? 'want' : 'visited', visitedAt: p.status === 'visited' ? null : Date.now(), updatedAt: Date.now() })}><${Icon} name="check" size=${15} />${p.status === 'visited' ? '改回没去过' : '标记去过'}</button>` : null}
    </div>
    <div class="field"><span class="label">调整顺序</span>
      <div class="row wrap">
        <button class="btn sm" disabled=${stopIndex === 0} onClick=${() => swap(-1)}>往前一站</button>
        <button class="btn sm" disabled=${stopIndex === day.stops.length - 1} onClick=${() => swap(1)}>往后一站</button>
        ${plan.days.length > 1 ? plan.days.map((d, j) => (j === dayIndex ? null : html`<button class="btn sm" key=${j} onClick=${() => toDay(j)}>移到 Day ${j + 1}</button>`)) : null}
      </div></div>
    <div><${ConfirmButton} className="sm" label="从这一天移除" armedLabel="确认移除" icon="trash" onConfirm=${remove} /></div>
  <//>`;
}

function TripMenuSheet({ ctx, trip, onClose }) {
  const [manual, setManual] = useState('');
  async function share() {
    const text = tripToText(trip);
    if (await copyText(text)) { ctx.toast('已复制，可以直接发给旅伴'); onClose(); } else setManual(text);
  }
  async function exportMd() {
    const md = tripToMarkdown(trip, ctx.placesById);
    if (!ctx.downloads) return setManual(md);
    try { await ctx.downloads.save({ filename: `${tripTitle(trip)}.md`, data: md }); ctx.toast('已导出'); onClose(); } catch (e) { if (!e || e.code !== 'declined') setManual(md); }
  }
  async function remove() {
    if (await ctx.write('remove', 'trips', trip.id)) {
      for (const e of ctx.expenses.filter(x => x.tripId === trip.id)) await ctx.write('remove', 'expenses', e.id);
      ctx.toast('行程已删除'); onClose(); ctx.nav.back();
    }
  }
  const item = (icon, label, run) => html`<button onClick=${run}><${Icon} name=${icon} />${label}</button>`;
  return html`<${Sheet} title=${tripTitle(trip)} onClose=${onClose}>
    <div class="menu-list">
      ${item('edit', '改名称、日期和预算', () => ctx.openSheet({ type: 'tripEdit', tripId: trip.id }))}
      ${item('sparkle', '用 AI 调整整个行程', () => ctx.openSheet({ type: 'revise', tripId: trip.id, dayIndex: null }))}
      ${item('refresh', '改城市或天数，重新排', () => ctx.openSheet({ type: 'trip', replaceId: trip.id }))}
      ${item('bot', '问 AI 这趟行程', () => { onClose(); ctx.askAssistant(`帮我看看「${tripTitle(trip)}」这趟行程，有什么可以优化的？`, `用户在看行程 ${trip.id}「${tripTitle(trip)}」`); })}
      ${item('copy', '复制文字，发给旅伴', share)}
      ${item('download', '导出 Markdown', exportMd)}
    </div>
    <${ManualCopy} text=${manual} onClose=${() => setManual('')} />
    <div><${ConfirmButton} label="删除这趟行程" armedLabel="确认删除（花费记录也会删掉）" icon="trash" onConfirm=${remove} /></div>
  <//>`;
}

function TripEditSheet({ ctx, trip, onClose }) {
  const [title, setTitle] = useState(tripTitle(trip));
  const [startDate, setStartDate] = useState(trip.startDate || '');
  const [budget, setBudget] = useState(trip.budget ? String(trip.budget) : '');
  async function save() {
    const plan = planOf(trip);
    const patch = { title: str(title, 60) || tripTitle(trip), startDate, budget: num(budget) > 0 ? num(budget) : null, updatedAt: Date.now() };
    if (startDate !== (trip.startDate || '') && plan.days.length) patch.plan = { days: plan.days.map((d, i) => ({ ...d, date: startDate ? addDays(startDate, i) : '' })) };
    if (await ctx.write('update', 'trips', trip.id, patch)) { ctx.toast('已保存'); onClose(); }
  }
  return html`<${Sheet} title="行程信息" onClose=${onClose} footer=${html`<button class="btn" onClick=${onClose}>取消</button><button class="btn green" onClick=${save}>保存</button>`}>
    <div class="field"><label for="te-title">名称</label><input id="te-title" class="input" value=${title} onInput=${e => setTitle(e.target.value)} /></div>
    <div class="grid2">
      <div class="field"><label for="te-date">出发日期</label><input id="te-date" class="input" type="date" value=${startDate} onInput=${e => setStartDate(e.target.value)} /></div>
      <div class="field"><label for="te-budget">预算（${ctx.home}）</label><input id="te-budget" class="input" inputmode="decimal" value=${budget} onInput=${e => setBudget(e.target.value)} /></div>
    </div>
    <p class="hint">改日期只会更新每天的日期，路线不变。想改城市或天数，用菜单里的「改城市或天数，重新排」。</p>

function ExpenseSheet({ ctx, trip, expense, onClose }) {

    if (ok) { ctx.toast(expense ? '已保存' : '记好了'); onClose(); }

  async function remove() { if (await ctx.write('remove', 'expenses', expense.id)) { ctx.toast('已删除'); onClose(); } }
  const person = id => html`<${Avatars} ids=${[id]} ctx=${ctx} max=${1} small />${nameOf(id)}`;
  return html`<${Sheet} title=${expense ? '这笔花费' : '记一笔'} onClose=${onClose} footer=${html`
      ${expense ? html`<${ConfirmButton} className="sm" label="删除" armedLabel="确认删除" icon="trash" onConfirm=${remove} /><span style=${{ flex: 1 }}></span>` : null}
      <button class="btn" onClick=${onClose}>取消</button><button class="btn green" disabled=${!(amt > 0)} onClick=${save}>保存</button>`}>
    <div class="money-input">
      <select class="input" aria-label="货币" value=${currency} onChange=${e => setCurrency(e.target.value)}>${curs.map(c => html`<option value=${c}>${c}</option>`)}</select>
      <input id="ex-amount" class="input" inputmode="decimal" aria-label="金额" value=${amount} onInput=${e => setAmount(e.target.value)} placeholder="0" />
    </div>
    <p class="hint num">${amt ? (currency === ctx.home ? '　' : inHome != null ? `≈ ${fmtMoney(inHome, ctx.home, true)}` : `没有 ${currency} 的汇率，暂时换算不了`) : '　'}</p>
    <div class="field"><span class="label">类别</span><div class="chips wrap">${EXPENSE_CATS.map(([k, v]) => html`<button class="chip" aria-pressed=${category === k} onClick=${() => setCategory(k)}>${v}</button>`)}</div></div>
    ${shared ? html`<div class="field"><span class="label">谁付的</span><div class="chips wrap">${members.map(id => html`<button key=${id} class="chip person" aria-pressed=${paidBy === id} onClick=${() => setPaidBy(id)}>${person(id)}</button>`)}</div></div>
      <div class="field"><span class="label">谁分摊（平均分）</span><div class="chips wrap">${members.map(id => html`<button key=${id} class="chip person" aria-pressed=${split.has(id)} onClick=${() => toggleSplit(id)}>${person(id)}</button>`)}</div></div>` : null}

function inlineMd(s) {
  return s.split(/(\*\*[^*]+\*\*)/g).map((x, i) => (/^\*\*[^*]+\*\*$/.test(x) ? html`<b key=${i}>${x.slice(2, -2)}</b>` : x));
}
/** Paragraphs, bullet lists and **bold** from Claude's reply, built as nodes (never as HTML). */
function RichText({ text }) {
  const blocks = [];
  let list = null;
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trim();
    const m = /^(?:[-•*]|\d+[.、)])\s*(.+)$/.exec(line);
    if (m && line.length > 2) { if (!list) { list = []; blocks.push(list); } list.push(m[1]); continue; }
    list = null;
    if (line) blocks.push(line.replace(/^#+\s*/, ''));
  }
  return blocks.map((b, i) => (Array.isArray(b) ? html`<ul key=${i}>${b.map((x, j) => html`<li key=${j}>${inlineMd(x)}</li>`)}</ul>` : html`<p key=${i}>${inlineMd(b)}</p>`));
}
function mentionedPlaces(text, places) {
  const t = String(text || '');
  return places.filter(p => p.name && p.name.length >= 2 && t.includes(p.name))
    .sort((a, b) => (b.coverAssetId ? 1 : 0) - (a.coverAssetId ? 1 : 0)).slice(0, 4);
}

function describeChange(p, f) {
  const parts = [];

  if (f.country != null && f.country !== p.country) step('国家', p.country, f.country);
  if (f.region != null && f.region !== (p.region || '')) step(getRegionLabel(f.regionType || p.regionType), p.region, f.region);
  if (f.city != null && f.city !== p.city) step('城市', p.city, f.city);
  if (f.area != null && f.area !== p.area) step('区域', p.area, f.area);
  if (f.category && f.category !== p.category) step('分类', CAT_LABEL[p.category] || '', CAT_LABEL[f.category]);
  if (f.lat != null && !hasCoord(p)) parts.push('补上大概坐标');

const ORG_KEY = 'lvyong.organize.v1';
function loadOrganize() {
  try { return JSON.parse(localStorage.getItem(ORG_KEY) || 'null'); } catch { return null; }
}
function saveOrganize(v) {
  try { if (v) localStorage.setItem(ORG_KEY, JSON.stringify(v)); else localStorage.removeItem(ORG_KEY); } catch { /* storage blocked: the result lives until the sheet closes */ }
}
/**
 * Ask Claude to check the library, in batches that keep each city together, and return one checked proposal plus the
 * duplicates and day groups the app finds by itself. Never writes: OrganizeSheet applies only what the user confirms.
 */
async function organizeLibrary(ctx, { onProgress, signal } = {}) {
  const places = ctx.places;
  const local = findDuplicatePlaces(places);
  const chunks = chunkPlacesForAi(places, 60);
  let out = emptyOrganization(), scanned = 0, batch = 0;
  const tell = text => onProgress && onProgress({ batch, batches: chunks.length, scanned, total: places.length, text, partial: out });
  for (const chunk of chunks) {
    batch++;
    const ids = new Set(chunk.map(p => p.id));
    const prompt = buildOrganizationPrompt({ places: chunk, knownCities: ctx.cities, lang: ctx.prefs.aiLang, localDuplicates: local.filter(d => ids.has(d.a) && ids.has(d.b)) });
    const raw = await ctx.ai.json(prompt, { tier: 'default', signal, cache: false, onText: tell });
    out = mergeOrganization(out, normalizeOrganization(raw, ctx.placesById, ctx.cities));
    scanned += chunk.length;
    tell('');
  }
  for (const d of local) if (!out.duplicates.some(x => (x.a === d.a && x.b === d.b) || (x.a === d.b && x.b === d.a))) out.duplicates.push(d);
  if (!out.nearbyGroups.length) out.nearbyGroups = findNearbyPlaces(places).slice(0, 6);
  return out;
}
function OrganizeSheet({ ctx, initial, onClose }) {

  const [stale, setStale] = useState(() => !!cached && cached.sig !== sig);
  const [decisions, setDecisions] = useState({ skip: {}, accept: {}, pick: {} });
  const [prog, setProg] = useState(null);
  const [saving, setSaving] = useState(false);

    const out = await job.run((onText, signal) => organizeLibrary(ctx, { signal, onProgress: x => { setProg(x); if (x.text) onText(x.text); } }));
    if (out) { setProposal(out); setStale(false); setDecisions({ skip: {}, accept: {}, pick: {} }); saveOrganize({ sig, at: Date.now(), proposal: out }); }
  }
