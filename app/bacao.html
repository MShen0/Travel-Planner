<!--
THESIS: A trip planner that feels like the feed it came from: saved posts become photo cards, cards become a day you can walk. Refuses the empty-form dashboard.
OWN-WORLD: warm paper #F6F5F1, white rounded cards, forest green #1F5C45 for every action, Liquid Glass controls (clear and green-tinted, user brief 2026-10-07), pastel category pills, photo-led cards and pins, one recoloured city basemap.
STORY: paste a post, see it saved as a photo card, pick cities and days, follow a photo timeline with a transit line and map handoff per leg, settle costs in RM with companions.
FIRST VIEWPORT: full-bleed trip photo with 下一站去哪儿？ in white; paste card overlapping its foot; trip card with four stats; green AI action at thumb height; tab bar.
FORM: user-pinned reference mockup (canon), seed 149fd3fa. Raises: 收藏→想去→去过 stage scale (botanical folio), pin size by priority (star atlas), AI-changed rows stay lit (gate board), dense day rows (JP high-density), numbered station order (transit diagram).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

  -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent), linear-gradient(180deg, transparent, #000 5%, #000 95%, transparent); -webkit-mask-composite: source-in;
  mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent), linear-gradient(180deg, transparent, #000 5%, #000 95%, transparent); mask-composite: intersect; }

.tl { list-style: none; margin: 0; padding: 0; position: relative; }

const SHARE_BOILERPLATE = ['复制本条信息，打开【小红书】App查看精彩内容！', '复制打开抖音，看看', '发布了一篇小红书笔记，快来看吧！'];

function extractUrls(text) {
  const out = [];
  for (const m of String(text || '').matchAll(URL_RE)) {
    const u = m[0].replace(TRAILING_JUNK, '');
    if (u && !out.includes(u)) out.push(u);
  }
  return out;
}
function hostOf(u) {
  try { return new URL(u).host.toLowerCase(); } catch { return ''; }
}
function detectPlatform(s) {
  const t = String(s || '').toLowerCase();
  const target = /^https?:\/\//.test(t) ? hostOf(t) : t;
  const rules = [
    ['xiaohongshu', ['xiaohongshu.com', 'xhslink.com', 'xhs.cn', '小红书']],
    ['instagram', ['instagram.com', 'instagr.am']],
    ['tiktok', ['tiktok.com']],
    ['douyin', ['douyin.com', 'iesdouyin.com', '抖音']],
    ['youtube', ['youtube.com', 'youtu.be']],
    ['bilibili', ['bilibili.com', 'b23.tv', '哔哩哔哩']],

  for (const [name, needles] of rules) if (needles.some(n => target.includes(n))) return name;
  return 'web';
}
function pickUrl(text) {
  const urls = extractUrls(text);
  return urls.find(u => detectPlatform(u) !== 'web') || urls[0] || null;
}
function shareTitle(text) {
  const t = String(text || '').trim();
  if (!t) return '';
  for (const m of t.matchAll(/【([^【】]{2,200})】/g)) {
    let inner = m[1].trim();
    if (inner === '小红书' || inner.endsWith('的作品')) continue;
    inner = inner.split(/\s*\|\s*小红书/)[0].replace(/\s+-\s+[^-]{1,40}$/, '').trim();
    if (inner) return inner;
  }
  let m = /【[^【】]*的作品】\s*([\s\S]+?)\s*https?:\/\//.exec(t);
  if (m) return m[1].replace(/\s+/g, ' ').trim();
  m = /《([^《》]{2,200})》/.exec(t);
  if (m) return m[1].trim();
  if (t.includes('发布了一篇小红书笔记')) return '';
  return contentText(t).slice(0, 200);
}
/** The words in a paste once links and app boilerplate are gone. */
function contentText(text) {
  let s = String(text || '').replace(URL_RE, ' ');
  for (const junk of SHARE_BOILERPLATE) s = s.split(junk).join(' ');
  return s.replace(/😆\s*\w{6,20}\s*😆/gu, ' ').replace(/[😆\s]+/gu, ' ').trim().replace(/^[-|\s]+|[-|\s]+$/g, '');
}

/** "RM 61.04", "¥2,360"; approx (for converted amounts) rounds to whole units from 10 up. */
function fmtMoney(amount, cur, approx = false) {

  const info = CURRENCIES[cur] || { sym: cur ? cur + ' ' : '', dec: 0 };
  const v = approx && Math.abs(amount) >= 10 ? Math.round(amount) : amount;
  const dec = approx && Math.abs(v) >= 100 ? 0 : info.dec;
  const whole = Math.abs(v - Math.round(v)) < 1e-9;
  const s = Number(v).toLocaleString('en-US', { minimumFractionDigits: whole ? 0 : dec, maximumFractionDigits: dec });

/** Convert to the home currency with an fx doc {base, rates: {CUR: units per 1 base}, manual?}; null when no rate is known. */
function toHome(amount, cur, fx, home = 'MYR') {
  if (amount == null || !Number.isFinite(amount) || !cur) return null;
  if (cur === home) return amount;
  if (!fx || !fx.rates) return null;
  const rate = c => (fx.manual && num(fx.manual[c])) || (c === fx.base ? 1 : num(fx.rates[c]));
  const rc = rate(cur), rh = rate(home);
  if (!rc || !rh) return null;
  return (amount / rc) * rh;
}
function normPrice(p) {
  if (!p || typeof p !== 'object') return null;
  const amount = num(p.amount);
  if (amount == null || amount <= 0) return null;
  const currency = /^[A-Z]{3}$/.test(String(p.currency || '')) ? p.currency : '';
  const max = num(p.max);
  return { amount, max: max && max > amount ? max : null, currency, per: str(p.per, 10) };
}

/* --- places --- */
function normKey(s) {

}

  return (places || []).find(q => sameCity(p.city, q.city) && [normKey(q.name), normKey(q.nameLocal)].some(n => n && names.includes(n))) || null;

/* --- geography --- */
function haversineKm(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}
function centroid(points) {
  const n = points.length || 1;
  return { lat: points.reduce((s, p) => s + p.lat, 0) / n, lng: points.reduce((s, p) => s + p.lng, 0) / n };
}
function routeKm(points, start) {

  for (const p of points) { if (prev && hasCoord(p)) km += haversineKm(prev, p); if (hasCoord(p)) prev = p; }
  return km;
}
/** Nearest-neighbour tour from `start`, then 2-opt until no swap shortens it. */
function orderRoute(points, start) {
  const pts = points.filter(hasCoord);
  if (pts.length < 3 && !hasCoord(start)) return pts;
  const rest = pts.slice(), tour = [];
  let cur = hasCoord(start) ? start : rest.shift();
  if (!hasCoord(start)) tour.push(cur);
  while (rest.length) {
    let bi = 0, bd = Infinity;
    rest.forEach((p, i) => { const d = haversineKm(cur, p); if (d < bd) { bd = d; bi = i; } });
    cur = rest.splice(bi, 1)[0];
    tour.push(cur);
  }
  const head = hasCoord(start) ? [start] : [];
  let improved = true, guard = 0;
  while (improved && guard++ < 50) {
    improved = false;
    for (let i = 0; i < tour.length - 1; i++) {
      for (let j = i + 1; j < tour.length; j++) {
        const cand = tour.slice(0, i).concat(tour.slice(i, j + 1).reverse(), tour.slice(j + 1));
        if (routeKm(head.concat(cand)) + 1e-9 < routeKm(head.concat(tour))) { tour.splice(0, tour.length, ...cand); improved = true; }
      }
    }
  }

/** Split places into `days` geographic groups of similar size (capacity-limited k-means). */
function clusterIntoDays(places, days, base) {

  if (!pts.length) return { groups, noCoord };
  const seeds = [];
  const first = hasCoord(base) ? pts.reduce((m, p) => (haversineKm(p, base) > haversineKm(m, base) ? p : m), pts[0]) : pts[0];
  seeds.push({ lat: first.lat, lng: first.lng });

    let best = null, bestD = -1;
    for (const p of pts) { const d = Math.min(...seeds.map(s => haversineKm(p, s))); if (d > bestD) { bestD = d; best = p; } }
    seeds.push({ lat: best.lat, lng: best.lng });

    pts.forEach((p, i) => centers.forEach((c, j) => pairs.push([haversineKm(p, c), i, j])));

/** Fit points into a width × height drawing (equirectangular); used when a city has no basemap yet. */
function makeProjection(points, width, height, pad) {

  let minLng = Math.min(...pts.map(p => p.lng)), maxLng = Math.max(...pts.map(p => p.lng));

  if (maxLat - minLat < minSpan) { const c = (maxLat + minLat) / 2; minLat = c - minSpan / 2; maxLat = c + minSpan / 2; }

  return { project: p => [offX + (p.lng - minLng) * kx * s, offY + (maxLat - p.lat) * s], kmPerPx: 111.32 / s };

/* --- trips: cities, days, progress, costs --- */
function tripCities(trip) {
  const list = Array.isArray(trip && trip.stays) && trip.stays.length ? trip.stays.map(s => s.city)

  return [...new Set(list.filter(Boolean))];
}
/** Split `total` days over cities in order: everyone gets one, the rest follows the number of saved places. */
function allocateDays(counts, total) {
  const n = counts.length;
  if (!n) return [];
  if (total <= n) return counts.map((c, i) => ({ city: c.city, days: i < total ? 1 : 0 })).filter(c => c.days);
  const out = counts.map(c => ({ city: c.city, days: 1 }));
  let left = total - n;
  const weight = counts.reduce((s, c) => s + Math.max(1, c.n || 0), 0);
  const shares = counts.map(c => (left * Math.max(1, c.n || 0)) / weight);
  shares.forEach((s, i) => { out[i].days += Math.floor(s); });
  left -= shares.reduce((s, x) => s + Math.floor(x), 0);
  shares.map((s, i) => [s - Math.floor(s), i]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, i]) => { out[i].days += 1; });
  return out;
}

  if (Array.isArray(trip.stays) && trip.stays.length) return trip.stays;
  const cities = tripCities(trip);
  const base = (trip.plan && trip.plan.base) || trip.base || null;
  if (cities.length <= 1) return [{ city: cities[0] || '', days: trip.days || 1, base }];
  return allocateDays(cities.map(c => ({ city: c, n: 1 })), trip.days || cities.length).map((s, i) => ({ ...s, base: i === 0 ? base : null }));
}

  for (const s of stays) for (let i = 0; i < (s.days || 0); i++) out.push(s.city);

 * for a day trip without a hotel, the previous city's base.

  const city = cityOf(dayIndex);
  if (dayIndex > 0 && cityOf(dayIndex - 1) && !sameCity(cityOf(dayIndex - 1), city)) return baseForDay(trip, dayIndex - 1);
  const bases = Array.isArray(plan.bases) ? plan.bases : (plan.base ? [{ ...plan.base, city: tripCities(trip)[0] }] : []);

function useMedia(maxCount, toast) {
  const [media, setMedia] = useState([]);
  const [busy, setBusy] = useState(false);
  const live = useRef(media);
  live.current = media;
  useEffect(() => () => live.current.forEach(m => URL.revokeObjectURL(m.url)), []);
  async function add(files) {
    files = [...(files || [])];
    if (!files.length || !maxCount) return;
    setBusy(true);
    try {
      let left = maxCount - live.current.length;
      const added = [];
      for (const f of files) {
        if (left <= 0) { toast(`最多 ${maxCount} 张图`); break; }
        if ((f.type || '').startsWith('video/')) {
          const frames = await videoFrames(f, Math.min(left, 8));
          if (!frames.length) { toast('这个视频读不出画面，换成截图试试'); continue; }
          for (const fr of frames) added.push({ id: uid('m'), blob: fr.blob, url: URL.createObjectURL(fr.blob), label: `${Math.round(fr.t)}s` });
          left -= frames.length;
        } else if ((f.type || '').startsWith('image/') || /\.(heic|heif|jpe?g|png|webp|gif)$/i.test(f.name || '')) {
          const blob = await shrinkImage(f, 1600, 0.85);
          added.push({ id: uid('m'), blob, url: URL.createObjectURL(blob), label: '' });
          left -= 1;
        }
      }
      if (added.length) setMedia(m => [...m, ...added]);
    } catch (e) {
      toast('图片或视频处理失败，换一个文件试试');
    } finally {
      setBusy(false);
    }
  }
  const remove = id => setMedia(m => { const x = m.find(i => i.id === id); if (x) URL.revokeObjectURL(x.url); return m.filter(i => i.id !== id); });
  const onPaste = e => {
    const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => (f.type || '').startsWith('image/'));
    if (files.length && maxCount) { e.preventDefault(); add(files); }
  };
  return { media, busy, add, remove, onPaste, maxCount };
}
function MediaPicker({ m, aiOk }) {
  const [over, setOver] = useState(false);
  const imgRef = useRef(null), vidRef = useRef(null);
  if (!m.maxCount) return aiOk ? html`<p class="hint">当前环境不能把图片发给 Claude，只能识别文字。</p>` : null;
  const room = Math.max(0, m.maxCount - m.media.length);
  return html`<div class=${'dropzone' + (over ? ' over' : '')}
      onDragOver=${e => { e.preventDefault(); setOver(true); }} onDragLeave=${() => setOver(false)}
      onDrop=${e => { e.preventDefault(); setOver(false); m.add(e.dataTransfer.files); }}>
    <div class="row wrap">
      <button class="btn sm" disabled=${m.busy || !room} onClick=${() => imgRef.current.click()}><${Icon} name="image" size=${16} />加截图</button>
      <button class="btn sm" disabled=${m.busy || !room} onClick=${() => vidRef.current.click()}><${Icon} name="video" size=${16} />加视频（自动截帧）</button>
      <span class="hint num">${m.busy ? '处理中…' : `${m.media.length}/${m.maxCount}`}</span>
    </div>
    <input ref=${imgRef} id="pick-images" class="sr" type="file" accept="image/*" multiple onChange=${e => { m.add(e.target.files); e.target.value = ''; }} />
    <input ref=${vidRef} id="pick-video" class="sr" type="file" accept="video/*" onChange=${e => { m.add(e.target.files); e.target.value = ''; }} />
    ${m.media.length ? html`<div class="media">${m.media.map(x => html`<figure key=${x.id}><img src=${x.url} alt="" />${x.label ? html`<figcaption>${x.label}</figcaption>` : null}<button aria-label="移除这张" onClick=${() => m.remove(x.id)}><${Icon} name="x" size=${14} /></button></figure>`)}</div>`
      : html`<p class="hint">小红书攻略的店名常写在图里：截几张图加进来，识别会准很多。也可以把截图直接粘贴到上面的输入框。</p>`}
  </div>`;
}

/* --- small shared components --- */
function useWide(px = 1024) {
  const q = () => typeof window !== 'undefined' && window.innerWidth >= px;
  const [wide, setWide] = useState(q);
  useEffect(() => {
    const on = () => setWide(q());
    window.addEventListener('resize', on);
    return () => window.removeEventListener('resize', on);
  }, []);
  return wide;
}

function Sheet({ title, onClose, children, footer, wide }) {
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.classList.add('locked');
    ref.current && ref.current.focus({ preventScroll: true });
    return () => { document.removeEventListener('keydown', onKey); document.body.classList.remove('locked'); prev && prev.focus && prev.focus({ preventScroll: true }); };
  }, []);
  return html`<div class="backdrop" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <section class=${'sheet' + (wide ? ' wide' : '')} role="dialog" aria-modal="true" aria-label=${title} tabindex="-1" ref=${ref}>
      <div class="grab" aria-hidden="true"></div>
      <header class="sheet-head"><h2>${title}</h2><button class="icon-btn" aria-label="关闭" onClick=${onClose}><${Icon} name="x" /></button></header>
      <div class="sheet-body">${children}</div>
      ${footer ? html`<footer class="sheet-foot">${footer}</footer>` : null}
    </section>
  </div>`;
}
function ConfirmButton({ label, armedLabel, onConfirm, className = '', icon }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 3500); return () => clearTimeout(t); }, [armed]);
  return html`<button class=${`btn danger ${className}${armed ? ' armed' : ''}`} onClick=${() => (armed ? (setArmed(false), onConfirm()) : setArmed(true))}>
    ${icon ? html`<${Icon} name=${icon} size=${16} />` : null}${armed ? armedLabel || '再点一次确认' : label}
  </button>`;
}
function ExtLink({ href, children, className = 'btn sm' }) {
  if (!href) return null;
  return html`<a class=${className} href=${href} target="_blank" rel="noopener noreferrer">${children}</a>`;
}
function AiProgress({ label, text, started, onStop, counter }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const secs = Math.max(0, Math.round((now - started) / 1000));
  const count = counter && text ? counter(text) : null;
  return html`<div class="progress" role="status" aria-live="polite">
    <div class="row" style=${{ justifyContent: 'space-between' }}>
      <strong>${text ? (count != null ? `${label}… ${count}` : `${label}…`) : 'Claude 正在思考…'}</strong>
      <span class="muted num" style=${{ fontSize: '13px' }}>${secs}s</span>
    </div>
    <div class="track"></div>
    ${text ? html`<div class="peek">${text.slice(-240)}</div>` : html`<p class="hint">看图和排路线一般要 20–90 秒。第一次用时 claude.ai 会先问你是否允许。</p>`}
    <div class="row" style=${{ justifyContent: 'flex-end' }}><button class="btn sm" onClick=${onStop}><${Icon} name="stop" size=${14} />停止</button></div>
  </div>`;
}
/** Copy inside a click handler; resolves false when the viewer's browser refuses. */
function copyText(text) {
  try { return navigator.clipboard.writeText(text).then(() => true, () => false); } catch { return Promise.resolve(false); }
}
function ManualCopy({ text, onClose }) {
  if (!text) return null;
  return html`<div class="stack" style=${{ gap: '6px' }}>
    <div class="row" style=${{ justifyContent: 'space-between' }}><span class="hint">这里不能自动复制：长按或全选下面的文字复制。</span><button class="btn ghost sm" onClick=${onClose}>收起</button></div>
    <textarea class="input" rows="6" readonly value=${text} onFocus=${e => e.target.select()}></textarea>
  </div>`;
}
function Ring({ pct, size = 116 }) {
  const r = 46, c = 2 * Math.PI * r;
  return html`<div class="ring" style=${{ width: size + 'px', height: size + 'px' }}>
    <svg width=${size} height=${size} viewBox="0 0 108 108" aria-hidden="true">
      <circle cx="54" cy="54" r=${r} fill="none" stroke="var(--fill)" stroke-width="10" />
      <circle cx="54" cy="54" r=${r} fill="none" stroke="var(--green)" stroke-width="10" stroke-linecap="round" stroke-dasharray=${c} stroke-dashoffset=${c * (1 - Math.min(100, pct) / 100)} />
    </svg>
    <div class="lbl"><b>${pct}%</b><small>已安排</small></div>
  </div>`;
}
function Avatars({ ids, ctx, max = 4, small }) {
  const shown = [...new Set((ids || []).filter(Boolean))].slice(0, max);
  const people = useProfiles(shown, ctx);
  if (!shown.length) return null;
  return html`<span class=${'avatars' + (small ? ' sm' : '')}>${shown.map(id => {
    const p = people[id];
    return p && p.avatarUrl
      ? html`<img class="avatar" key=${id} src=${p.avatarUrl} alt=${p.name || '旅伴'} title=${p.name || '旅伴'} />`
      : html`<span class="avatar" key=${id} style=${{ background: (p && p.color) || 'var(--fill-2)' }} aria-hidden="true"></span>`;
  })}</span>`;
}
/** Resolve people ids to names/avatars through the user capability (batched and cached by the platform). */
function useProfiles(ids, ctx) {
  const key = [...new Set((ids || []).filter(Boolean))].sort().join(',');
  const [people, setPeople] = useState({});
  useEffect(() => {
    let alive = true;
    if (!key || !ctx.user || !ctx.user.profiles) return;
    ctx.user.profiles(key.split(',')).then(p => alive && setPeople(p || {})).catch(() => {});
    return () => { alive = false; };
  }, [key, ctx.user]);
  return people;
}

function latestTrip(trips) {
  return trips.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0] || null;
}
function heroFor(trip, places, byId) {
  const pick = p => p && p.coverAssetId ? p : null;
  if (trip) {
    if (trip.coverAssetId) return { id: trip.coverAssetId, credit: trip.coverCredit };
    for (const d of (trip.plan && trip.plan.days) || []) for (const s of d.stops) { const p = pick(byId[s.placeId]); if (p) return { id: p.coverAssetId, credit: p.coverCredit, name: p.name }; }
    const inCity = tripPlaces(trip, places).find(p => p.coverAssetId);
    if (inCity) return { id: inCity.coverAssetId, credit: inCity.coverCredit, name: inCity.name };
  }
  const any = places.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).find(p => p.coverAssetId);
  return any ? { id: any.coverAssetId, credit: any.coverCredit, name: any.name } : null;
}

function HeartButton({ p, ctx, className = 'heart' }) {
  const [pop, setPop] = useState(false);
  const on = p.status === 'want';
  const toggle = e => {
    e.stopPropagation();
    if (p.status === 'visited') return ctx.toast('这里已经去过了');
    setPop(true); setTimeout(() => setPop(false), 650);
    ctx.write('update', 'places', p.id, { status: on ? 'saved' : 'want', updatedAt: Date.now() });
  };
  return html`<button class=${className + (on ? ' on' : '') + (pop ? ' pluck' : '')} aria-pressed=${on} aria-label=${on ? '取消想去' : '标记想去'} onClick=${toggle}>
    <${Icon} name=${on ? 'heartFill' : 'heart'} size=${21} /></button>`;

function sourceBits(p) {
  const s = p.source || {};

  if (s.platform && s.platform !== 'manual') bits.push(PLATFORMS[s.platform] || '网页');
  if (s.stats && (s.stats.likes || s.stats.collects)) bits.push(`原帖 ${s.stats.collects || s.stats.likes} 人收藏`);
  return bits.join(' · ');
}

    const pts = points.concat(base && hasCoord(base) ? [base] : []);

    const tx = W >= vp.w ? Math.min(0, Math.max(vp.w - W, n.tx)) : (vp.w - W) / 2;
    const ty = H >= room ? Math.min(padTop, Math.max(vp.h - padBottom - H, n.ty)) : padTop + (room - H) / 2;

  const items = ready ? points.filter(hasCoord).map(p => { const [x, y] = toScreen(p); return { ...p, x, y }; }) : [];
  const clusters = numbered ? items.map(it => ({ x: it.x, y: it.y, items: [it] })) : clusterScreen(items, 46);
  const rank = p => (p.status === 'want' ? 0 : p.status === 'visited' ? 2 : 1);
  const size = p => (p.status === 'want' ? 56 : p.status === 'visited' ? 34 : 42);
  const routeXY = ready && route ? route.filter(hasCoord).map(toScreen) : [];
  const baseXY = ready && base && hasCoord(base) ? toScreen(base) : null;
  return html`<div ref=${wrap} class=${'mapwrap' + (full ? ' full' : '')} style=${full ? null : { height: height + 'px' }}
      onPointerDown=${onDown} onPointerMove=${onMove} onPointerUp=${onUp} onPointerCancel=${onUp}
      onDblClick=${e => { const r = wrap.current.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top, true); }}>
    ${ready ? html`<div class=${'map-world' + (basemap ? '' : ' synthetic') + (anim ? ' animate' : '')}
        style=${{ width: world.w + 'px', height: world.h + 'px', transform: `translate(${t.tx}px, ${t.ty}px) scale(${t.s})` }}>
        ${basemap ? html`<picture><source media="(prefers-color-scheme: dark)" srcset=${'/_blob/' + (basemap.darkAssetId || basemap.assetId)} /><img src=${'/_blob/' + basemap.assetId} alt="" /></picture>` : null}
      </div>` : null}

      ${placeLabels(labels.map(l => { const [x, y] = toScreen(l); return { ...l, x, y }; }), clusters).map(l => html`<span class="area-label" key=${l.text} style=${{ left: l.x + 'px', top: l.y + 'px' }}>${l.text}</span>`)}

        <polyline points=${(baseXY ? [baseXY] : []).concat(routeXY).map(p => p.join(',')).join(' ')} style=${{ fill: 'none', stroke: '#fff', strokeWidth: 7, strokeLinecap: 'round', strokeLinejoin: 'round', opacity: 0.9 }} />
        <polyline points=${(baseXY ? [baseXY] : []).concat(routeXY).map(p => p.join(',')).join(' ')} style=${{ fill: 'none', stroke: 'var(--green)', strokeWidth: 3.5, strokeLinecap: 'round', strokeLinejoin: 'round' }} />

            aria-label=${c.items.length > 1 ? `${c.items.length} 个地点：${c.items.map(i => i.name).join('、')}` : lead.name}

          <span class="ph"><${Photo} id=${lead.photo} cat=${lead.category} /></span><span class="tail"></span>

      <button class="icon-btn" aria-label="放大" onClick=${() => zoomAt(1.6, vp.w / 2, vp.h / 2, true)}><${Icon} name="plus" /></button>

/** Keep a neighbourhood label only where it clears every pin and every other label (labels sit just below their point). */
function placeLabels(labels, pins) {
  const out = [];
  for (const l of labels.slice().sort((a, b) => b.n - a.n)) {
    const w = l.text.length * 13 + 10, top = l.y + 8, bottom = top + 18;
    const hitsPin = pins.some(c => Math.abs(c.x - l.x) < w / 2 + 26 && c.y - 60 < bottom && c.y + 2 > top);
    const hitsLabel = out.some(o => Math.abs(o.x - l.x) < (w + o.w) / 2 + 4 && Math.abs(o.top - top) < 20);
    if (!hitsPin && !hitsLabel) out.push({ ...l, y: top, top, w });
  }
  return out;
}

/** Run one Claude call with progress, stop and a readable error; resolves undefined when it fails. */
function useAiJob(ctx) {
  const [st, setSt] = useState({ phase: 'idle', stream: '', started: 0, error: '' });
  const ctl = useRef(null);
  useEffect(() => () => ctl.current && ctl.current.abort(), []);
  async function run(fn) {
    ctl.current = new AbortController();
    setSt({ phase: 'working', stream: '', started: Date.now(), error: '' });
    try {
      const out = await fn(text => setSt(s => ({ ...s, stream: text })), ctl.current.signal);
      setSt(s => ({ ...s, phase: 'idle' }));
      return out;
    } catch (e) {
      const code = e && e.code;
      setSt({ phase: 'idle', stream: '', started: 0, error: code === 'cancelled' ? '' : aiErrorText(e) });
      if (PERMANENT_AI_ERRORS.has(code)) ctx.onAiBlocked(code);
      return undefined;
    }
  }
  return { ...st, run, stop: () => ctl.current && ctl.current.abort() };
}
function Notice({ children, warn, icon = 'info', role }) {
  return html`<div class=${'notice' + (warn ? ' warn' : '')} role=${role || null}><${Icon} name=${icon} /><div class="grow">${children}</div></div>`;
}
const planOf = trip => ({ days: [], tips: [], unplaced: [], bases: [], ...(trip.plan || {}) });
function tripDates(trip) {
  return trip.startDate ? `${fmtCnDate(trip.startDate)} — ${fmtCnDate(addDays(trip.startDate, trip.days - 1))}` : `${trip.days} 天 · 日期未定`;
}
function tripStopCount(trip) {
  return planOf(trip).days.reduce((n, d) => n + (d.stops || []).length, 0);
}
function tripPhotos(trip, byId, places, n = 3) {
  const out = [];
  const add = p => { if (p && p.coverAssetId && out.length < n && !out.some(x => x.id === p.coverAssetId)) out.push({ id: p.coverAssetId, cat: p.category }); };
  for (const d of planOf(trip).days) for (const s of d.stops || []) add(byId[s.placeId]);
  for (const p of tripPlaces(trip, places)) add(p);
  return out;
}
function pendingPlaces(trip, places) {
  const sched = scheduledIds(trip);
  const why = Object.fromEntries(planOf(trip).unplaced.map(u => [u.placeId, u.reason]));
  return tripPlaces(trip, places).filter(p => p.status !== 'visited' && !sched.has(p.id)).map(p => ({ p, reason: why[p.id] || '' }));
}
/** trip.changed holds "day:stop" keys of rows an AI revision touched; they stay lit until someone taps 知道了. */
function changedStops(trip, dayIndex) {
  return new Set((trip.changed || []).filter(k => k.startsWith(dayIndex + ':')).map(k => +k.split(':')[1]));
}
/** Latin names get spaces inside Chinese text; Chinese names don't. */
function spaced(name) {
  const s = String(name || '');
  return `${/^[A-Za-z0-9]/.test(s) ? ' ' : ''}${s}${/[A-Za-z0-9]$/.test(s) ? ' ' : ''}`;
}
function changedKeys(diff) {
  return Object.entries(diff).flatMap(([d, list]) => list.map(s => `${d}:${s}`));
}
function dayRoutePoints(trip, day, base) {
  return [...(base && base.name ? [{ ...base, city: day.city, country: trip.country }] : []),
    ...(day.stops || []).map(s => ({ ...s, city: s.city || day.city, country: s.country || trip.country }))];
}
function dayMoveMin(day) {
  return (day.stops || []).reduce((n, s) => n + ((s.travel && s.travel.minutes) || 0), 0);
}
async function addPlacesToTrip(ctx, trip, ids) {
  const plan = planOf(trip);
  const sched = scheduledIds(trip);
  const unplaced = plan.unplaced.slice();
  const fresh = ids.filter(id => !sched.has(id) && !unplaced.some(u => u.placeId === id));
  for (const id of fresh) unplaced.push({ placeId: id, reason: '新加入，待安排' });
  const ok = await ctx.write('update', 'trips', trip.id, {
    placeIds: [...new Set([...(trip.placeIds || []), ...ids])], skipped: (trip.skipped || []).filter(id => !ids.includes(id)),
    plan: { unplaced }, updatedAt: Date.now(),
  });
  return ok ? { added: fresh.length, already: ids.length - fresh.length } : null;
}

  const hasBase = !!(base && base.name);

  const pos = k => (total === 1 ? ' only' : k === 0 ? ' first' : k === total - 1 ? ' last' : '');
  const where = s => ({ ...s, city: s.city || day.city, country: s.country || trip.country });
  // A transfer's journey ends at its arrival station when the plan gives one, else at the next stop.
  const arrival = j => {
    const t = stops[j];
    if (hasCoord(t)) return { name: t.nameLocal || String(t.name).split('→').pop().trim(), lat: t.lat, lng: t.lng, city: t.city || day.city, country: t.country || trip.country };
    const next = stops.slice(j + 1).find(x => x.kind !== 'transfer');
    return next ? where(next) : null;
  };
  const startPt = hasBase ? { ...base, city: base.city || day.city, country: trip.country } : null;
  if (hasBase) {
    const t0 = stops[0] && stops[0].travel;
    rows.push(html`<li key="base" class=${'tl-row' + pos(0)}>
      <time></time><span class="rail"><span class="dot base"></span></span>
      <div class="photo stay-ph"><${Icon} name="stay" size=${24} /></div>
      <div class="info"><b>酒店出发</b><small>从${spaced(base.name)}出发${t0 && t0.minutes ? ` · 约 ${fmtMin(t0.minutes)}` : ''}</small></div><span></span>
    </li>`);
  }
  stops.forEach((s, j) => {
    const before = stops[j - 1];
    const prev = j === 0 ? startPt : before.kind === 'transfer' ? arrival(j - 1) : where(before);
    const row = html`<${StopRow} key=${'s' + j} ctx=${ctx} trip=${trip} s=${s} j=${j} dayIndex=${dayIndex} cls=${pos(j + (hasBase ? 1 : 0))} lit=${changed.has(j)} cur=${cur} />`;
    if (s.kind === 'transfer') {

      if (s.travel) rows.push(html`<${Leg} key=${'l' + j} ctx=${ctx} from=${prev} to=${arrival(j)} travel=${s.travel} cur=${cur} />`);
    } else {
      if (s.travel) rows.push(html`<${Leg} key=${'l' + j} ctx=${ctx} from=${prev} to=${where(s)} travel=${s.travel} cur=${cur} />`);
      rows.push(row);
    }

  return html`<ol class="tl">${rows}</ol>`;
}

function stopPins(trip, dayIdx, ctx, all) {
  const plan = planOf(trip);
  const days = all ? plan.days.map((d, i) => [d, i]) : plan.days[dayIdx] ? [[plan.days[dayIdx], dayIdx]] : [];
  const out = [];
  for (const [d, i] of days) {
    (d.stops || []).forEach((s, j) => {
      if (!hasCoord(s) || s.kind === 'transfer') return;
      const p = s.placeId && ctx.placesById[s.placeId];
      out.push({ id: `${i}_${j}`, name: s.name, lat: s.lat, lng: s.lng, category: s.category, photo: p && p.coverAssetId, status: p ? p.status : 'saved', num: all ? null : j + 1, place: p || null });

  let fit = pins.concat(base ? [base] : []);

}

function ReviseSheet({ ctx, trip, dayIndex, preset, onClose }) {
  const plan = planOf(trip);
  const day = dayIndex != null ? plan.days[dayIndex] : null;
  const [feedback, setFeedback] = useState(preset || '');
  const job = useAiJob(ctx);
  const quick = day ? ['这天轻松一点', '加一个顺路的午餐', '改成打车为主', '早上晚点出发', '多留点时间拍照', '下雨的话怎么改']
    : ['第一天轻松一点', '每天加一个午餐推荐', '改成打车为主', '把购物放到最后一天', '早上晚点出发'];
  async function run() {
    const fb = feedback.trim();
    if (!fb) return;
    const scoped = day ? `只调整 Day ${dayIndex + 1}（${[day.city, day.area, day.theme].filter(Boolean).join(' · ')}），其他天保持不变。${fb}` : fb;
    await job.run(async (onText, signal) => {
      const ids = new Set([...(trip.placeIds || []), ...tripPlaces(trip, ctx.places).map(p => p.id)]);
      const pool = ctx.places.filter(p => ids.has(p.id));
      const prompt = buildRevisePrompt({ trip, places: pool, feedback: scoped, lang: ctx.prefs.aiLang, allowSuggest: !trip.prefs || trip.prefs.suggest !== false });
      const raw = await ctx.ai.json(prompt, { tier: ctx.prefs.deepPlan ? 'complex' : 'default', onText, signal, cache: false });
      const byId = Object.fromEntries(pool.map(p => [p.id, p]));
      const next = normalizePlan(raw, byId, { startDate: trip.startDate, stays: tripStays(trip), placeIds: trip.placeIds || [], city: tripCities(trip)[0], country: trip.country, currency: plan.currency || tripCurrency(trip, ctx.places) });
      if (!next.days.length) throw { code: 'invalid_json' };
      if (!next.title) next.title = plan.title;
      const changed = changedKeys(diffPlan(plan, next));
      const placeIds = [...new Set([...(trip.placeIds || []), ...next.days.flatMap(d => d.stops.map(s => s.placeId).filter(Boolean))])];
      const ok = await ctx.write('update', 'trips', trip.id, { plan: next, placeIds, changed, updatedAt: Date.now(), revisions: (trip.revisions || 0) + 1 });
      if (ok) { ctx.toast(changed.length ? `调整好了，改动的 ${changed.length} 处用黄色标出` : '调整好了'); onClose(); }
    });
  }
  const footer = job.phase === 'working' ? null : html`<button class="btn" onClick=${onClose}>取消</button>
    <button class="btn green" disabled=${!ctx.ai.ok || !feedback.trim()} onClick=${run}><${Icon} name="sparkle" size=${16} />开始调整</button>`;
  return html`<${Sheet} title=${day ? `用 AI 优化 Day ${dayIndex + 1}` : '调整整个行程'} onClose=${onClose} footer=${footer}>
    ${job.phase === 'working' ? html`<${AiProgress} label="正在调整" text=${job.stream} started=${job.started} onStop=${job.stop} counter=${t => `已排 ${(t.match(/"time"\s*:/g) || []).length} 站`} />` : html`
      ${day ? html`<p class="hint">${[day.city, day.area, day.theme].filter(Boolean).join(' · ')}：${(day.stops || []).map(s => s.name).join(' → ')}</p>` : null}
      <div class="chips wrap">${quick.map(q => html`<button class="chip" onClick=${() => setFeedback(f => (f ? f + '；' : '') + q)}>${q}</button>`)}</div>
      <div class="field"><label for="rv-text">想怎么改？</label>
        <textarea id="rv-text" class="input" rows="3" value=${feedback} onInput=${e => setFeedback(e.target.value)} placeholder="例如：太赶了，把博物馆挪到 Day 3；中午想吃当地小吃"></textarea></div>
      <p class="hint">AI 会重新排整份行程，改动的地方会用黄色标出来，看过后点「知道了」。</p>
      ${!ctx.ai.ok ? html`<${Notice} warn>${ctx.ai.reason}<//>` : null}
      ${job.error ? html`<${Notice} warn role="alert">${job.error}<//>` : null}`}
  <//>`;
}

function TripFormSheet({ ctx, initial, onClose }) {
  const { places } = ctx;
  const replacing = initial.replaceId ? ctx.trips.find(t => t.id === initial.replaceId) : null;
  const initIds = initial.placeIds || (replacing && replacing.placeIds) || [];
  const known = c => ctx.cities.find(k => sameCity(k, c)) || str(c, 30);
  const firstCities = () => {
    if (initial.cities && initial.cities.length) return [...new Set(initial.cities.map(known).filter(Boolean))];
    if (replacing) return tripCities(replacing);
    if (initIds.length) return [...new Set(initIds.map(id => (ctx.placesById[id] || {}).city).filter(Boolean))];
    return ctx.cities.slice(0, 1);
  };
  const countIn = c => places.filter(p => sameCity(p.city, c) && p.status !== 'visited').length;
  const allocate = (cs, total) => allocateDays(cs.map(c => ({ city: c, n: countIn(c) })), Math.max(total, cs.length));
  const [stays, setStays] = useState(() => {
    const cs = firstCities();
    if (replacing && !initial.cities) return tripStays(replacing).map(s => ({ city: s.city, days: s.days }));
    return allocate(cs, clampNum(initial.days, 1, 30) || Math.max(cs.length, 3));
  });
  const [hotels, setHotels] = useState(() => {
    const o = {};
    if (replacing) for (const s of tripStays(replacing)) if (s.base && s.base.name) o[s.city] = s.base.name;
    if (initial.bases && typeof initial.bases === 'object') for (const [c, v] of Object.entries(initial.bases)) if (v) o[known(c)] = str(v, 60);
    return o;
  });
  const [startDate, setStartDate] = useState(/^\d{4}-\d{2}-\d{2}$/.test(initial.startDate || '') ? initial.startDate : (replacing && replacing.startDate) || '');
  const [pace, setPace] = useState(PACES[initial.pace] ? initial.pace : (replacing && replacing.prefs && replacing.prefs.pace) || 'normal');
  const [transport, setTransport] = useState(TRANSPORTS[initial.transport] ? initial.transport : (replacing && replacing.prefs && replacing.prefs.transport) || 'transit');
  const [notes, setNotes] = useState(str(initial.notes, 300) || (replacing && replacing.prefs && replacing.prefs.notes) || '');
  const [budget, setBudget] = useState(replacing && replacing.budget ? String(replacing.budget) : '');
  const [suggest, setSuggest] = useState(!replacing || !replacing.prefs || replacing.prefs.suggest !== false);
  const [picked, setPicked] = useState(() => {
    if (replacing) return new Set(initIds.filter(id => !(replacing.skipped || []).includes(id)));
    return new Set([...initIds, ...places.filter(p => p.status !== 'visited' && stays.some(s => sameCity(s.city, p.city))).map(p => p.id)]);
  });
  const [newCity, setNewCity] = useState('');
  const job = useAiJob(ctx);
  const cities = stays.map(s => s.city);
  const total = stays.reduce((n, s) => n + s.days, 0);

  const setCities = cs => {
    setStays(allocate(cs, Math.max(total, cs.length)));
    setPicked(set => {
      const n = new Set([...set].filter(id => { const p = ctx.placesById[id]; return p && (initIds.includes(id) || cs.some(c => sameCity(c, p.city))); }));
      for (const p of places) if (p.status !== 'visited' && cs.some(c => sameCity(c, p.city)) && !cities.some(c => sameCity(c, p.city))) n.add(p.id);
      return n;
    });
  };
  const addCity = c => { c = known(c.trim()); if (c && !cities.some(x => sameCity(x, c))) setCities([...cities, c]); setNewCity(''); };
  const removeCity = c => setCities(cities.filter(x => x !== c));
  const moveCity = (i, d) => { const cs = cities.slice(); [cs[i], cs[i + d]] = [cs[i + d], cs[i]]; setStays(cs.map(c => stays.find(s => s.city === c))); };
  const setTotal = n => setStays(allocate(cities, Math.min(30, Math.max(cities.length || 1, n))));
  const setCityDays = (i, n) => setStays(stays.map((s, j) => (j === i ? { ...s, days: Math.min(20, Math.max(1, n)) } : s)));
  const toggle = id => setPicked(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const chosen = places.filter(p => picked.has(p.id));
  const others = ctx.cities.filter(c => !cities.some(x => sameCity(x, c)));
  const groups = cities.map(c => [c, places.filter(p => sameCity(p.city, c))]);
  const strays = chosen.filter(p => !cities.some(c => sameCity(c, p.city)));

  async function generate() {
    const st = stays.map(s => ({ city: s.city, days: s.days, base: hotels[s.city] && hotels[s.city].trim() ? { name: hotels[s.city].trim() } : null }));
    const trip = { days: total, startDate, stays: st, prefs: { pace, transport, notes: notes.trim() } };
    const country = (chosen.find(p => p.country && cities.some(c => sameCity(c, p.city))) || chosen.find(p => p.country) || {}).country || '';
    await job.run(async (onText, signal) => {
      const groupsByCity = {};
      for (const s of st) groupsByCity[s.city] = clusterIntoDays(chosen.filter(p => sameCity(p.city, s.city)), s.days, null);
      const prompt = buildPlanPrompt({ trip, stays: st, places: chosen, groupsByCity, lang: ctx.prefs.aiLang, allowSuggest: suggest });
      const raw = await ctx.ai.json(prompt, { tier: ctx.prefs.deepPlan ? 'complex' : 'default', onText, signal, cache: false });
      const byId = Object.fromEntries(chosen.map(p => [p.id, p]));
      const plan = normalizePlan(raw, byId, { startDate, stays: st, placeIds: chosen.map(p => p.id), city: st[0].city, country, currency: currencyOf(country) });
      if (!plan.days.length) throw { code: 'invalid_json' };
      const now = Date.now();
      const id = replacing ? replacing.id : uid('t');
      const doc = {
        id, title: plan.title || `${cities.join(' · ')} ${total} 日`, city: st[0].city, cities, country, days: total, startDate, stays: st, base: plan.base,
        prefs: { ...trip.prefs, suggest }, budget: num(budget) > 0 ? num(budget) : null, placeIds: chosen.map(p => p.id), plan, changed: [], skipped: [],
        createdBy: replacing ? replacing.createdBy || null : ctx.me, example: false, createdAt: replacing ? replacing.createdAt || now : now, updatedAt: now,
      };
      if (await ctx.write('set', 'trips', id, doc)) {
        ctx.toast('行程排好了');
        onClose();
        if (!replacing) ctx.nav.push({ name: 'trip', id, tabGroup: 'trips' });
      }
    });
  }
  const footer = job.phase === 'working' ? null : html`
    <span class="hint num" style=${{ marginRight: 'auto' }}>${chosen.length} 个地点 · ${total} 天</span>
    <button class="btn" onClick=${onClose}>取消</button>
    <button class="btn green" disabled=${!ctx.ai.ok || !chosen.length || !cities.length} onClick=${generate}><${Icon} name="sparkle" size=${16} />${replacing ? '重新排' : '生成行程'}</button>`;
  return html`<${Sheet} title=${replacing ? '改城市或天数，重新排' : '排行程'} onClose=${onClose} footer=${footer} wide>
    ${job.phase === 'working' ? html`<${AiProgress} label="正在排路线" text=${job.stream} started=${job.started} onStop=${job.stop} counter=${t => `已排 ${(t.match(/"time"\s*:/g) || []).length} 站`} />` : html`
      <div class="field"><span class="label">去哪些城市（按顺序）</span>
        ${cities.length ? html`<div class="stack" style=${{ gap: '8px' }}>${stays.map((s, i) => html`<div class="stay-row" key=${s.city}>
          <div class="row"><span class="order num">${i + 1}</span><b class="grow">${s.city}</b>
            ${cities.length > 1 ? html`<div class="stepper" aria-label=${s.city + ' 天数'}><button aria-label="少一天" onClick=${() => setCityDays(i, s.days - 1)}><${Icon} name="minus" size=${16} /></button><b>${s.days} 天</b><button aria-label="多一天" onClick=${() => setCityDays(i, s.days + 1)}><${Icon} name="plus" size=${16} /></button></div>` : null}
            ${cities.length > 1 && i > 0 ? html`<button class="icon-btn" aria-label=${'把 ' + s.city + ' 往前挪'} onClick=${() => moveCity(i, -1)}><${Icon} name="back" size=${18} /></button>` : null}
            <button class="icon-btn" aria-label=${'去掉 ' + s.city} onClick=${() => removeCity(s.city)}><${Icon} name="x" size=${18} /></button></div>
          <input class="input" aria-label=${s.city + ' 住哪里'} value=${hotels[s.city] || ''} onInput=${e => setHotels(h => ({ ...h, [s.city]: e.target.value }))}
            placeholder=${i > 0 ? '住哪里（不填 = 当天往返，从上一个城市出发）' : '住哪里（酒店名或区域，可选）'} />
        </div>`)}</div>` : html`<p class="hint">先选一个城市。</p>`}
        ${others.length ? html`<div class="chips wrap" style=${{ marginTop: '4px' }}>${others.map(c => html`<button class="chip outline" onClick=${() => addCity(c)}><${Icon} name="plus" size=${14} />${c} <span class="n">${countIn(c)}</span></button>`)}</div>` : null}
        <form class="row" onSubmit=${e => { e.preventDefault(); addCity(newCity); }}>
          <input class="input" list="known-cities" value=${newCity} onInput=${e => setNewCity(e.target.value)} placeholder="输入其他城市，例如 釜山、清迈、巴黎" aria-label="添加城市" />
          <button class="btn" disabled=${!newCity.trim()}>添加</button></form>
      </div>
      <div class="grid2">
        <div class="field"><span class="label">一共几天</span>
          <div class="stepper"><button aria-label="少一天" onClick=${() => setTotal(total - 1)}><${Icon} name="minus" size=${16} /></button><b class="num">${total} 天</b><button aria-label="多一天" onClick=${() => setTotal(total + 1)}><${Icon} name="plus" size=${16} /></button></div></div>
        <div class="field"><label for="tp-date">出发日期（可选）</label><input id="tp-date" class="input" type="date" value=${startDate} onInput=${e => setStartDate(e.target.value)} /></div>
      </div>
      <div class="grid2">
        <div class="field"><span class="label">节奏</span><div class="chips wrap">${Object.entries(PACES).map(([k, v]) => html`<button class="chip" aria-pressed=${pace === k} onClick=${() => setPace(k)}>${v}</button>`)}</div></div>
        <div class="field"><span class="label">交通</span><div class="chips wrap">${Object.entries(TRANSPORTS).map(([k, v]) => html`<button class="chip" aria-pressed=${transport === k} onClick=${() => setTransport(k)}>${v}</button>`)}</div></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="tp-budget">预算（${ctx.home}，可选）</label><input id="tp-budget" class="input" inputmode="decimal" value=${budget} onInput=${e => setBudget(e.target.value)} placeholder="例如 5000" /></div>
        <div class="field"><label for="tp-notes">其他要求（可选）</label><input id="tp-notes" class="input" value=${notes} onInput=${e => setNotes(e.target.value)} placeholder="例如：带老人少走路、想看日落" /></div>
      </div>
      <label class="check-row" style=${{ padding: 0 }}><input type="checkbox" checked=${suggest} onChange=${e => setSuggest(e.target.checked)} /><span>允许 AI 补充顺路的吃饭推荐（会标「AI 推荐」）</span></label>
      <div class="field">
        <div class="row" style=${{ justifyContent: 'space-between' }}><span class="label">要去的地点（${chosen.length}）</span>
          <span class="row"><button class="btn ghost sm" onClick=${() => setPicked(new Set([...picked, ...groups.flatMap(([, l]) => l.map(p => p.id))]))}>全选</button><button class="btn ghost sm" onClick=${() => setPicked(new Set())}>全不选</button></span></div>
        <div class="checklist">
          ${groups.map(([c, list]) => html`<div key=${c}><p class="group-label">${c}</p>
            ${list.length ? list.map(p => html`<label key=${p.id} class="check-row"><input type="checkbox" checked=${picked.has(p.id)} onChange=${() => toggle(p.id)} />
              <span class="grow">${p.name} <span class="hint">${p.area || ''}</span></span>
              ${p.status === 'want' ? html`<span class="tag shopping">想去</span>` : p.status === 'visited' ? html`<span class="tag plain">去过</span>` : html`<${CatTag} cat=${p.category} />`}</label>`)
              : html`<p class="hint" style=${{ padding: '4px 8px 8px' }}>还没有收藏，AI 会按${c}的热门地点推荐。</p>`}</div>`)}
          ${strays.length ? html`<div><p class="group-label">其他城市</p>${strays.map(p => html`<label key=${p.id} class="check-row"><input type="checkbox" checked=${true} onChange=${() => toggle(p.id)} /><span class="grow">${p.name} <span class="hint">${p.city}</span></span></label>`)}</div>` : null}
        </div>
      </div>
      ${!ctx.ai.ok ? html`<${Notice} warn>${ctx.ai.reason}<//>` : null}
      ${job.error ? html`<${Notice} warn role="alert">${job.error}<//>` : null}`}
  <//>`;
}

function AddToTripSheet({ ctx, placeIds, onClose }) {
  const ids = (placeIds || []).filter(id => ctx.placesById[id]);
  const list = ctx.trips.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const one = ids.length === 1 ? ctx.placesById[ids[0]] : null;
  async function add(t) {
    const r = await addPlacesToTrip(ctx, t, ids);
    if (!r) return;
    ctx.toast(r.added ? `已加入「${tripTitle(t)}」的待安排` : '已经在这趟行程里了');
    onClose();
  }
  return html`<${Sheet} title="加入行程" onClose=${onClose} footer=${html`<button class="btn green block" onClick=${() => ctx.openSheet({ type: 'trip', placeIds: ids })}><${Icon} name="plus" size=${18} />新建一趟行程</button>`}>
    ${one ? html`<div class="row" style=${{ gap: '12px' }}><${Photo} id=${one.coverAssetId} cat=${one.category} className="thumb" /><div class="grow"><b>${one.name}</b><p class="hint">${[one.area, one.city].filter(Boolean).join(' · ')}</p></div></div>`
      : html`<p class="hint">${ids.length} 个地点</p>`}
    ${list.length ? html`<div class="stack" style=${{ gap: '8px' }}>${list.map(t => {
      const sched = scheduledIds(t);
      const inside = ids.every(id => sched.has(id) || (t.placeIds || []).includes(id));
      const fits = ids.some(id => tripCities(t).some(c => sameCity(c, ctx.placesById[id].city)));
      return html`<button class="pick-trip" key=${t.id} onClick=${() => add(t)}>
        <${Flag} country=${t.country} />
        <span class="grow"><b>${tripTitle(t)}</b><small>${[tripCities(t).join(' → '), tripDates(t)].join(' · ')}${!fits ? ' · 不在这趟的城市里' : ''}</small></span>
        <span class=${'tag ' + (inside ? 'plain' : 'ai')}>${inside ? '已在行程里' : '加入'}</span></button>`;
    })}</div>` : html`<p class="hint">还没有行程。新建一趟，把这些地点排进去。</p>`}
    <p class="hint">加入后会先放在行程的「待安排」，再让 AI 排进合适的那一天。</p>
  <//>`;
}

function StopSheet({ ctx, trip, dayIndex, stopIndex, onClose }) {
  const plan = planOf(trip);
  const day = plan.days[dayIndex];
  const s = day && (day.stops || [])[stopIndex];
  if (!s) return html`<${Sheet} title="这一站" onClose=${onClose}><p class="hint">这一站已经不在行程里了。</p><//>`;
  const p = s.placeId ? ctx.placesById[s.placeId] : null;
  const cur = plan.currency || tripCurrency(trip, ctx.places);
  const base = baseForDay(trip, dayIndex);
  const prevRaw = stopIndex > 0 ? day.stops[stopIndex - 1] : base && base.name ? base : null;
  const prev = prevRaw ? { ...prevRaw, city: prevRaw.city || day.city, country: prevRaw.country || trip.country } : null;
  const here = { ...s, city: s.city || day.city, country: s.country || trip.country };
  const spendHome = s.spend ? toHome(s.spend, cur, ctx.fx, ctx.home) : null;
  const clone = () => plan.days.map(d => ({ ...d, stops: (d.stops || []).slice() }));
  const keepChanged = days => (trip.changed || []).filter(k => !days.some(d => k.startsWith(d + ':')));
  const save = (days, touched, extra = {}) => ctx.write('update', 'trips', trip.id, { plan: { days, ...extra }, changed: keepChanged(touched), updatedAt: Date.now() });
  async function swap(dir) {
    const days = clone(), list = days[dayIndex].stops, k = stopIndex + dir;
    const a = list[stopIndex], b = list[k];
    list[stopIndex] = { ...b, time: a.time };
    list[k] = { ...a, time: b.time };
    if (await save(days, [dayIndex])) onClose();
  }
  async function toDay(j) {
    const days = clone();
    const [x] = days[dayIndex].stops.splice(stopIndex, 1);
    days[j].stops.push({ ...x, travel: null });
    if (await save(days, [dayIndex, j])) { ctx.toast(`已移到 Day ${j + 1} 的最后，交通可以让 AI 重新算`); onClose(); }
  }
  async function remove() {
    const days = clone();
    days[dayIndex].stops.splice(stopIndex, 1);
    const unplaced = plan.unplaced.slice();
    if (s.placeId && !unplaced.some(u => u.placeId === s.placeId)) unplaced.push({ placeId: s.placeId, reason: '从行程里移出' });
    if (await save(days, [dayIndex], { unplaced })) { ctx.toast(s.placeId ? '已移到「待安排」' : '已删除这一站'); onClose(); }
  }
  const facts = [
    ['时间', [s.time, stayHint(s.stayMin)].filter(Boolean).join(' · ')],
    ['花费', s.spend ? `约 ${fmtMoney(s.spend, cur)}${spendHome != null && cur !== ctx.home ? ` · ≈ ${fmtMoney(spendHome, ctx.home, true)}` : ''}` : s.spend === 0 ? '免费' : ''],
    ['怎么过来', travelLine(s.travel, cur)],
  ].filter(f => f[1]);
  return html`<${Sheet} title=${`Day ${dayIndex + 1} · 第 ${stopIndex + 1} 站`} onClose=${onClose}>
    <div class="row" style=${{ gap: '12px', alignItems: 'flex-start' }}>
      <${Photo} id=${p && p.coverAssetId} cat=${s.category} className="thumb" />
      <div class="grow"><h3 style=${{ fontSize: '18px', fontWeight: 800 }}>${s.name}</h3>
        ${s.nameLocal && s.nameLocal !== s.name ? html`<p class="hint">${s.nameLocal}</p>` : null}
        <div class="row wrap" style=${{ marginTop: '6px', gap: '6px' }}>${s.kind === 'transfer' ? html`<span class="tag transport">换城市</span>` : html`<${CatTag} cat=${s.category} />`}${s.suggested ? html`<span class="tag ai">AI 推荐</span>` : null}</div></div>
    </div>
    ${s.what ? html`<p>${s.what}</p>` : null}
    ${s.tip ? html`<div class="ai-box"><h3><${Icon} name="bot" size=${17} />小贴士</h3><p>${s.tip}</p></div>` : null}
    ${facts.length ? html`<dl class="facts">${facts.map(([k, v]) => html`<div><dt>${k}</dt><dd>${v}</dd></div>`)}${facts.length % 2 ? html`<div></div>` : null}</dl>` : null}
    <div class="row wrap">
      ${s.kind !== 'transfer' ? html`<${ExtLink} href=${placeLink(here, ctx.prefs.mapPref)}><${Icon} name="map" size=${15} />地图<//>` : null}
      ${prev ? html`<${ExtLink} href=${legLink(prev, here, (s.travel && s.travel.mode) || 'walk', ctx.prefs.mapPref)}><${Icon} name="compass" size=${15} />路线<//>` : null}
      ${p ? html`<button class="btn sm" onClick=${() => { onClose(); ctx.nav.push({ name: 'place', id: p.id }); }}><${Icon} name="info" size=${15} />地点详情</button>` : null}
      ${p ? html`<button class="btn sm" onClick=${() => ctx.write('update', 'places', p.id, { status: p.status === 'visited' ? 'want' : 'visited', updatedAt: Date.now() })}><${Icon} name="check" size=${15} />${p.status === 'visited' ? '改回没去过' : '标记去过'}</button>` : null}
    </div>
    <div class="field"><span class="label">调整顺序</span>
      <div class="row wrap">
        <button class="btn sm" disabled=${stopIndex === 0} onClick=${() => swap(-1)}>往前一站</button>
        <button class="btn sm" disabled=${stopIndex === day.stops.length - 1} onClick=${() => swap(1)}>往后一站</button>
        ${plan.days.length > 1 ? plan.days.map((d, j) => (j === dayIndex ? null : html`<button class="btn sm" key=${j} onClick=${() => toDay(j)}>移到 Day ${j + 1}</button>`)) : null}
      </div></div>
    <div><${ConfirmButton} className="sm" label="从这一天移除" armedLabel="确认移除" icon="trash" onConfirm=${remove} /></div>
  <//>`;
}

function TripMenuSheet({ ctx, trip, onClose }) {
  const [manual, setManual] = useState('');
  async function share() {
    const text = tripToText(trip);
    if (await copyText(text)) { ctx.toast('已复制，可以直接发给旅伴'); onClose(); } else setManual(text);
  }
  async function exportMd() {
    const md = tripToMarkdown(trip, ctx.placesById);
    if (!ctx.downloads) return setManual(md);
    try { await ctx.downloads.save({ filename: `${tripTitle(trip)}.md`, data: md }); ctx.toast('已导出'); onClose(); } catch (e) { if (!e || e.code !== 'declined') setManual(md); }
  }
  async function remove() {
    if (await ctx.write('remove', 'trips', trip.id)) {
      for (const e of ctx.expenses.filter(x => x.tripId === trip.id)) await ctx.write('remove', 'expenses', e.id);
      ctx.toast('行程已删除'); onClose(); ctx.nav.back();

function inlineMd(s) {
  return s.split(/(\*\*[^*]+\*\*)/g).map((x, i) => (/^\*\*[^*]+\*\*$/.test(x) ? html`<b key=${i}>${x.slice(2, -2)}</b>` : x));
}
/** Paragraphs, bullet lists and **bold** from Claude's reply, built as nodes (never as HTML). */
function RichText({ text }) {
  const blocks = [];
  let list = null;
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trim();
    const m = /^(?:[-•*]|\d+[.、)])\s*(.+)$/.exec(line);
    if (m && line.length > 2) { if (!list) { list = []; blocks.push(list); } list.push(m[1]); continue; }
    list = null;
    if (line) blocks.push(line.replace(/^#+\s*/, ''));
  }
  return blocks.map((b, i) => (Array.isArray(b) ? html`<ul key=${i}>${b.map((x, j) => html`<li key=${j}>${inlineMd(x)}</li>`)}</ul>` : html`<p key=${i}>${inlineMd(b)}</p>`));
}
function mentionedPlaces(text, places) {
  const t = String(text || '');
  return places.filter(p => p.name && p.name.length >= 2 && t.includes(p.name))
    .sort((a, b) => (b.coverAssetId ? 1 : 0) - (a.coverAssetId ? 1 : 0)).slice(0, 4);
}
function fmtClock(ts) {
  const d = new Date(ts || Date.now());
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function AssistantView({ ctx }) {

  const toEnd = smooth => window.scrollTo({ top: document.documentElement.scrollHeight, behavior: smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto' });
  useEffect(() => { if (endRef.current) toEnd(true); }, [msgs.length, busy]);
  useEffect(() => { if (busy && innerHeight + scrollY >= document.documentElement.scrollHeight - 240) toEnd(false); }, [msgs]);
  useEffect(() => {
    const a = ctx.ask;
    if (!a || a.n === lastAsk.current) return;
    lastAsk.current = a.n;
    ctx.clearAsk();

    if (ctx.ai.ok && !busy) send(a.prompt, a.focus); else setInput(a.prompt);

  async function send(text, focusText) {
    const message = String(text || '').trim();

    const history = msgs.filter(m => !m.error && !m.pending && (m.text || m.raw));
    const mine = { id: uid('m'), role: 'me', text: message, at: Date.now() };
    const reply = { id: uid('m'), role: 'ai', text: '', raw: '', actions: [], done: {}, at: Date.now(), pending: true };

    const turns = buildAssistantTurns({ context, history, message });
    ctl.current = new AbortController();

  const greet = `你好！我看过你们收藏的 ${ctx.places.length} 个地点${ctx.trips.length ? `和 ${ctx.trips.length} 趟行程` : ''}。想怎么玩？可以直接问，也可以点上面的快捷问题。需要改收藏或行程时，我会先给建议，你点确认后才会改。`;

    </header>

      <span style=${{ color: `var(--c-${color})` }}><${Icon} name=${icon} size=${18} /></span>${label}</button>`)}</div>
    ${focus ? html`<div class="focus-chip"><${Icon} name="info" size=${15} /><span class="grow">${focus.replace(/^用户在看(行程|地点) \S+ ?/, '正在聊：')}</span><button class="icon-btn" aria-label="不再针对这个" onClick=${() => setFocus('')}><${Icon} name="x" size=${16} /></button></div>` : null}
    ${!ctx.ai.ok ? html`<div style=${{ marginTop: '14px' }}><${Notice} warn>${ctx.ai.reason}<//></div>` : null}
    <div class="msgs" aria-live="polite">

function GuideSheet({ ctx, initial, onClose }) {
  const [text, setText] = useState((initial && initial.text) || '');
  const [cityHint, setCityHint] = useState('');
  const m = useMedia(ctx.ai.images ? ctx.ai.images.maxCount : 0, ctx.toast);
  const job = useAiJob(ctx);
  const url = pickUrl(text), platform = detectPlatform(url || text), title = shareTitle(text), words = contentText(text);
  async function generate() {
    await job.run(async (onText, signal) => {
      const prompt = buildGuidePrompt({ text, url, platform, cityHint: cityHint.trim(), imageCount: m.media.length, lang: ctx.prefs.aiLang, knownCities: ctx.cities });
      const raw = await ctx.ai.json(prompt, { images: m.media.map(x => x.blob), onText, signal });
      const g = normalizeGuide(raw, { cityHint: cityHint.trim(), title });
      const imageAssetIds = [];
      if (ctx.assets) for (const x of m.media.slice(0, 6)) { try { imageAssetIds.push((await ctx.assets.upload(await shrinkImage(x.blob, 1080, 0.8))).id); } catch { break; } }
      const now = Date.now();
      const doc = { id: uid('g'), ...g, source: { platform: url ? platform : 'manual', url: url || '', title: title || g.title }, checked: [], savedPlaceIds: [], imageAssetIds, savedVia: 'app', createdBy: ctx.me, example: false, createdAt: now, updatedAt: now };
      if (await ctx.write('set', 'guides', doc.id, doc)) { ctx.toast('攻略整理好了'); onClose(); ctx.nav.push({ name: 'guide', id: doc.id, tabGroup: 'trips' }); }
    });

  return html`<${Sheet} title="整理攻略" onClose=${onClose} footer=${footer}>
    ${job.phase === 'working' ? html`<${AiProgress} label="正在整理步骤" text=${job.stream} started=${job.started} onStop=${job.stop} counter=${t => `已写 ${(t.match(/"title"\s*:/g) || []).length} 步`} />` : html`
      <p class="hint">把教你"怎么去、怎么玩"的帖子交给 AI：它读文字和截图（视频会自动截帧），整理成一步一步的走法，每一步都能打开导航。</p>

        <textarea id="g-text" class="input" rows="5" value=${text} onInput=${e => setText(e.target.value)} onPaste=${m.onPaste} placeholder="粘贴攻略正文，或分享链接 + 截图"></textarea></div>
      ${url && words.length < 40 && !m.media.length ? html`<${Notice} warn>只有链接时，这个页面里的 AI 看不到内容。加截图或视频，或者点「交给 Agent」：Claude Code 会下载视频、截帧、把语音转成文字后再整理。<//>` : null}
      <${MediaPicker} m=${m} aiOk=${ctx.ai.ok} />

/* ---------- add / edit places ---------- */
function AddSheet({ ctx, initial, onClose }) {
  const [text, setText] = useState((initial && initial.text) || '');
  const [cityHint, setCityHint] = useState('');
  const m = useMedia(ctx.ai.images ? ctx.ai.images.maxCount : 0, ctx.toast);
  const media = m.media;
  const job = useAiJob(ctx);
  const [result, setResult] = useState(null);
  const [saving, setSaving] = useState(false);
  const url = pickUrl(text);
  const platform = detectPlatform(url || text);
  const title = shareTitle(text);
  const words = contentText(text);
  const thin = !!url && words.length < 40 && !media.length;

  async function identify() {
    await job.run(async (onText, signal) => {
      const prompt = buildExtractPrompt({ text, url, platform, cityHint: cityHint.trim(), imageCount: media.length, lang: ctx.prefs.aiLang, knownCities: ctx.cities });
      const raw = await ctx.ai.json(prompt, { images: media.map(x => x.blob), onText, signal });
      const norm = normalizeExtraction(raw, { cityHint: cityHint.trim(), title });
      norm.places = norm.places.map(p => { const dup = findDuplicate(p, ctx.places); return { ...p, _dup: dup, _keep: !dup }; });
      setResult(norm);
    });
  }
  async function save() {
    const keep = result.places.filter(p => p._keep);
    if (!keep.length) return onClose();
    setSaving(true);
    // Upload the screenshots that became covers plus a few more for each card's photo strip, once each.
    const wanted = [...new Set([...keep.map(p => p._img || 0), 0, 1, 2, 3])].filter(i => i < media.length);
    const ids = [];
    if (ctx.assets) {
      for (const i of wanted) {
        try { ids[i] = (await ctx.assets.upload(await shrinkImage(media[i].blob, 1080, 0.82))).id; } catch { break; /* the rest save without pictures */ }
      }
    }
    const source = { platform: url ? platform : 'manual', url: url || '', title: result.post.title || title || '' };
    const credit = { text: `图：${PLATFORMS[source.platform] || '截图'}${source.title ? ' · ' + source.title : ''}`, source: source.url || '' };
    let n = 0;
    for (const p of keep) {
      const { _dup, _keep, _img, evidence, ...clean } = p;
      const coverAssetId = ids[_img || 0] || ids.find(Boolean) || null;
      const photoIds = coverAssetId ? [coverAssetId, ...ids.filter(id => id && id !== coverAssetId)].slice(0, 4) : [];
      const doc = makePlaceDoc(clean, { source: { ...source, evidence }, coverAssetId, photoIds, coverCredit: coverAssetId ? credit : null, savedVia: 'app', createdBy: ctx.me });
      if (await ctx.write('set', 'places', doc.id, doc)) n++;
    }

    if (n) { ctx.toast(`已收藏 ${n} 个地点`); onClose(); }
  }

    const doc = { id: uid('i'), text: text.slice(0, 4000), url: url || '', platform, cityHint: cityHint.trim(), mode: 'collect', status: 'pending', message: '', createdBy: ctx.me, createdAt: Date.now() };

  } else if (review) {
    footer = html`
      <button class="btn ghost" onClick=${() => setResult(null)}>返回修改</button>
      <button class="btn green" disabled=${saving || !keepCount} onClick=${save}><${Icon} name="heart" size=${16} />${saving ? '保存中…' : `收藏 ${keepCount} 个地点`}</button>`;
  }
  return html`<${Sheet} title="保存旅行灵感" onClose=${onClose} footer=${footer}>
    ${job.phase === 'working' ? html`<${AiProgress} label="正在识别地点" text=${job.stream} started=${job.started} onStop=${job.stop} counter=${t => `已找到 ${(t.match(/"name"\s*:/g) || []).length} 个`} />`
    : review ? html`<div class="stack">
        <div><b>${result.post.title || title || '识别结果'}</b>${result.post.summary ? html`<p class="hint">${result.post.summary}</p>` : null}</div>
        ${media.length > 1 && keepCount ? html`<p class="hint">点地点左边的图换一张，选最能代表它的截图当照片。</p>` : null}
        ${!result.places.length ? html`<${Notice} warn>没找到具体地点。加几张截图（店名常在图里），或者交给 Agent 读取原帖。<//>` : null}
        ${result.places.map((p, i) => html`<div key=${i} class=${'review-item' + (p._keep ? '' : ' off')}>
          <input type="checkbox" id=${'keep-' + i} checked=${p._keep} onChange=${e => setPlace(i, { _keep: e.target.checked })} aria-label=${'保留 ' + p.name} />
          <button class="rv-photo" disabled=${media.length < 2} onClick=${() => setPlace(i, { _img: ((p._img || 0) + 1) % media.length })}

const TABS = [['home', '首页', 'home'], ['library', '收藏', 'heart'], ['trips', '行程', 'trips'], ['assistant', 'AI 助手', 'bot']];
function App() {
  const [rt, setRt] = useState(null);
  const storeRef = useRef(null);
  const [data, setData] = useState(() => Object.fromEntries(COLLECTIONS.map(c => [c, null])));
  const [prefs, setPrefs] = useState(loadPrefs);
  const [sheet, setSheet] = useState(null);
  const [nav, setNav] = useState(() => ({ tab: TABS.some(t => t[0] === loadPrefs().tab) ? loadPrefs().tab : 'home', stack: [] }));
  const [toast, setToastState] = useState(null);
  const [ai, setAi] = useState({ ok: false, images: null, reason: '正在连接 Claude…' });
  const [canWrite, setCanWrite] = useState(true);
  const [me, setMe] = useState(null);
  const [ask, setAsk] = useState(null);
  const toastTimer = useRef(null);
  const scrolls = useRef([]);

  const showToast = useCallback(msg => {
    setToastState(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastState(null), 3400);
  }, []);
  const setPref = useCallback(patch => setPrefs(p => { const n = { ...p, ...patch }; savePrefs(n); return n; }), []);
  const navApi = useMemo(() => ({
    go: tab => { scrolls.current = []; setNav({ tab, stack: [] }); setPref({ tab }); window.scrollTo(0, 0); },
    push: route => { scrolls.current.push(window.scrollY); setNav(n => ({ ...n, stack: [...n.stack, route] })); window.scrollTo(0, 0); },
    back: () => { const y = scrolls.current.pop() || 0; setNav(n => ({ ...n, stack: n.stack.slice(0, -1) })); requestAnimationFrame(() => window.scrollTo(0, y)); },
    patch: p => setNav(n => (n.stack.length ? { ...n, stack: [...n.stack.slice(0, -1), { ...n.stack[n.stack.length - 1], ...p }] } : n)),
  }), []);

  useEffect(() => {
    let unsubs = [], alive = true;
    connectRuntime().then(r => {
      if (!alive) return;
      const store = createStore(r.db);
      storeRef.current = store;
      setRt(r);
      for (const col of COLLECTIONS) {
        unsubs.push(store.subscribe(col, list => setData(d => ({ ...d, [col]: list })), err => {
          setData(d => ({ ...d, [col]: d[col] || [] }));
          if (err && err.code !== 'revoked') showToast('数据连接中断了，刷新页面试试');
        }));
      }
      if (r.sample) {
        r.sample.limits().then(l => alive && setAi({ ok: true, images: l && l.images ? l.images : null, reason: '' }))
          .catch(() => alive && setAi({ ok: true, images: null, reason: '' }));
      } else {
        setAi({ ok: false, images: null, reason: AI_ERRORS.not_available });
      }
      if (r.user) {
        r.user.can('data.write').then(v => alive && setCanWrite(v !== false)).catch(() => {});
        r.user.id().then(id => alive && setMe(id || null)).catch(() => {});
      }
    });
    return () => { alive = false; unsubs.forEach(u => u && u()); };
  }, []);

  const write = useCallback(async (op, col, id, payload) => {
    const store = storeRef.current;
    if (!store) { showToast('还没连上数据库，稍等再试'); return false; }
    try {
      if (op === 'set') await store.set(col, id, payload && payload.createdBy === undefined && col !== 'meta' && col !== 'maps' ? { ...payload, createdBy: me } : payload);
      else if (op === 'update') await store.update(col, id, payload);
      else await store.remove(col, id);
      return true;
    } catch (e) {
      const code = e && e.code;
      showToast(code === 'quota_exceeded' ? '存储空间满了，删掉一些旧数据再试' : !canWrite ? '你只有查看权限，不能修改' : '保存失败了，再试一次');
      return false;
    }
  }, [canWrite, me]);

  const places = data.places || [];
  const placesById = useMemo(() => Object.fromEntries(places.map(p => [p.id, p])), [data.places]);
  const cities = useMemo(() => {
    const c = {};
    for (const p of places) if (p.city) c[p.city] = (c[p.city] || 0) + 1;
    return Object.keys(c).sort((a, b) => c[b] - c[a]);
  }, [data.places]);
  const meta = data.meta || [];
  const ctx = {
    places, placesById, cities, trips: data.trips || [], guides: data.guides || [], inbox: data.inbox || [], expenses: data.expenses || [],
    maps: data.maps || [], fx: meta.find(d => d.id === 'fx') || null, appMeta: meta.find(d => d.id === 'app') || null,
    loading: Object.fromEntries(COLLECTIONS.map(c => [c, data[c] == null])),
    prefs, setPref, home: CURRENCIES[prefs.home] ? prefs.home : 'MYR', write, toast: showToast, me, canWrite,
    user: rt && rt.user, assets: rt && rt.assets, downloads: rt && rt.downloads, permissions: rt && rt.permissions,
    ai: {
      ...ai,
      json: (prompt, o) => (rt && rt.sample ? rt.sample.json(prompt, sampleOpts(o)) : Promise.reject({ code: 'not_available' })),
      chat: (turns, o) => (rt && rt.sample ? rt.sample(turns, { ...sampleOpts(o), cache: false }) : Promise.reject({ code: 'not_available' })),
    },
    nav: navApi, openSheet: s => setSheet(s),
    askAssistant: (prompt, focus) => { setAsk({ prompt, focus, n: Date.now() }); navApi.go('assistant'); },
    ask, clearAsk: () => setAsk(null),
    onAiBlocked: code => setAi(a => ({ ...a, ok: false, reason: AI_ERRORS[code] || AI_ERRORS.not_available })),
  };

  const top = nav.stack[nav.stack.length - 1];
  const depth = nav.stack.length;
  let main;
  if (top && top.name === 'trip') main = html`<${TripView} key=${'t' + depth + top.id} ctx=${ctx} id=${top.id} tab=${top.tab} day=${top.day} />`;
  else if (top && top.name === 'place') main = html`<${PlaceView} key=${'p' + depth + top.id} ctx=${ctx} id=${top.id} />`;
  else if (top && top.name === 'map') main = html`<${MapModeView} key=${'m' + depth} ctx=${ctx} />`;
  else if (top && top.name === 'guides') main = html`<${GuidesView} ctx=${ctx} />`;
  else if (top && top.name === 'guide') main = html`<${GuideView} key=${'g' + depth + top.id} ctx=${ctx} id=${top.id} />`;
  else if (top && top.name === 'inbox') main = html`<${InboxView} ctx=${ctx} />`;
  else if (nav.tab === 'library') main = html`<${LibraryView} ctx=${ctx} />`;
  else if (nav.tab === 'trips') main = html`<${TripsView} ctx=${ctx} />`;
  else if (nav.tab === 'assistant') main = html`<${AssistantView} ctx=${ctx} />`;
  else main = html`<${HomeView} ctx=${ctx} />`;
  const activeTab = top ? top.tabGroup || nav.tab : nav.tab;

  let sheetEl = null;
  const close = () => setSheet(null);
  const sTrip = sheet && sheet.tripId ? ctx.trips.find(t => t.id === sheet.tripId) : null;
  if (sheet) {
    const k = sheet.type;
    if (k === 'add') sheetEl = html`<${AddSheet} ctx=${ctx} initial=${sheet} onClose=${close} />`;
    else if (k === 'guide') sheetEl = html`<${GuideSheet} ctx=${ctx} initial=${sheet} onClose=${close} />`;
    else if (k === 'place' && placesById[sheet.id]) sheetEl = html`<${PlaceEditSheet} ctx=${ctx} place=${placesById[sheet.id]} onClose=${close} />`;
    else if (k === 'trip') sheetEl = html`<${TripFormSheet} ctx=${ctx} initial=${sheet} onClose=${close} />`;
    else if (k === 'addToTrip') sheetEl = html`<${AddToTripSheet} ctx=${ctx} placeIds=${sheet.placeIds} onClose=${close} />`;
    else if (k === 'filter') sheetEl = html`<${FilterSheet} ctx=${ctx} onClose=${close} />`;
    else if (k === 'settings') sheetEl = html`<${SettingsSheet} ctx=${ctx} onClose=${close} />`;
    else if (k === 'chatMore') sheetEl = html`<${ChatMoreSheet} ctx=${ctx} clear=${sheet.clear} onClose=${close} />`;
    else if (sTrip && k === 'tripMenu') sheetEl = html`<${TripMenuSheet} ctx=${ctx} trip=${sTrip} onClose=${close} />`;
    else if (sTrip && k === 'tripEdit') sheetEl = html`<${TripEditSheet} ctx=${ctx} trip=${sTrip} onClose=${close} />`;
    else if (sTrip && k === 'revise') sheetEl = html`<${ReviseSheet} ctx=${ctx} trip=${sTrip} dayIndex=${sheet.dayIndex} preset=${sheet.preset} onClose=${close} />`;
    else if (sTrip && k === 'stop') sheetEl = html`<${StopSheet} ctx=${ctx} trip=${sTrip} dayIndex=${sheet.dayIndex} stopIndex=${sheet.stopIndex} onClose=${close} />`;
    else if (sTrip && k === 'expense') sheetEl = html`<${ExpenseSheet} ctx=${ctx} trip=${sTrip} expense=${sheet.expenseId ? ctx.expenses.find(e => e.id === sheet.expenseId) : null} onClose=${close} />`;
  }
  const pendingInbox = ctx.inbox.filter(i => i.status === 'pending').length;
  const offline = rt && storeRef.current && !storeRef.current.live;

  const tabIndex = TABS.findIndex(([k]) => k === activeTab);
  return html`<div class="shell">
    <nav class="nav" aria-label="主菜单" data-lens=${tabIndex >= 0 ? '' : null} style=${{ '--tab': Math.max(0, tabIndex) }}>
      <div class="rail-brand"><${BrandMark} size=${44} /><b>旅用</b></div>
      ${TABS.map(([k, label, icon]) => html`<button key=${k} aria-current=${activeTab === k ? 'page' : null} onClick=${() => navApi.go(k)}
          aria-label=${k === 'home' && pendingInbox ? `${label}（${pendingInbox} 条链接待处理）` : null}>
        <span class="ic-wrap"><${Icon} name=${activeTab === k && k === 'library' ? 'heartFill' : icon} size=${24} stroke=${activeTab === k ? 2.1 : 1.8} />${k === 'home' && pendingInbox ? html`<span class="badge num" aria-hidden="true">${pendingInbox}</span>` : null}</span>${label}</button>`)}
    </nav>
    ${offline ? html`<div class="banner">离线预览：在 claude.ai 打开这个页面才会保存数据。</div>` : null}
    ${!canWrite ? html`<div class="banner">你只有查看权限：可以浏览，不能添加或修改。</div>` : null}
    <main>${main}</main>
    <datalist id="known-cities">${cities.map(c => html`<option value=${c}></option>`)}</datalist>
    ${sheetEl}
    ${toast ? html`<div class="toast" role="status">${toast}</div>` : null}
  </div>`;
}
function sampleOpts(o = {}) {
  const opts = { modelTier: o.tier || 'default' };
  if (o.onText) opts.onText = ({ text }) => o.onText(text);
  if (o.signal) opts.signal = o.signal;
  if (o.images && o.images.length) opts.images = o.images;
  if (o.cache === false) opts.cache = false;
  return opts;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
